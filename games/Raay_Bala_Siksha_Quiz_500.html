<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>రాయ్ బాల శిక్ష క్విజ్ – 500 ప్రశ్నలు</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@500;700;800&family=Noto+Sans+Telugu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans Telugu','Baloo Tamma 2',sans-serif;background:linear-gradient(135deg,#a8edea,#fed6e3);min-height:100vh;color:#1f2937;-webkit-tap-highlight-color:transparent}
.app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:rgba(255,255,255,.45);box-shadow:0 10px 40px rgba(0,0,0,.15)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(255,255,255,.9);border-radius:0 0 24px 24px;position:sticky;top:0;z-index:5}
header h1{font-family:'Baloo Tamma 2';font-size:1.4rem;color:#7e22ce}
.hbtns{display:flex;gap:8px}
.icon-btn{width:46px;height:46px;border-radius:50%;border:2px solid #d8b4fe;background:#f3e8ff;font-size:1.3rem;cursor:pointer}
.icon-btn.off{background:#e5e7eb;border-color:#d1d5db}
main{flex:1;padding:14px}
.card{background:#fff;border-radius:22px;padding:14px;box-shadow:0 4px 14px rgba(0,0,0,.08);margin-bottom:14px}
.card h3{font-size:1.05rem;margin-bottom:10px;color:#374151;text-align:center}
.chips{display:grid;gap:8px;grid-template-columns:repeat(3,1fr)}
.chip{position:relative}
.chips.c4{grid-template-columns:repeat(4,1fr)}
.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip span{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:52px;padding:6px 4px;border:2px solid #e5e7eb;border-radius:14px;font-weight:700;font-size:.92rem;text-align:center;cursor:pointer;background:#f9fafb;transition:.15s}
.chip small{font-weight:600;font-size:.72rem;opacity:.7}
.chip input:checked+span{background:#ec4899;color:#fff;border-color:#be185d;box-shadow:0 3px 0 #be185d}
.chip input:focus-visible+span{outline:4px solid #f59e0b;outline-offset:2px}
.big-btn{display:block;width:100%;min-height:56px;border:none;border-radius:999px;font-family:inherit;font-weight:700;font-size:1.25rem;color:#fff;cursor:pointer;margin-top:10px;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:.1s}
.big-btn:active{transform:translateY(4px);box-shadow:none}
.big-btn:focus-visible,.opt:focus-visible,.icon-btn:focus-visible{outline:4px solid #f59e0b;outline-offset:2px}
.pink{background:#ec4899}.blue{background:#3b82f6}.orange{background:#f97316}.green{background:#16a34a}.gray{background:#6b7280}
.title{text-align:center;font-family:'Baloo Tamma 2';font-size:1.9rem;color:#db2777;margin:4px 0 12px}
.muted{text-align:center;color:#4b5563;font-size:.9rem;margin-top:8px}
.hidden{display:none!important}
.progress{display:flex;align-items:center;gap:10px;background:#fff;padding:8px 14px;border-radius:16px;margin-bottom:12px;font-weight:700;color:#7e22ce}
.bar{flex:1;height:12px;background:#e5e7eb;border-radius:9px;overflow:hidden}
.bar div{height:100%;width:0;background:linear-gradient(90deg,#c084fc,#ec4899);transition:width .3s}
.qbox{background:#fff;border:4px solid #f3e8ff;border-radius:24px;padding:22px 16px;min-height:150px;position:relative;display:flex;flex-direction:column;justify-content:center;margin-bottom:14px}
.tag{position:absolute;top:8px;left:10px;font-size:.75rem;font-weight:700;padding:2px 10px;border-radius:999px;background:#ede9fe;color:#6d28d9}
.qbox .icon-btn{position:absolute;top:6px;right:6px;width:42px;height:42px;font-size:1.1rem}
#qText{font-size:1.6rem;font-weight:700;text-align:center;line-height:1.5;margin-top:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{min-height:64px;border:2px solid #ddd6fe;background:#fff;border-radius:18px;font-family:inherit;font-weight:700;font-size:1.25rem;padding:10px;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 4px 0 #ddd6fe;text-align:left}
.opt .n{font-size:.8rem;opacity:.5}
.opt.ok{background:#22c55e;color:#fff;border-color:#15803d;box-shadow:0 4px 0 #15803d}
.opt.bad{background:#ef4444;color:#fff;border-color:#b91c1c;box-shadow:0 4px 0 #b91c1c}
.score{font-family:'Baloo Tamma 2';font-size:3.6rem;color:#ec4899;text-align:center;font-weight:800}
.stars{text-align:center;font-size:2rem}
.mist{border-bottom:1px solid #eee;padding:8px 2px;font-size:.95rem}
.mist:last-child{border:0}
.red{color:#dc2626}.grn{color:#15803d;font-weight:700}
.study-row{display:flex;gap:8px;align-items:center;border-bottom:1px solid #f1f1f1;padding:8px 2px}
.study-row .num{min-width:28px;font-weight:700;color:#7e22ce}
.study-row .q{flex:1}
.study-row .a{color:#15803d;font-weight:700}
.study-row button{width:40px;height:40px;border-radius:50%;border:1px solid #ddd;background:#f9fafb;cursor:pointer;font-size:1rem;flex-shrink:0}
.subj-head{background:#fdf2f8;color:#be185d;font-weight:800;padding:6px 10px;border-radius:10px;margin:12px 0 4px}
footer{text-align:center;padding:12px;background:rgba(255,255,255,.9);border-radius:24px 24px 0 0;font-weight:700;font-size:.9rem;color:#4b5563}
footer a{color:#7e22ce;text-decoration:none}
footer a:hover{text-decoration:underline}
@media(max-width:420px){.opts{grid-template-columns:1fr}#qText{font-size:1.4rem}.chip span{font-size:.82rem}}
@media(min-width:900px){#qText{font-size:2rem}.opt{font-size:1.4rem}}
@media print{header,footer,.no-print,.study-row button{display:none!important}body,.app{background:#fff;box-shadow:none}.card{box-shadow:none;border:1px solid #ccc}}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>🌟 రాయ్ బాల శిక్ష <small style="font-size:.8rem;color:#db2777">500</small></h1>
  <div class="hbtns">
    <button class="icon-btn" id="homeTop" aria-label="Home" title="మొదటి పేజీ">🏠</button>
    <button class="icon-btn" id="voiceBtn" aria-label="Voice" title="వాయిస్">🔊</button>
  </div>
</header>

<main>
<!-- HOME -->
<section id="home">
  <div class="title">ఆడుకుందాం రా! 🎈</div>
  <div class="card">
    <h3>📚 విషయం ఎంచుకోండి</h3>
    <div class="chips" id="subjChips"></div>
  </div>
  <div class="card">
    <h3>⭐ స్థాయి</h3>
    <div class="chips">
      <label class="chip"><input type="radio" name="level" value="easy" checked><span>సులభం</span></label>
      <label class="chip"><input type="radio" name="level" value="medium"><span>మధ్యస్థం</span></label>
      <label class="chip"><input type="radio" name="level" value="all"><span>రెండూ</span></label>
    </div>
  </div>
  <div class="card">
    <h3>🔢 ప్రశ్నల సంఖ్య</h3>
    <div class="chips c4">
      <label class="chip"><input type="radio" name="qcount" value="10" checked><span>10</span></label>
      <label class="chip"><input type="radio" name="qcount" value="20"><span>20</span></label>
      <label class="chip"><input type="radio" name="qcount" value="50"><span>50</span></label>
      <label class="chip"><input type="radio" name="qcount" value="999"><span>అన్నీ</span></label>
    </div>
    <p class="muted" id="availInfo"></p>
  </div>
  <button class="big-btn pink" id="startBtn">క్విజ్ ప్రారంభించు 🚀</button>
  <button class="big-btn green" id="studyBtn">📖 చదువుకో (ప్రశ్న–జవాబు)</button>
  <p class="muted" id="lastScore"></p>
</section>

<!-- QUIZ -->
<section id="quiz" class="hidden">
  <div class="progress"><span id="qProg">1 / 10</span><div class="bar"><div id="qBar"></div></div><span id="qScore">⭐ 0</span></div>
  <div class="qbox">
    <span class="tag" id="qTag"></span>
    <button class="icon-btn" id="replayBtn" aria-label="మళ్ళీ విను">🔊</button>
    <div id="qText"></div>
  </div>
  <div class="opts" id="opts"></div>
</section>

<!-- RESULT -->
<section id="result" class="hidden">
  <div class="card" style="border:4px solid #fde68a">
    <div class="title" id="resTitle">అద్భుతం!</div>
    <div class="stars" id="resStars"></div>
    <div class="score" id="resScore">0 / 0</div>
  </div>
  <div class="card hidden" id="mistCard">
    <h3 class="red">తప్పిన ప్రశ్నలు – సరైన జవాబులు</h3>
    <div id="mistList"></div>
  </div>
  <button class="big-btn orange hidden" id="retryBtn">తప్పినవి మళ్ళీ ఆడు 🔄</button>
  <button class="big-btn pink" id="againBtn">కొత్త క్విజ్ 🎲</button>
  <button class="big-btn blue" id="homeBtn">మొదటి పేజీ 🏠</button>
</section>

<!-- STUDY -->
<section id="study" class="hidden">
  <div class="card">
    <h3 id="studyTitle">📖 ప్రశ్న – జవాబు</h3>
    <div id="studyList"></div>
  </div>
  <button class="big-btn gray no-print" id="printBtn">🖨️ ప్రింట్ / PDF</button>
  <button class="big-btn blue no-print" id="studyHome">మొదటి పేజీ 🏠</button>
</section>
</main>

<footer>
  <a href="https://raayeducation.in" target="_blank" rel="noopener">రాయ్ ఎడ్యుకేషన్</a> ద్వారా రూపొందించబడింది
</footer>
</div>

<script>
// ===== 500 ప్రశ్నలు — 11 విభాగాలు, 2 స్థాయిలు =====
const SUBJECTS = {
  te:{name:'తెలుగు',icon:'🅰️'},
  en:{name:'English',icon:'🔤'},
  ma:{name:'గణితం',icon:'➕'},
  ev:{name:'పరిసరాలు (EVS)',icon:'🌳'},
  dw:{name:'రోజువారీ పదాలు',icon:'💬'},
  sc:{name:'రాష్ట్రాలు–రాజధానులు',icon:'🗺️'},
  me:{name:'కొలతలు',icon:'📏'},
  ru:{name:'రుచులు',icon:'👅'},
  ha:{name:'హద్దులు–దిక్కులు',icon:'🧭'},
  ti:{name:'సమయం 12/24',icon:'⏰'},
  bs:{name:'చిన్నవి–పెద్దవి',icon:'🐘'}
};
const RAW = [
// ---- తెలుగు సులభం ----
['te','e',"'అ' తర్వాత వచ్చే అక్షరం ఏది?",['ఆ','ఇ','ఈ','ఉ']],
['te','e',"'క' తర్వాత వచ్చే అక్షరం ఏది?",['ఖ','గ','చ','ట']],
['te','e',"'అమ్మ' పదంలో ఎన్ని అక్షరాలు ఉన్నాయి?",['2','3','1','4']],
['te','e',"'పువ్వు' ఏది?",['🌸','🐶','🍎','🚗']],
['te','e',"'బడి' పదం ఏ అక్షరంతో మొదలవుతుంది?",['బ','డ','ద','ప']],
['te','e',"'పెద్ద' కు వ్యతిరేక పదం ఏది?",['చిన్న','పొడవు','లావు','ఎత్తు']],
['te','e',"'పగలు' కు వ్యతిరేక పదం ఏది?",['రాత్రి','ఉదయం','ఎండ','సూర్యుడు']],
['te','e',"'ఆ' అక్షరంతో మొదలయ్యే పదం ఏది?",['ఆవు','ఇల్లు','ఉడుత','ఎలుక']],
['te','e',"'చెట్టు' కు బహువచనం ఏది?",['చెట్లు','చెట్టులు','చెట్టాలు','చెట్టువి']],
['te','e',"'నీరు' కు మరో పేరు ఏది?",['జలం','అగ్ని','గాలి','భూమి']],
// ---- తెలుగు మధ్యస్థం ----
['te','m',"'సూర్యుడు' కు పర్యాయపదం ఏది?",['భానుడు','చంద్రుడు','సముద్రం','మేఘం']],
['te','m',"'తల్లి' కి వ్యతిరేక లింగ పదం ఏది?",['తండ్రి','అక్క','అవ్వ','చెల్లి']],
['te','m',"'పుస్తకం' కు బహువచనం ఏది?",['పుస్తకాలు','పుస్తకలు','పుస్తకంలు','పుస్తకాళ్ళు']],
['te','m',"తెలుగు వారి సంవత్సరాది పండుగ ఏది?",['ఉగాది','దీపావళి','దసరా','సంక్రాంతి']],
['te','m',"క్ + అ = ?",['క','కా','కి','కు']],
['te','m',"'క' కు దీర్ఘం ఇస్తే ఏమవుతుంది?",['కా','కి','కు','కె']],
['te','m',"అమ్మ పెట్టిన ____ తిన్నాను. (ఖాళీ నింపండి)",['అన్నం','బడి','కుర్చీ','గోడ']],
['te','m',"'మంచి' కి వ్యతిరేక పదం ఏది?",['చెడు','పెద్ద','తీపి','కొత్త']],
['te','m',"'వేగంగా' కి వ్యతిరేక పదం ఏది?",['నెమ్మదిగా','త్వరగా','గట్టిగా','ఎత్తుగా']],
['te','m',"'కొత్త' కి వ్యతిరేక పదం ఏది?",['పాత','మంచి','పెద్ద','తెల్ల']],
// ---- English Easy ----
['en','e',"Which one is a fruit?",['Apple','Chair','Pen','Dog'],'en'],
['en','e',"What comes after the letter A?",['B','C','D','Z'],'en'],
['en','e',"'Cat' starts with which letter?",['C','K','S','T'],'en'],
['en','e',"Opposite of 'Big' is?",['Small','Tall','Long','Fat'],'en'],
['en','e',"Which one is a colour?",['Red','Book','Table','Sun'],'en'],
['en','e',"Which animal says 'Moo'?",['Cow','Dog','Cat','Hen'],'en'],
['en','e',"How many letters are there in the English alphabet?",['26','24','28','52'],'en'],
['en','e',"Which one is a vowel?",['E','B','K','T'],'en'],
['en','e',"One, Two, ____ ?",['Three','Four','Five','Ten'],'en'],
['en','e',"Plural of 'Boy' is?",['Boys','Boyes','Boies','Boy'],'en'],
// ---- English Medium ----
['en','m',"Opposite of 'Hot' is?",['Cold','Warm','Sun','Fire'],'en'],
['en','m',"Plural of 'Child' is?",['Children','Childs','Childes','Childrens'],'en'],
['en','m',"I ____ a student.",['am','is','are','be'],'en'],
['en','m',"She ____ my sister.",['is','am','are','be'],'en'],
['en','m',"They ____ playing.",['are','is','am','was'],'en'],
['en','m',"Past tense of 'go' is?",['went','goed','gone','going'],'en'],
['en','m',"Which spelling is correct?",['School','Scool','Skool','Shcool'],'en'],
['en','m',"Which one is a naming word (noun)?",['Table','Run','Big','Quickly'],'en'],
['en','m',"Opposite of 'Up' is?",['Down','Top','Over','In'],'en'],
['en','m',"Which day comes after Monday?",['Tuesday','Sunday','Friday','Thursday'],'en'],
// ---- గణితం సులభం ----
['ma','e',"2 + 3 = ?",['5','6','4','23']],
['ma','e',"5 − 2 = ?",['3','7','2','4']],
['ma','e',"4 తర్వాత వచ్చే సంఖ్య ఏది?",['5','3','6','8']],
['ma','e',"10 కంటే పెద్ద సంఖ్య ఏది?",['12','8','5','9']],
['ma','e',"3 + 4 = ?",['7','6','8','12']],
['ma','e',"🍎🍎🍎 ఎన్ని ఆపిల్స్?",['3','2','4','5']],
['ma','e',"10 + 10 = ?",['20','100','11','1010']],
['ma','e',"ఒక చేతికి ఎన్ని వేళ్ళు ఉంటాయి?",['5','4','10','6']],
['ma','e',"7 కంటే ముందు వచ్చే సంఖ్య ఏది?",['6','8','5','9']],
['ma','e',"9 − 4 = ?",['5','4','13','6']],
// ---- గణితం మధ్యస్థం ----
['ma','m',"5 × 2 = ?",['10','7','12','52']],
['ma','m',"12 ÷ 3 = ?",['4','3','6','9']],
['ma','m',"25 + 17 = ?",['42','32','41','52']],
['ma','m',"50 − 23 = ?",['27','33','37','23']],
['ma','m',"8 × 5 = ?",['40','35','45','13']],
['ma','m',"ఒక గంటకు ఎన్ని నిమిషాలు?",['60','100','24','30']],
['ma','m',"ఒక రూపాయికి ఎన్ని పైసలు?",['100','10','50','1000']],
['ma','m',"త్రిభుజానికి ఎన్ని భుజాలు ఉంటాయి?",['3','4','5','2']],
['ma','m',"ఒక డజను అంటే ఎన్ని?",['12','10','6','20']],
['ma','m',"ఒక రోజుకు ఎన్ని గంటలు?",['24','12','60','7']],
// ---- EVS సులభం ----
['ev','e',"ఆకాశం రంగు ఏమిటి?",['నీలం','ఎరుపు','ఆకుపచ్చ','పసుపు']],
['ev','e',"పాలు ఏ రంగులో ఉంటాయి?",['తెలుపు','నలుపు','ఎరుపు','ఆకుపచ్చ']],
['ev','e',"కుక్క ఎలా అరుస్తుంది?",['భౌ భౌ','మ్యావ్','అంబా','కావ్ కావ్']],
['ev','e',"మన జాతీయ పక్షి ఏది?",['నెమలి','కాకి','చిలుక','పావురం']],
['ev','e',"వారానికి ఎన్ని రోజులు?",['7','5','10','12']],
['ev','e',"మనకు పాలు ఇచ్చే జంతువు ఏది?",['ఆవు','కోడి','పిల్లి','కాకి']],

const BANK = [
  ...RAW.map(r=>({s:r[0],l:r[1],q:r[2],o:r[3],a:r[3][0],sp:r[4]||'te'})),
  ...EXTRA
].map((b,i)=>(b.id=i,b));
function numOpts(a){a=+a;const c=[...new Set([a+1,a-1,a+2,a-2,a+10,a-10,a+5])].filter(x=>x>=0&&x!==a);return [String(a),...shuffle(c).slice(0,3)];}
function getOpts(q){
  if(q.o) return [...q.o];
  if(q.num) return numOpts(q.a);
  return [q.a,...shuffle(q.pool.filter(x=>x!==q.a)).slice(0,3)];
}

// ===== State =====
let voiceOn=true, quizQs=[], idx=0, score=0, wrong=[], busy=false, screen='home', lastSettings=null;
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

// ===== Subject chips =====
function buildChips(){
  let h=`<label class="chip"><input type="radio" name="subj" value="all" checked><span>🌈 అన్నీ<small>${BANK.length}</small></span></label>`;
  for(const k in SUBJECTS){
    const n=BANK.filter(b=>b.s===k).length;
    h+=`<label class="chip"><input type="radio" name="subj" value="${k}"><span>${SUBJECTS[k].icon} ${SUBJECTS[k].name}<small>${n}</small></span></label>`;
  }
  $('subjChips').innerHTML=h;
  document.querySelectorAll('input[type=radio]').forEach(r=>r.addEventListener('change',()=>{saveSel();updateAvail();}));
}
const val=n=>document.querySelector(`input[name="${n}"]:checked`).value;
function filtered(){
  const s=val('subj'), l=val('level');
  return BANK.filter(b=>(s==='all'||b.s===s)&&(l==='all'||b.l===(l==='easy'?'e':'m')));
}
function updateAvail(){ $('availInfo').textContent=`ఈ ఎంపికలో మొత్తం ${filtered().length} ప్రశ్నలు ఉన్నాయి`; }
function saveSel(){ store.set('raayBS_sel',JSON.stringify({subj:val('subj'),level:val('level'),qcount:val('qcount')})); }
function loadSel(){
  try{const s=JSON.parse(store.get('raayBS_sel')); if(!s)return;
    ['subj','level','qcount'].forEach(n=>{const el=document.querySelector(`input[name="${n}"][value="${s[n]}"]`); if(el) el.checked=true;});
  }catch(e){}
}

// ===== Screens =====
function show(name){
  ['home','quiz','result','study'].forEach(s=>$(s).classList.toggle('hidden',s!==name));
  screen=name; window.scrollTo(0,0);
}
function goHome(){
  stopSpeak(); show('home'); updateAvail();
  const ls=store.get('raayBS_last'); $('lastScore').textContent=ls?`గత స్కోరు: ${ls}`:'';
}

// ===== Voice =====
function stopSpeak(){ try{speechSynthesis.cancel()}catch(e){} }
function speak(text,lang){
  if(!voiceOn||!('speechSynthesis' in window)) return;
  stopSpeak();
  const u=new SpeechSynthesisUtterance(text.replace(/_+|☐/g,' ఖాళీ '));
  const code=lang==='en'?'en-IN':'te-IN'; u.lang=code; u.rate=.88;
  const v=speechSynthesis.getVoices().find(v=>v.lang===code)||speechSynthesis.getVoices().find(v=>v.lang.startsWith(lang==='en'?'en':'te'));
  if(v) u.voice=v;
  speechSynthesis.speak(u);
}
function updVoice(){ $('voiceBtn').textContent=voiceOn?'🔊':'🔇'; $('voiceBtn').classList.toggle('off',!voiceOn); }

// ===== Quiz =====
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(){
  let seen={};try{seen=JSON.parse(store.get('raayBS_seen'))||{}}catch(e){}
  const pool=shuffle([...filtered()]).sort((x,y)=>(seen[x.id]||0)-(seen[y.id]||0)); // కొత్తవి ముందు
  if(!pool.length){alert('ఈ ఎంపికలో ప్రశ్నలు లేవు');return;}
  quizQs=pool.slice(0,Math.min(parseInt(val('qcount')),pool.length));
  run();
}
function run(){ try{const seen=JSON.parse(store.get('raayBS_seen'))||{};quizQs.forEach(q=>seen[q.id]=(seen[q.id]||0)+1);store.set('raayBS_seen',JSON.stringify(seen));}catch(e){}
  idx=0;score=0;wrong=[];show('quiz');loadQ(); }
function loadQ(){
  busy=false; const q=quizQs[idx];
  $('qProg').textContent=`${idx+1} / ${quizQs.length}`;
  $('qBar').style.width=(idx/quizQs.length*100)+'%';
  $('qScore').textContent='⭐ '+score;
  $('qTag').textContent=SUBJECTS[q.s].icon+' '+SUBJECTS[q.s].name+' · '+(q.l==='e'?'సులభం':'మధ్యస్థం');
  $('qText').textContent=q.q;
  $('opts').innerHTML='';
  shuffle(getOpts(q)).forEach((o,i)=>{
    const b=document.createElement('button'); b.className='opt';
    b.innerHTML=`<span class="n">${i+1}.</span><span></span>`; b.lastChild.textContent=o;
    b.dataset.v=o; b.onclick=()=>answer(o,b); $('opts').appendChild(b);
  });
  speak(q.q,q.sp);
}
function answer(o,btn){
  if(busy)return; busy=true;
  const q=quizQs[idx], all=[...document.querySelectorAll('.opt')];
  all.forEach(b=>b.disabled=true);
  let wait=1500;
  if(o===q.a){ btn.classList.add('ok'); score++; speak(q.sp==='en'?'Correct! Very good!':'సరైన జవాబు! శభాష్!',q.sp); }
  else{
    btn.classList.add('bad'); all.find(b=>b.dataset.v===q.a).classList.add('ok');
    wrong.push({q,user:o}); wait=2800;
    speak(q.sp==='en'?'Wrong. Correct answer is '+q.a:'తప్పు. సరైన జవాబు '+q.a,q.sp);
  }
  $('qScore').textContent='⭐ '+score;
  setTimeout(()=>{ idx++; idx<quizQs.length?loadQ():results(); },wait);
}
function results(){
  const n=quizQs.length, p=score/n;
  $('resTitle').textContent=p===1?'అద్భుతం! 🏆':p>=.6?'బాగా ఆడావు! 👍':'మళ్ళీ ప్రయత్నించు! 💪';
  $('resStars').textContent=p===1?'⭐⭐⭐':p>=.6?'⭐⭐':p>0?'⭐':'';
  $('resScore').textContent=`${score} / ${n}`;
  const d=new Date(); store.set('raayBS_last',`${score}/${n} (${d.getDate()}-${d.getMonth()+1}-${d.getFullYear()})`);
  const list=$('mistList'); list.innerHTML='';
  wrong.forEach(w=>{
    const div=document.createElement('div'); div.className='mist';
    div.innerHTML='<b></b><div class="red">నీ జవాబు: <s></s></div><div class="grn">సరైనది: <span></span></div>';
    div.querySelector('b').textContent=w.q.q; div.querySelector('s').textContent=w.user; div.querySelector('.grn span').textContent=w.q.a;
    list.appendChild(div);
  });
  $('mistCard').classList.toggle('hidden',!wrong.length);
  $('retryBtn').classList.toggle('hidden',!wrong.length);
  show('result');
  speak(`నీ స్కోరు ${n} కి ${score}`,'te');
}

// ===== Study mode =====
function study(){
  const items=filtered(); let h='', cur='';
  items.forEach((b,i)=>{
    if(b.s!==cur){cur=b.s;h+=`<div class="subj-head">${SUBJECTS[b.s].icon} ${SUBJECTS[b.s].name}</div>`;}
    h+=`<div class="study-row"><span class="num">${i+1}.</span><div class="q"><div class="qq"></div><div class="a"></div></div><button data-id="${b.id}" aria-label="విను">🔊</button></div>`;
  });
  $('studyList').innerHTML=h||'<p class="muted">ప్రశ్నలు లేవు</p>';
  const rows=$('studyList').querySelectorAll('.study-row');
  items.forEach((b,i)=>{rows[i].querySelector('.qq').textContent=b.q; rows[i].querySelector('.a').textContent='✅ '+b.a;});
  $('studyList').querySelectorAll('button').forEach(bt=>bt.onclick=()=>{const b=BANK[bt.dataset.id]; const was=voiceOn; voiceOn=true; speak(b.q+' . '+b.a,b.sp); voiceOn=was;});
  $('studyTitle').textContent=`📖 ప్రశ్న – జవాబు (${items.length})`;
  show('study');
}

// ===== Events =====
$('voiceBtn').onclick=()=>{voiceOn=!voiceOn;store.set('raayBS_voice',voiceOn);updVoice(); if(!voiceOn)stopSpeak(); else if(screen==='quiz'&&!busy)speak(quizQs[idx].q,quizQs[idx].sp);};
$('startBtn').onclick=startQuiz;
$('studyBtn').onclick=study;
$('replayBtn').onclick=()=>{const q=quizQs[idx]; if(q){const was=voiceOn;voiceOn=true;speak(q.q,q.sp);voiceOn=was;}};
$('retryBtn').onclick=()=>{quizQs=shuffle(wrong.map(w=>w.q));run();};
$('againBtn').onclick=startQuiz;
$('homeBtn').onclick=goHome; $('homeTop').onclick=goHome; $('studyHome').onclick=goHome;
$('printBtn').onclick=()=>window.print();

// TV remote / keyboard
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&window.parent===window){e.preventDefault();goHome();return;} // యాప్ లోపల బ్యాక్ = rvBack
  if(screen==='quiz'&&['1','2','3','4'].includes(e.key)){const b=document.querySelectorAll('.opt')[+e.key-1]; if(b&&!b.disabled){b.focus();b.click();} return;}
  if(['ArrowDown','ArrowRight','ArrowUp','ArrowLeft'].includes(e.key)){
    const f=[...document.querySelectorAll('button:not([disabled]),input[type=radio],a')].filter(el=>{
      const t=el.type==='radio'?el.nextElementSibling:el; return t.offsetParent!==null;});
    // only one radio per group needs focus stop: keep all for simplicity
    let i=f.indexOf(document.activeElement);
    i=(e.key==='ArrowDown'||e.key==='ArrowRight')?(i+1)%f.length:(i-1+f.length)%f.length;
    e.preventDefault(); f[i].focus(); if(f[i].type==='radio'){f[i].checked=true;f[i].dispatchEvent(new Event('change'));}
  }
});

// యాప్ బ్యాక్ బటన్: క్విజ్/ఫలితం/చదువు పేజీలో ఉంటే మొదటి పేజీకి (true), మొదటి పేజీలో ఉంటే false = యాప్ టూల్ మూస్తుంది
window.rvBack=function(){ if(screen!=='home'){goHome();return true;} return false; };
// Init
(function(){
  const v=store.get('raayBS_voice'); if(v!==null) voiceOn=v==='true';
  updVoice(); buildChips(); loadSel(); goHome();
  if('speechSynthesis' in window) speechSynthesis.onvoiceschanged=()=>{};
})();
</script>
