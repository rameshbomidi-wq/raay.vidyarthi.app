<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Word List 1-8 | ఇంగ్లీష్ పదాలు నేర్చుకుందాం | రాయ్ ఎడ్యుకేషన్</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600;800&family=Baloo+Tamma+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf7fb;--card:#fff;--ink:#23303a;--mut:#64748b;--pri:#0e9fb5;--pri2:#087789;--yel:#ffd54a;--org:#ff8a3d;--grn:#22a55a;--red:#e5484d;--pur:#7c5cff;--sh:0 6px 18px rgba(14,80,100,.13)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Noto Sans Telugu','Baloo Tamma 2',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer;border:0}
.en{font-family:'Baloo Tamma 2',sans-serif}
header{position:sticky;top:0;z-index:30;background:linear-gradient(90deg,#0e9fb5,#18b6a0);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 10px;box-shadow:var(--sh)}
header h1{font-size:1.05rem;margin:0;flex:1;line-height:1.2;font-weight:800}
header h1 small{display:block;font-size:.72rem;font-weight:600;opacity:.9}
.hb{background:rgba(255,255,255,.2);color:#fff;min-width:44px;height:44px;border-radius:12px;font-size:1.2rem;display:flex;align-items:center;justify-content:center;padding:0 10px}
.hb.off{opacity:.55}
#menu{position:fixed;inset:0 auto 0 0;width:min(320px,86vw);background:#fff;z-index:50;transform:translateX(-105%);transition:.25s;overflow:auto;box-shadow:var(--sh);padding:12px}
#menu.open{transform:none}
#shade{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:none}
#shade.show{display:block}
#menu h3{margin:6px 4px 10px;color:var(--pri2)}
.mi{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:#f3fbfd;border-radius:12px;padding:10px;margin-bottom:8px;min-height:48px;font-size:.92rem;color:var(--ink)}
.mi b{font-size:1.4rem}
.mi.act{background:var(--yel)}
main{flex:1;width:100%;max-width:980px;margin:0 auto;padding:12px}
.search{display:flex;gap:8px;margin-bottom:12px}
.search input{flex:1;font-size:1rem;padding:12px 14px;border-radius:14px;border:2px solid #bfe7ef;font-family:inherit;min-height:46px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.sc{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--sh);text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:6px;border-top:6px solid var(--c)}
.sc .ic{font-size:2rem}
.sc .t{font-weight:800;font-size:1.02rem}
.sc .e{font-size:.82rem;color:var(--mut)}
.bar{height:9px;background:#e6eef2;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grn);width:0}
.small{font-size:.8rem;color:var(--mut)}
.howto{background:#fff8dc;border-radius:16px;padding:12px 14px;margin-top:14px;font-size:.9rem;line-height:1.7}
.sechead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sechead .ic{font-size:2rem}
.sechead .t{font-weight:800;font-size:1.1rem}
.tabs{display:flex;gap:6px;overflow:auto;padding-bottom:4px;margin-bottom:8px}
.tab{flex:1;min-width:84px;background:#fff;border-radius:14px;padding:9px 6px;font-weight:700;font-size:.88rem;box-shadow:var(--sh);color:var(--ink);min-height:48px}
.tab.act{background:var(--pri);color:#fff}
.chips{display:flex;gap:6px;overflow:auto;padding:4px 0 8px}
.chip{background:#fff;border:2px solid #bfe7ef;border-radius:20px;padding:6px 12px;white-space:nowrap;font-weight:700;min-height:40px;color:var(--ink)}
.chip.act{background:var(--yel);border-color:var(--org)}
.chip.done{border-color:var(--grn)}
/* flash card */
.card{background:#fff;border-radius:22px;box-shadow:var(--sh);padding:18px 14px;text-align:center;position:relative}
.card .cnt{position:absolute;top:10px;left:14px;font-size:.85rem;color:var(--mut);font-weight:700}
.card .star{position:absolute;top:6px;right:8px;font-size:1.6rem;background:none;min-width:44px;min-height:44px}
.emo{font-size:4.2rem;line-height:1.1;min-height:4.6rem}
.tiles{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:10px 0}
.tl{font-family:'Baloo Tamma 2',sans-serif;font-size:clamp(1.9rem,8vw,3rem);font-weight:800;min-width:1.25em;padding:2px 6px;border-radius:12px;background:#f1f5f9;color:#1e293b;line-height:1.25;border-bottom:4px solid #cbd5e1}
.tl.v{background:#ffe1e1;color:#c62828;border-color:#ef9a9a}
.tl.p{background:#dff6e8;color:#137a3e;border-color:#86d7a5}
.tl.p2{background:#e7e1ff;color:#5b3fd6;border-color:#b3a3ff}
.tl.me{background:#fff1c9;color:#b26a00;border-color:#ffd277}
.pron{font-size:1.6rem;font-weight:800;color:var(--pri2)}
.mean{font-size:1.35rem;font-weight:700;margin-top:4px;background:#fff8dc;border-radius:14px;padding:8px;display:inline-block;min-width:60%}
.mean.hid{filter:blur(8px);cursor:pointer}
.hint{font-size:.82rem;color:var(--mut);margin-top:6px}
.ctrls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px}
.btn{background:var(--pri);color:#fff;border-radius:14px;padding:10px 14px;font-weight:700;font-size:.95rem;min-height:48px;min-width:48px}
.btn.y{background:var(--yel);color:#3b2f00}
.btn.o{background:var(--org)}
.btn.g{background:var(--grn)}
.btn.w{background:#fff;color:var(--ink);border:2px solid #bfe7ef}
.btn.big{font-size:1.4rem;min-width:64px}
.ap{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:10px;flex-wrap:wrap;font-size:.88rem}
select{font-family:inherit;font-size:.95rem;padding:8px;border-radius:10px;border:2px solid #bfe7ef;min-height:44px;background:#fff}
.legend{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:.78rem;margin-top:8px;color:var(--mut)}
.legend span i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle;margin-right:3px}
/* table */
table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border-radius:16px;overflow:hidden;box-shadow:var(--sh)}
th{background:var(--yel);padding:10px 6px;font-size:.92rem}
td{padding:8px 6px;border-top:1px solid #e8f1f4;text-align:center;font-size:1rem}
td.w{font-family:'Baloo Tamma 2';font-weight:800;font-size:1.15rem;text-align:left}
tr:nth-child(even) td{background:#f5fcfe}
td .sp{background:#e0f6fa;border-radius:10px;min-width:40px;min-height:40px;font-size:1.1rem}
tr.lrn td.w::after{content:' ⭐';font-size:.8rem}
/* quiz */
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.qo{background:#f3fbfd;border:3px solid #bfe7ef;border-radius:16px;padding:12px 8px;font-size:1.1rem;font-weight:700;min-height:62px;color:var(--ink)}
.qo.en{font-size:1.4rem}
.qo.ok{background:#d9f7e4;border-color:var(--grn)}
.qo.no{background:#ffe1e1;border-color:var(--red)}
.qtype{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.qt{background:#fff;border-radius:18px;padding:14px;box-shadow:var(--sh);text-align:left;font-size:.95rem;color:var(--ink);min-height:70px}
.qt b{font-size:1.6rem;margin-right:6px}
.res{text-align:center}
.res .big{font-size:3rem}
.wrong{text-align:left;margin-top:10px}
.wrong div{background:#fff3f3;border-radius:10px;padding:8px;margin:6px 0}
/* spell */
.slots{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:12px 0}
.slot{width:2.2em;height:2.4em;border-radius:12px;border:3px dashed #9fd8e3;display:flex;align-items:center;justify-content:center;font-family:'Baloo Tamma 2';font-weight:800;font-size:1.6rem;background:#fff}
.slot.f{border-style:solid;background:#e0f6fa}
.pool{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
.pk{width:2.4em;height:2.4em;border-radius:14px;background:var(--yel);font-family:'Baloo Tamma 2';font-weight:800;font-size:1.6rem;color:#3b2f00;box-shadow:0 4px 0 #e0a800}
.pk:disabled{opacity:.25}
.msg{font-size:1.3rem;font-weight:800;min-height:2rem;margin-top:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#23303a;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;display:none;font-size:.9rem}
footer{text-align:center;padding:16px 10px 22px;font-size:.88rem;color:var(--mut)}
footer a{color:var(--pri2);font-weight:800;text-decoration:none;font-size:1.05rem}
.hidden{display:none!important}
@media(max-width:420px){.qopts{grid-template-columns:1fr}.btn{padding:10px 11px;font-size:.88rem}}
@media print{header,#menu,#shade,.tabs,.chips,.search,.ctrls,.ap,.noprint,td .sp,th.sp{display:none!important}body{background:#fff}main{max-width:none;padding:0}table{box-shadow:none}td,th{border:1px solid #999;padding:5px}.ptitle{display:block!important;text-align:center;font-size:18pt;margin:0 0 8px}@page{size:A4;margin:12mm}}
.ptitle{display:none}
</style>
</head>

let voices=[];function loadV(){try{voices=speechSynthesis.getVoices()}catch(e){}}
if('speechSynthesis' in window){loadV();speechSynthesis.onvoiceschanged=loadV}
function pickV(lang){return voices.find(v=>v.lang==lang)||voices.find(v=>v.lang&&v.lang.replace('_','-').startsWith(lang.split('-')[0]))}
function say(t,lang='en-IN',rate=.8,cb){
  if(!('speechSynthesis' in window)){cb&&cb();return}
  const u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=rate;const v=pickV(lang);if(v)u.voice=v;
  if(cb)u.onend=cb;speechSynthesis.speak(u)}
function stopV(){try{speechSynthesis.cancel()}catch(e){}}
function sayWord(w,slow){stopV();say(w.toLowerCase(),'en-IN',slow?.45:.8)}

function spellOut(w){stopV();w.split('').forEach(c=>say(c.toUpperCase(),'en-IN',.7));say(w.toLowerCase(),'en-IN',.75)}

const PAT={
 1:[],
 2:[[/(nd|nt|nk|ng|mp|mb|lt|lk|lf|lp|lm|ld|ft|pt|ct|st|sk|sc|xt|rd|rn|rk|rm|rt|rb|rf|rl|rp|bt)$/,'p']],
 3:[[/^(spl|str|scr|sch)/,'p'],[/(tch|sh|ch|th|wh|ck)/,'p2'],[/^(cr|gr|dr|fr|pr|tr|br|cl|sl|fl|bl|sk|st|sp|sw|tw|sn|sm|thr)/,'p']],
 4:[[/(ck|ll|ss|ff|rr|bb|dd|gg)/,'p']],
 5:[[/(ai|ea|oa|ou|ui)/,'p'],[/(ce|ci|cy|ge|gy)/,'p2']],
 6:[[/(tion|sion|ture|ing|ed)$/,'p']],
 7:[[/(ar|er|ir|ur|or|aw|al|ew|ey|ow|ol|ul|us|ut|on|ou)/,'p']]
};
function tiles(w,sec){
  const lw=w.toLowerCase(),cls=Array(lw.length).fill('');
  (PAT[sec]||[]).forEach(([re,c])=>{const g=new RegExp(re.source,'g');let m;while((m=g.exec(lw))){for(let i=m.index;i<m.index+m[0].length;i++)if(!cls[i])cls[i]=c;if(!g.global||m[0].length==0)break}});
  // magic e
  if(sec==3&&/[aeiou][^aeiou]e$/.test(lw)){const n=lw.length;cls[n-3]='me';cls[n-1]='me'}
  // vowels for simple words
  lw.split('').forEach((c,i)=>{if(!cls[i]&&'aeiou'.includes(c)&&(sec<=2))cls[i]='v'});
  return w.split('').map((c,i)=>`<span class="tl ${cls[i]}" data-c="${c}">${c}</span>`).join('');
}

$('#hbtn').onclick=()=>{S.view='home';render()};
function vIcon(){$('#vbtn').classList.toggle('off',!S.auto);$('#vbtn').textContent=S.auto?'🔊':'🔇'}
$('#vbtn').onclick=()=>{S.auto=!S.auto;ST.set('auto',S.auto);vIcon();toast(S.auto?'స్వయంగా చదవడం ఆన్':'స్వయంగా చదవడం ఆఫ్')};
// ---------- home ----------
function home(){
  stopAP();
  const tot=DATA.reduce((a,s)=>a+s.w.length,0),dn=DATA.reduce((a,s,i)=>a+secDone(i),0);
  app.innerHTML=`<div class="search"><input id="q" placeholder="🔍 పదం వెతకండి… (ఉదా: cat / పిల్లి)"></div><div id="sr"></div>
  <div class="small" style="margin:0 0 8px">మొత్తం <b>${tot}</b> పదాలు · నేర్చుకున్నవి ⭐ <b>${dn}</b></div>
  <div class="grid" id="secs">${DATA.map((s,i)=>{const d=secDone(i),pc=Math.round(d/s.w.length*100);return `<button class="sc" style="--c:${COL[i]}" data-s="${i}"><span class="ic">${s.ic}</span><span class="t">${i+1}. ${s.te}</span><span class="e en">${s.en}</span><span class="small">${s.w.length} పదాలు · ⭐ ${d} ${best[s.id]!=null?'· 🏆 '+best[s.id]+'%':''}</span><span class="bar"><i style="width:${pc}%"></i></span></button>`}).join('')}</div>
  <div class="howto"><b>ఎలా నేర్చుకోవాలి? 👇</b><br>
  1️⃣ <b>📖 నేర్చుకో</b> – పదం చూడు, విను, అక్షరాలు చదువు, అర్థం తెలుసుకో.<br>
  2️⃣ <b>📋 పట్టిక</b> – 10 పదాల భాగాలుగా జాబితా; ప్రింట్ కూడా చేయవచ్చు.<br>
  3️⃣ <b>🎯 క్విజ్</b> – అర్థం / పదం / వినికిడి ప్రశ్నలు.<br>
  4️⃣ <b>✍️ స్పెల్లింగ్</b> – అక్షరాలను సరైన క్రమంలో అమర్చు.<br>
  🎨 రంగు అక్షరాలు = ఆ పాఠంలో నేర్చుకోవలసిన శబ్దం.</div>`;
  app.querySelectorAll('.sc').forEach(b=>b.onclick=()=>{S.view='sec';S.sec=+b.dataset.s;S.tab='learn';S.part=0;S.idx=0;render()});
  const q=$('#q');q.oninput=()=>{const t=q.value.trim().toLowerCase();if(!t){$('#sr').innerHTML='';return}
    const r=[];DATA.forEach((s,i)=>s.w.forEach((e,j)=>{if(e[0].toLowerCase().startsWith(t)||e[2].includes(t)||e[1].includes(t))r.push([i,j,e])}));
    $('#sr').innerHTML=r.length?`<table style="margin-bottom:12px"><tr><th>పదం</th><th>ఉచ్చారణ</th><th>అర్థం</th><th class="sp">🔊</th></tr>${r.slice(0,30).map(([i,j,e])=>`<tr data-i="${i}" data-j="${j}"><td class="w">${e[3]||''} ${e[0]}</td><td>${e[1]}</td><td>${e[2]}<div class="small">${DATA[i].te}</div></td><td><button class="sp" data-w="${esc(e[0])}">🔊</button></td></tr>`).join('')}</table>`:'<p class="small">దొరకలేదు</p>';
    $('#sr').querySelectorAll('tr[data-i]').forEach(tr=>tr.onclick=ev=>{const i=+tr.dataset.i,j=+tr.dataset.j;if(ev.target.closest('.sp')){sayFull(DATA[i].w[j]);return}S.view='sec';S.sec=i;S.tab='learn';S.part=Math.floor(j/PS);S.idx=j%PS;render()})};
}
// ---------- section ----------
const TABS=[['learn','📖 నేర్చుకో'],['table','📋 పట్టిక'],['quiz','🎯 క్విజ్'],['spell','✍️ స్పెల్లింగ్']];
function secView(){
  const s=sec(),n=parts();
  app.innerHTML=`<div class="sechead"><span class="ic">${s.ic}</span><div><div class="t">${S.sec+1}. ${s.te}</div><div class="small en">${s.en} · ${s.w.length} పదాలు</div></div></div>
  <div class="tabs">${TABS.map(([k,t])=>`<button class="tab ${S.tab==k?'act':''}" data-t="${k}">${t}</button>`).join('')}</div>
  <div class="chips">${Array.from({length:n},(_,i)=>{const sl=s.w.slice(i*PS,i*PS+PS),d=sl.every(e=>learnt.has(key(s.id,e[0])));return `<button class="chip ${S.part==i?'act':''} ${d?'done':''}" data-p="${i}">భాగం ${i+1}${d?' ✅':''}</button>`}).join('')}<button class="chip ${S.part<0?'act':''}" data-p="-1">అన్నీ (${s.w.length})</button></div>
  <div id="body"></div>`;
  app.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;S.idx=0;render()});
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{S.part=+b.dataset.p;S.idx=0;render()});
  ({learn,table:tableV,quiz:quizHome,spell:spellV})[S.tab]();
  const a=app.querySelector('.chip.act');a&&a.scrollIntoView({block:'nearest',inline:'center'});
}
// ---------- learn ----------
let apT=null,apOn=false;
function learn(){
  const L=list();if(S.idx>=L.length)S.idx=0;const e=L[S.idx],s=sec(),k=key(s.id,e[0]),gap=ST.get('gap',4);
  $('#body').innerHTML=`<div class="card">
   <span class="cnt">${S.idx+1} / ${L.length}</span>
   <button class="star" id="st" title="నేర్చుకున్నాను">${learnt.has(k)?'⭐':'☆'}</button>
   <div class="emo">${e[3]||'🔤'}</div>
   <div class="tiles" id="tiles">${tiles(e[0],s.id)}</div>
   <div class="pron">${e[1]}</div>
   <div class="mean ${ST.get('hideM',false)?'hid':''}" id="mean">${e[2]}</div>
   <div class="hint">అక్షరం మీద నొక్కితే ఆ అక్షరం వినిపిస్తుంది</div>
   ${legend(s.id)}
   <div class="ctrls">
    <button class="btn w big" id="pv" title="ముందుది">⬅️</button>
    <button class="btn" id="sw">🔊 పదం</button>
    <button class="btn o" id="sl">🐢 నెమ్మదిగా</button>
    <button class="btn y" id="sp">🔤 స్పెల్లింగ్</button>
    <button class="btn g" id="sm">🗣️ అర్థం</button>
    <button class="btn w big" id="nx" title="తరువాతిది">➡️</button>
   </div>
   <div class="ap noprint">
    <button class="btn ${apOn?'o':''}" id="ap">${apOn?'⏸️ ఆపు':'▶️ ఆటో ప్లే'}</button>
    విరామం <select id="gap">${[3,4,6,8].map(g=>`<option ${g==gap?'selected':''} value="${g}">${g} సెకన్లు</option>`).join('')}</select>
    <label><input type="checkbox" id="hm" ${ST.get('hideM',false)?'checked':''}> అర్థం దాచు</label>
   </div></div>`;
  const go=d=>{S.idx=(S.idx+d+L.length)%L.length;learn();if(S.auto&&!apOn)sayFull(L[S.idx])};
  $('#pv').onclick=()=>go(-1);$('#nx').onclick=()=>go(1);
  $('#sw').onclick=()=>sayWord(e[0]);$('#sl').onclick=()=>sayWord(e[0],1);$('#sp').onclick=()=>spellOut(e[0]);
  $('#sm').onclick=()=>sayFull(e);
  $('#mean').onclick=function(){this.classList.remove('hid');stopV();say(e[2],'te-IN',.9)};
  $('#tiles').onclick=ev=>{const t=ev.target.closest('.tl');if(t){stopV();say(t.dataset.c.toUpperCase(),'en-IN',.7)}};
  $('#st').onclick=()=>{learnt.has(k)?learnt.delete(k):learnt.add(k);saveL();learn();if(learnt.has(k))toast('⭐ బాగుంది!')};
  $('#gap').onchange=ev=>{ST.set('gap',+ev.target.value)};
  $('#hm').onchange=ev=>{ST.set('hideM',ev.target.checked);learn()};
  $('#ap').onclick=()=>{apOn?stopAP():startAP();learn()};
  S.go=go;S.cur=e;
}
function startAP(){apOn=true;const step=()=>{if(!apOn)return;const L=list(),e=L[S.idx];sayFull(e,()=>{apT=setTimeout(()=>{if(!apOn)return;S.idx=(S.idx+1)%L.length;if(S.view=='sec'&&S.tab=='learn'){learn();step()}},ST.get('gap',4)*1000)})};
  // fallback if no speech end event
  if(!('speechSynthesis' in window)){apT=setInterval(()=>{S.idx=(S.idx+1)%list().length;learn()},ST.get('gap',4)*1000);return}
  step()}
function stopAP(){apOn=false;clearTimeout(apT);clearInterval(apT);stopV()}
// ---------- table ----------
function tableV(){
  stopAP();const s=sec(),L=list(),off=S.part<0?0:S.part*PS;
  $('#body').innerHTML=`<h2 class="ptitle">${s.en} – ${s.te}${S.part>=0?' (భాగం '+(S.part+1)+')':''}</h2>
  <div class="ctrls noprint" style="margin:0 0 10px"><button class="btn" id="pa">🔊 అన్నీ చదువు</button><button class="btn y" id="pr">🖨️ ప్రింట్ / PDF</button></div>
  <table><tr><th>#</th><th>పదం (Word)</th><th>ఉచ్చారణ</th><th>అర్థం</th><th class="sp">🔊</th></tr>
  ${L.map((e,i)=>`<tr class="${learnt.has(key(s.id,e[0]))?'lrn':''}"><td>${off+i+1}</td><td class="w">${e[0]}</td><td>${e[1]}</td><td>${e[2]}</td><td><button class="sp" data-i="${i}">🔊</button></td></tr>`).join('')}</table>`;
  $('#body').querySelectorAll('.sp').forEach(b=>b.onclick=()=>sayFull(L[+b.dataset.i]));
  $('#pr').onclick=()=>window.print();
  $('#pa').onclick=()=>{stopV();L.forEach(e=>{say(e[0].toLowerCase(),'en-IN',.8);say(e[2].replace(/\(.*?\)/g,''),'te-IN',.95)})};
}
// ---------- quiz ----------
let Q=null;
const QT=[['m','🇬🇧→తె','ఇంగ్లీష్ పదం చూసి తెలుగు అర్థం ఎంచుకో'],['w','తె→🇬🇧','తెలుగు అర్థం చూసి ఇంగ్లీష్ పదం ఎంచుకో'],['l','👂','పదం విని సరైన పదం ఎంచుకో']];
function quizHome(){
  stopAP();const s=sec(),L=list();
  $('#body').innerHTML=`<div class="small" style="margin-bottom:8px">ఈ భాగంలో ${L.length} పదాలు ${best[s.id]!=null?'· 🏆 ఉత్తమ స్కోర్ '+best[s.id]+'%':''}</div>
  <div class="qtype">${QT.map(([k,i,t])=>`<button class="qt" data-k="${k}"><b>${i}</b>${t}</button>`).join('')}</div>
  <div class="ap">ప్రశ్నలు <select id="qn">${[10,20,30].map(n=>`<option value="${n}">${n}</option>`).join('')}<option value="999">అన్నీ</option></select></div>`;
  $('#body').querySelectorAll('.qt').forEach(b=>b.onclick=()=>{const n=+$('#qn').value;Q={type:b.dataset.k,items:shuffle(L).slice(0,n),i:0,ok:0,wrong:[]};qShow()});
}
function qShow(){
  const s=sec();if(Q.i>=Q.items.length)return qEnd();
  const e=Q.items[Q.i],pool=s.w.filter(x=>x[0]!=e[0]&&x[2]!=e[2]),opts=shuffle([e,...shuffle(pool).slice(0,3)]);
  const t=Q.type,prompt=t=='m'?`<div class="emo" style="font-size:2.6rem;min-height:3rem">❓</div><div class="tiles">${tiles(e[0],s.id)}</div><div class="hint">దీని అర్థం ఏమిటి?</div>`:
    t=='w'?`<div class="emo">${e[3]||'❓'}</div><div class="mean">${e[2]}</div><div class="hint">ఇంగ్లీష్ పదం ఏది?</div>`:
    `<button class="btn big" id="rep" style="font-size:2.4rem;padding:16px 26px">🔊</button><div class="hint">విని సరైన పదం నొక్కు</div>`;
  $('#body').innerHTML=`<div class="card"><span class="cnt">ప్రశ్న ${Q.i+1}/${Q.items.length} · ✅ ${Q.ok}</span><div style="height:18px"></div>${prompt}
  <div class="qopts">${opts.map((o,i)=>`<button class="qo ${t=='m'?'':'en'}" data-i="${i}">${t=='m'?o[2]:o[0]}</button>`).join('')}</div><div class="msg" id="qm"></div></div>`;
  if(t=='l'){$('#rep').onclick=()=>sayWord(e[0]);sayWord(e[0])}else if(t=='m'&&S.auto)sayWord(e[0]);
  let done=false;
  $('#body').querySelectorAll('.qo').forEach(b=>b.onclick=()=>{if(done)return;done=true;const o=opts[+b.dataset.i],right=o===e;
    $('#body').querySelectorAll('.qo').forEach((x,i)=>{if(opts[i]===e)x.classList.add('ok')});
    if(right){Q.ok++;b.classList.add('ok');$('#qm').innerHTML='🎉 సరైనది!';$('#qm').style.color='var(--grn)';learnt.add(key(s.id,e[0]));saveL()}
    else{b.classList.add('no');Q.wrong.push(e);$('#qm').innerHTML=`😟 కాదు · <span class="en">${e[0]}</span> = ${e[2]}`;$('#qm').style.color='var(--red)'}
    if(S.auto)sayFull(e);
    setTimeout(()=>{Q.i++;qShow()},right?1400:2600)});
}
function qEnd(){
  const s=sec(),p=Math.round(Q.ok/Q.items.length*100);if(best[s.id]==null||p>best[s.id]){best[s.id]=p;ST.set('best',best)}
  const st=p>=90?'🌟🌟🌟':p>=60?'🌟🌟':p>=30?'🌟':'💪';
  $('#body').innerHTML=`<div class="card res"><div class="big">${st}</div><h2>${Q.ok} / ${Q.items.length} (${p}%)</h2><div>${p>=90?'అద్భుతం!':p>=60?'చాలా బాగుంది!':'మళ్ళీ సాధన చేద్దాం!'}</div>
  ${Q.wrong.length?`<div class="wrong"><b>తప్పుగా చేసిన పదాలు:</b>${Q.wrong.map(e=>`<div><span class="en" style="font-weight:800;font-size:1.15rem">${e[3]||''} ${e[0]}</span> – ${e[1]} – ${e[2]}</div>`).join('')}</div>`:''}
  <div class="ctrls"><button class="btn" id="ag">🔁 మళ్ళీ</button>${Q.wrong.length?'<button class="btn o" id="wr">❌ తప్పులు మాత్రమే</button>':''}<button class="btn w" id="bk">⬅️ క్విజ్ రకాలు</button></div></div>`;
  if(S.auto)say(p>=60?'Very good!':'Try again!','en-IN',.85);
  $('#ag').onclick=()=>{Q={...Q,items:shuffle(Q.items),i:0,ok:0,wrong:[]};qShow()};
  $('#bk').onclick=quizHome;
  const w=$('#wr');if(w)w.onclick=()=>{Q={...Q,items:shuffle(Q.wrong),i:0,ok:0,wrong:[]};qShow()};
}
// ---------- spelling ----------
let SP=null;
function spellV(){
  stopAP();const s=sec(),L=list();if(!SP||SP.sec!=S.sec||SP.part!=S.part)SP={sec:S.sec,part:S.part,order:shuffle(L),i:0,ok:0};
  if(SP.i>=SP.order.length){$('#body').innerHTML=`<div class="card res"><div class="big">🏅</div><h2>${SP.ok} / ${SP.order.length} మొదటి ప్రయత్నంలోనే సరైనవి</h2><div class="ctrls"><button class="btn" id="ag">🔁 మళ్ళీ</button></div></div>`;$('#ag').onclick=()=>{SP=null;spellV()};return}
  const e=SP.order[SP.i],w=e[0].toLowerCase();let typed=[],miss=0;
  let pool=shuffle(w.split('').map((c,i)=>({c,i})));if(w.length>2&&pool.map(x=>x.c).join('')==w)pool=pool.reverse();
  const draw=()=>{$('#body').innerHTML=`<div class="card"><span class="cnt">${SP.i+1}/${SP.order.length} · ✅ ${SP.ok}</span><div style="height:16px"></div>
   <div class="emo">${e[3]||'🔤'}</div><div class="mean">${e[2]}</div><div class="pron" style="font-size:1.2rem">${e[1]}</div>
   <div class="slots">${w.split('').map((c,i)=>`<div class="slot ${typed[i]?'f':''}">${typed[i]?typed[i].c:''}</div>`).join('')}</div>
   <div class="pool">${pool.map((p,j)=>`<button class="pk" data-j="${j}" ${typed.includes(p)?'disabled':''}>${p.c}</button>`).join('')}</div>
   <div class="msg" id="sm"></div>
   <div class="ctrls"><button class="btn" id="hear">🔊 విను</button><button class="btn w" id="undo">⌫ తుడువు</button><button class="btn y" id="hint">💡 సహాయం</button><button class="btn w" id="skip">⏭️ దాటవేయి</button></div></div>`;
   $('#body').querySelectorAll('.pk').forEach(b=>b.onclick=()=>{const p=pool[+b.dataset.j];if(p.c!==w[typed.length]){miss++;b.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}],{duration:250});$('#sm').textContent='🙂 మళ్ళీ ప్రయత్నించు';$('#sm').style.color='var(--org)';return}
     typed.push(p);say(p.c.toUpperCase(),'en-IN',.8);if(typed.length==w.length){if(!miss)SP.ok++;learnt.add(key(sec().id,e[0]));saveL();draw();$('#sm').textContent='🎉 '+e[0]+' – సరైనది!';$('#sm').style.color='var(--grn)';setTimeout(()=>sayWord(e[0]),400);setTimeout(()=>{SP.i++;spellV()},1900)}else draw()});
   $('#hear').onclick=()=>sayWord(e[0],1);
   $('#undo').onclick=()=>{typed.pop();draw()};
   $('#hint').onclick=()=>{miss++;const need=w[typed.length];const p=pool.find(p=>!typed.includes(p)&&p.c==need);if(p){typed.push(p);if(typed.length==w.length){SP.i++;spellV()}else draw()}};
   $('#skip').onclick=()=>{SP.i++;spellV()};
  };
  draw();if(S.auto)sayWord(e[0]);
}
// ---------- render ----------
function render(){vIcon();menu();if(S.view!='sec')stopAP();S.view=='home'?home():secView();ST.set('pos',{sec:S.sec,part:S.part,idx:S.idx,tab:S.tab,view:S.view});window.scrollTo(0,0)}
document.addEventListener('keydown',ev=>{
  if(ev.target.tagName=='INPUT'||ev.target.tagName=='SELECT')return;
  if(ev.key=='Escape'||(ev.key=='Backspace')){ev.preventDefault();menu();openMenu(!$('#menu').classList.contains('open'));return}
  if(/^[1-7]$/.test(ev.key)){S.view='sec';S.sec=+ev.key-1;S.tab='learn';S.part=0;S.idx=0;render();return}
  if(S.view=='sec'&&S.tab=='learn'&&S.go){if(ev.key=='ArrowRight'||ev.key=='ArrowDown'){ev.preventDefault();S.go(1)}else if(ev.key=='ArrowLeft'||ev.key=='ArrowUp'){ev.preventDefault();S.go(-1)}else if(ev.key=='Enter'){ev.preventDefault();sayFull(S.cur)}}
});
// యాప్ బ్యాక్ (రాయ్ విద్యార్థి): మెనూ → మూసు, విభాగం → హోమ్; హోమ్‌లో false = యాప్ టూల్ మూసుతుంది
window.rvBack=function(){stopAP();if($('#menu').classList.contains('open')){openMenu(false);return true}if(S.view!=='home'){S.view='home';render();return true}return false};
// resume
(function(){const p=ST.get('pos',null);if(p&&p.view=='sec'&&DATA[p.sec]){Object.assign(S,p)}render()})();
</script>
</body>
</html>
