<html lang="te">
<head>

<title>గణిత పుస్తకం – ఆడుతూ నేర్చుకునే గణితం | రాయ్ ఎడ్యుకేషన్</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@500;700;800&family=Noto+Sans+Telugu:wght@400;600;700&family=Tiro+Telugu&display=swap" rel="stylesheet">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-6ZG763KFGF"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-6ZG763KFGF');</script>
<style>
:root{--desk:#c7d7cb;--paper:#fffdf6;--ink:#2b2b2b;--muted:#6b6b6b;--edge:#e8a23a;--acc:#3a7bd5;--red:#e85d75;--grn:#2e9e5b;--org:#f08a24;--yel:#f6c453;--line:#d9d2c3}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Noto Sans Telugu',sans-serif;background:var(--desk);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
button{font-family:inherit}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#ffffffb8;position:sticky;top:0;z-index:30;box-shadow:0 1px 6px #0001}
header h1{font:800 1.25rem 'Baloo Tamma 2',sans-serif;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1 small{font:600 .8rem 'Noto Sans Telugu';color:var(--muted);margin-left:6px}
.hbtn{min-width:44px;min-height:44px;border:0;border-radius:12px;background:#fff;box-shadow:0 1px 4px #0002;font-size:1.05rem;cursor:pointer;padding:0 10px}
.hbtn.on{background:#dff3e6;outline:2px solid var(--grn)}
.stars{font:700 1rem 'Baloo Tamma 2';background:#fff6d6;border-radius:12px;padding:8px 10px;white-space:nowrap}
.stage{flex:1;display:flex;justify-content:center;align-items:flex-start;padding:14px 10px 8px}
.book{position:relative;display:grid;grid-template-columns:1fr 1fr;width:min(1240px,100%);perspective:2400px;background:linear-gradient(#f2b14c,var(--edge));padding:6px 6px 12px;border-radius:8px;box-shadow:0 22px 44px #0003,0 4px 0 #c9852a inset}
.page{background:var(--paper);min-height:min(78vh,640px);padding:22px 26px 26px;position:relative;overflow:hidden}
.page.left{border-radius:5px 0 0 5px;box-shadow:inset -22px 0 26px -18px #0004;border-right:1px solid #e7dfcd}
.page.right{border-radius:0 5px 5px 0;box-shadow:inset 22px 0 26px -18px #0004}
.page::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent 0 31px,#00000006 31px 32px)}
.leaf{position:absolute!important;top:6px;bottom:12px;width:calc(50% - 6px);z-index:8;pointer-events:none;backface-visibility:hidden;min-height:0!important}
.leaf-next{left:50%;transform-origin:left center;animation:flipN .75s cubic-bezier(.45,.05,.55,.95) forwards}
.leaf-prev{left:6px;transform-origin:right center;animation:flipP .75s cubic-bezier(.45,.05,.55,.95) forwards}
@keyframes flipN{0%{transform:rotateY(0);filter:brightness(1)}100%{transform:rotateY(-180deg);filter:brightness(.7)}}
@keyframes flipP{0%{transform:rotateY(0);filter:brightness(1)}100%{transform:rotateY(180deg);filter:brightness(.7)}}
.slide-l{animation:sl .45s ease}.slide-r{animation:sr .45s ease}
@keyframes sl{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes sr{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
/* left page */
.chno{font:700 .85rem 'Baloo Tamma 2';color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
.ctitle{font:800 1.9rem/1.2 'Baloo Tamma 2',sans-serif;margin:2px 0 6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cls{font:600 .8rem 'Noto Sans Telugu';background:#eef4ff;color:var(--acc);border-radius:20px;padding:3px 10px}
.key{font:700 1.25rem 'Baloo Tamma 2';margin:10px 0 14px;padding:8px 14px;border-left:5px solid var(--edge);background:#fff4df;border-radius:0 10px 10px 0}
.body p{font-family:'Tiro Telugu',serif;font-size:1.08rem;line-height:1.75;margin:0 0 8px}
.tip{display:flex;gap:10px;align-items:flex-start;margin:14px 0;padding:10px 12px;border:1.5px dashed #c9bfa8;border-radius:12px;font-size:.95rem;background:#fffaf0}
.chal{margin-top:12px;padding:12px 14px;border-radius:14px;background:#eef8f1;border:1.5px solid #bfe3cc}
.chal h4{margin:0 0 6px;font:700 1.05rem 'Baloo Tamma 2'}
.chal .q{font-size:1.02rem;margin-bottom:8px;line-height:1.6}
.qrow{display:flex;gap:8px;flex-wrap:wrap}
.qrow input{font:700 1.3rem 'Baloo Tamma 2';width:120px;min-height:46px;border:2px solid #9cc9ad;border-radius:10px;padding:0 10px;text-align:center}
.fb{min-height:1.6em;font-weight:700;margin-top:6px}
.fb.ok,.ok{color:var(--grn)}.fb.no,.warn{color:#c0392b}.muted{color:var(--muted)}
.spk{position:absolute;right:16px;top:16px;z-index:2}
/* right page */
.mt{display:none;font:800 1.3rem 'Baloo Tamma 2';margin-bottom:6px}
.fig{width:100%;height:auto;display:block;margin:6px auto;max-height:52vh;touch-action:manipulation}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.ctl{display:flex;gap:8px 14px;flex-wrap:wrap;justify-content:center;margin:4px 0 8px}
.btn{min-height:44px;min-width:44px;border:0;border-radius:12px;padding:0 16px;font-weight:700;font-size:1rem;cursor:pointer;background:var(--acc);color:#fff;box-shadow:0 3px 0 #2a5ea8;transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #2a5ea8}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 2px 0 #cfc6b4,0 0 0 1.5px #d8cfbd inset}
.btn.chip{background:#fff;color:var(--ink);box-shadow:0 0 0 1.5px #d8cfbd inset;border-radius:22px}
.btn.chip.on{background:var(--ink);color:#fff;box-shadow:none}
.btn.sm{padding:0;width:44px;font-size:1.3rem}
.stp{display:flex;align-items:center;gap:6px;background:#fff;border-radius:14px;padding:4px 6px 4px 12px;box-shadow:0 0 0 1.5px #e3dccb inset}
.stp-l{font-size:.92rem;font-weight:600}
.stp-v{font:800 1.35rem 'Baloo Tamma 2';min-width:30px;text-align:center}
.bigline{display:flex;align-items:baseline;justify-content:center;gap:12px;flex-wrap:wrap;margin:4px 0}
.bigline .num{font:800 3rem/1 'Baloo Tamma 2';color:var(--red)}
.bigline .word{font:700 1.4rem 'Tiro Telugu'}
.bigline .sub{font-size:.98rem;color:var(--muted);width:100%;text-align:center}
.eq{text-align:center;font:600 1.15rem/1.7 'Baloo Tamma 2','Noto Sans Telugu';min-height:2.2em;margin:6px 0}
.eq b{color:var(--red);font-size:1.3em}
.flash{text-align:center;min-height:1.6em;font-weight:700;color:var(--org)}
.flash.go{animation:pop .6s}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
/* svg sketch style */
.fig text{font-family:'Baloo Tamma 2','Noto Sans Telugu';fill:var(--ink)}
.frame{fill:#fff;stroke:var(--ink);stroke-width:2.5}
.cellbox{fill:transparent;stroke:var(--ink);stroke-width:1.5;cursor:pointer}
.cell:hover .cellbox{fill:#00000008}
.seed{opacity:0;transform:scale(.2);transform-box:fill-box;transform-origin:center;transition:.25s;stroke:var(--ink);stroke-width:2;pointer-events:none}
.seed.on{opacity:1;transform:scale(1)}
.seed.a{fill:var(--red)}.seed.b{fill:#4c8bf5}
.nl{stroke:var(--ink);stroke-width:3}.tick{stroke:var(--ink);stroke-width:1.6}
.tl{font-size:11px;text-anchor:middle}.tl.b{font-size:14px;font-weight:800}
.arc{fill:none;stroke:var(--org);stroke-width:2.5;stroke-dasharray:6 5}
.arcl{font-size:14px;font-weight:800;text-anchor:middle;fill:var(--org)!important}
.ink{stroke:var(--ink);stroke-width:2}
/* money */
.shop{display:flex;justify-content:center;margin:4px 0}
.item{display:flex;gap:14px;align-items:center;background:#fff;border-radius:16px;padding:10px 18px;box-shadow:0 2px 0 #e3dccb,0 0 0 1.5px #e3dccb inset;font-weight:700;font-size:1.05rem}
.item .emo{font-size:3rem}
.price{font:800 1.6rem 'Baloo Tamma 2';color:var(--red)}
.tray{min-height:86px;margin:10px auto;padding:10px;border:2.5px dashed #b9ad94;border-radius:18px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;background:#fffaf0;max-width:520px}
.tray .hint{color:var(--muted);font-size:.95rem}
.purse{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0}
.coin,.note{border:2px solid var(--ink);cursor:pointer;font:800 1rem 'Baloo Tamma 2';color:var(--ink);display:inline-flex;align-items:center;justify-content:center;transition:transform .1s}
.coin:active,.note:active{transform:scale(.9)}
.coin{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#cfd4da 70%)}
.coin.c10{background:radial-gradient(circle at 50% 50%,#d8dde3 0 45%,#e9c46a 46%)}
.coin.c5{background:radial-gradient(circle at 35% 30%,#fff3c4,#e7b84a 75%)}
.coin.c1{width:44px;height:44px}
.note{width:84px;height:46px;border-radius:6px}
.note.n20{background:#e6f2b8}.note.n50{background:#bfe9ef}.note.n100{background:#d9cff3}
/* place value controls */
.pvctl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:460px;margin:4px auto}
.pvc{display:flex;align-items:center;justify-content:center;gap:4px;background:#fff;border-radius:14px;padding:4px;box-shadow:0 0 0 1.5px #e3dccb inset}
.pvc b{font:800 1.4rem 'Baloo Tamma 2';min-width:24px;text-align:center}
/* column arithmetic */
.colgrid{display:grid;justify-content:center;gap:2px 4px;margin:12px auto;font:800 2.1rem/1 'Baloo Tamma 2'}
.colgrid>div{min-height:50px;display:flex;align-items:center;justify-content:center;position:relative;border-radius:8px;transition:background .25s}
.colgrid .lab{font:700 .8rem 'Noto Sans Telugu';color:var(--muted);min-height:24px}
.colgrid .cr{font-size:1.3rem;color:var(--red);min-height:30px}
.colgrid .res{border-top:3px solid var(--ink);border-radius:0;color:var(--grn)}
.colgrid .hi{background:#fff1c9}
.colgrid .sg{color:var(--muted)}
.colgrid .pre{font-size:1.15rem;color:var(--red);margin-right:1px;align-self:flex-start;margin-top:6px}
.colgrid .add{font-size:.95rem;color:var(--red);position:absolute;top:-2px;right:-6px}
.colgrid .faded{opacity:.25}
.newd{animation:pop .5s}
.stepmsg{background:#fff;border-radius:14px;padding:10px 14px;box-shadow:0 0 0 1.5px #e3dccb inset;font-size:1.05rem;line-height:1.6;min-height:3.4em;max-width:560px;margin:8px auto}
.stepmsg .sn{display:inline-block;font:700 .8rem 'Baloo Tamma 2';background:var(--ink);color:#fff;border-radius:10px;padding:0 8px;margin-right:6px}
/* division */
.ldbox{display:block;margin:10px auto;max-width:600px}
.ldhead{text-align:center;font:800 2.2rem 'Baloo Tamma 2';margin:6px 0}
.ldhead .dv{color:var(--acc)}.ldhead .qq{color:var(--grn)}
.ldhead .cur{background:#fff1c9;border-radius:6px;padding:0 3px}
.ldhead .z{opacity:.3}
.ldwrap{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.ldlog{margin:0;padding-left:22px;flex:1;min-width:220px;font-size:.98rem;line-height:1.7}
.ldlog li{margin-bottom:4px}
.tagv{background:#d9f2e2;color:#1d7a43;border-radius:8px;padding:0 6px;font-weight:700}
.tagr{background:#ffe3cc;color:#b35a00;border-radius:8px;padding:0 6px;font-weight:700}
.ldtbl{display:grid;grid-template-columns:auto;gap:2px;font:700 1rem 'Baloo Tamma 2';background:#fff;border-radius:12px;padding:8px 12px;box-shadow:0 0 0 1.5px #e3dccb inset;align-self:flex-start}
.ldtbl div{padding:0 8px;border-radius:6px}
.ldtbl .v{background:#bdebcf}.ldtbl .r{background:#ffd7b0}
.colgrid small{font-size:.8rem;font-weight:800}
.colgrid .cj1{color:#3a7bd5}.colgrid .cj2{color:#8e44ad}.colgrid .ck{color:var(--grn)}
.colgrid .dim{opacity:.28}
.colgrid .pp{color:#8a5a00}
.colgrid .ph{color:#9b59b6;opacity:.75}
.colgrid .topline{border-top:3px solid var(--ink);border-radius:0}
.mulgrid{font-size:1.9rem}
@media (max-width:899px){.mulgrid{font-size:1.45rem}.mulgrid>div{min-height:40px}.mulgrid .cr{min-height:24px}}
/* horizontal multiplication */
.hmarea{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:flex-start;margin:8px 0;min-height:120px}
.hlines{flex:1 1 280px;max-width:540px}
.hl{font:700 1.45rem/1.5 'Baloo Tamma 2',sans-serif;padding:3px 10px;border-radius:10px;word-break:break-word}
.hl.cur{background:#fff1c9}
.hl b{color:var(--red)}
.hl.sm{font-size:1.05rem;font-weight:600;border-bottom:1px dashed #e3dccb;border-radius:0;padding:5px 4px}
.hside{flex:1 1 240px;max-width:420px;background:#fff;border-radius:14px;padding:8px 10px;box-shadow:0 0 0 1.5px #e3dccb inset}
.hst{font:700 .9rem 'Noto Sans Telugu';color:var(--muted)}
.hmsvg{max-width:520px;max-height:none}
.hmsvg .hmd{font:800 30px 'Baloo Tamma 2',sans-serif}
.hmsvg .hma{font:800 32px 'Baloo Tamma 2';fill:var(--grn)}
.hmsvg .hmc{font:800 18px 'Baloo Tamma 2';fill:var(--red)}
.hmsvg .hmt{font:700 21px 'Baloo Tamma 2';fill:#8a5a00}
.hmsvg .hmt.on{fill:#c45500;font-weight:800}
.hmsvg .hml{font:600 12px 'Noto Sans Telugu';fill:var(--muted)}
.hmsvg .op{fill:var(--muted)}
.hmsvg .z{opacity:.28}
.hmsvg .newd{transform-box:fill-box;transform-origin:center}
.grow2{animation:fadein .5s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media (max-width:899px){.hl{font-size:1.15rem}}
.hdir{display:flex;flex-direction:column;gap:6px;align-items:flex-start;width:100%;overflow-x:auto;padding-bottom:4px}
.hrow{display:flex;align-items:flex-end;gap:2px;padding:4px 10px;border-radius:12px;flex-wrap:nowrap;margin:0 auto;flex:none}
.hrow.sum{flex-wrap:wrap;justify-content:flex-end;max-width:100%}.hbr{flex-basis:100%;height:0}
.hrow.sum .hc b{font-size:1.55rem}.hrow.sum .hop{font-size:1.3rem;padding:0 3px}.hrow.sum .hc{min-width:22px}.hrow.sum .hc b,.hrow.sum .hc.slot b{min-width:22px}
.hrow.act{background:#fff8e6;box-shadow:0 0 0 2px #f6c453 inset}
.hrow.done{opacity:.75}
.hc{display:flex;flex-direction:column;align-items:center;min-width:30px}
.hc .hcar{font:800 1rem/1.2 'Baloo Tamma 2';color:var(--red);font-style:normal;min-height:1.2em}
.hc b{font:800 2rem/1.2 'Baloo Tamma 2',sans-serif;padding:0 3px;border-radius:8px;min-width:30px;text-align:center}
.hc.hi b{background:#fff1c9;box-shadow:0 0 0 2px #f0b53a inset}
.hc.hi2 b{color:var(--grn)}
.hc.slot b{border-bottom:3px solid #c9bfa8;color:var(--grn);border-radius:6px 6px 0 0;min-width:32px}
.hc.slot.empty b{color:transparent}
.hc.zz b{color:#9b59b6}
.hc .newd{display:inline-block}
.hop{font:800 1.7rem/1.2 'Baloo Tamma 2';color:var(--muted);padding:0 6px}
@media (max-width:899px){.hrow.sum .hc b{font-size:1.15rem;min-width:15px;padding:0 1px}.hrow.sum .hc,.hrow.sum .hc.slot b{min-width:15px}.hc b{font-size:1.45rem;min-width:22px}.hc{min-width:22px}.hc.slot b{min-width:22px}.hop{font-size:1.3rem;padding:0 3px}.hrow{padding:4px 4px}}
.hmsvg.board{max-width:600px;border-radius:14px;box-shadow:0 0 0 6px #a8682c,0 6px 16px #0003;margin:10px auto}
.board .bd{font:800 34px 'Baloo Tamma 2',sans-serif;fill:#f4f4f4}
.board .bd.op{fill:#bfc7c2}
.board .bd.ans{fill:#ffe27a}
.board .bnum{font:800 14px 'Baloo Tamma 2',sans-serif}
.board .bcar{font:800 18px 'Baloo Tamma 2',sans-serif}
/* clock 24h */
.fig text.hnow{fill:#e85d75!important;font-size:30px}
.conv{text-align:center;font:600 1.1rem/1.6 'Baloo Tamma 2','Noto Sans Telugu';margin:4px 0}
.conv b{color:var(--red)}
.daybar{position:relative;height:30px;max-width:520px;margin:10px auto 26px;border-radius:15px;cursor:pointer;border:2px solid var(--ink);background:linear-gradient(90deg,#1d2b53 0%,#2c3e7a 16%,#f7a072 24%,#ffe9a8 34%,#fff6c9 50%,#ffe39a 64%,#f08a24 75%,#5b3a8c 82%,#1d2b53 100%)}
.dmark{position:absolute;top:50%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:#fff;border:3px solid var(--red);display:flex;align-items:center;justify-content:center;font-size:1rem;transition:left .3s;pointer-events:none}
.dl{position:absolute;top:32px;transform:translateX(-50%);font:700 .75rem 'Baloo Tamma 2';color:var(--muted)}
.uses{margin:14px auto 4px;max-width:620px;background:#f6f0ff;border:1.5px solid #dccbf2;border-radius:16px;padding:10px 12px}
.uses h4{margin:0 0 4px;font:800 1.1rem 'Baloo Tamma 2'}
.uses p{margin:0 0 8px;font-size:.92rem}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.ucard{display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border:0;border-radius:14px;padding:8px 6px;box-shadow:0 2px 0 #dccbf2,0 0 0 1.5px #e6dcf5 inset;cursor:pointer;text-align:center;font-family:inherit;color:var(--ink);min-height:44px}
.ucard:active{transform:scale(.97)}
.ucard .uic{font-size:1.8rem}.ucard b{font-size:.9rem}.ucard .ud{font-size:.75rem;color:var(--muted)}
.ucard .ut{font:800 1.2rem 'Baloo Tamma 2';color:#8e44ad}.ucard .ut small{display:block;font:600 .72rem 'Noto Sans Telugu';color:var(--ink)}
/* measurements */
.mplay{margin:4px 0 10px}
.mh{font:800 1.1rem 'Baloo Tamma 2';margin:12px 0 6px;text-align:center}
.mh small{font:600 .8rem 'Noto Sans Telugu'}
.bigline .num small{font-size:1.1rem;color:var(--ink)}
.water{fill:#6fb6f2cc;transform-box:fill-box;transform-origin:center bottom;transition:transform .45s ease}
.coin.wt{width:auto;height:40px;border-radius:20px;padding:0 10px;background:#c9d2da;font-size:.85rem}
.mconv{background:#eef8f4;border:1.5px solid #bfe3d3;border-radius:16px;padding:6px 10px 10px;margin:12px auto;max-width:640px}
.fig.stair{max-height:none;max-width:440px}
.mrow{justify-content:center;margin:6px 0}
.mrow input{width:90px}
.u2{font-weight:700;font-size:.9rem}
.msteps{font:600 1.02rem/1.8 'Baloo Tamma 2','Noto Sans Telugu'}
.mres{font:800 1.6rem 'Baloo Tamma 2';color:var(--grn);margin-top:4px}
/* geometry */
.gpane{margin-top:4px}
.tinfo{font-size:1rem}
.swatch{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px #bbb;cursor:pointer}
.swatch.on{box-shadow:0 0 0 3px var(--ink)}
.lgrid .ucard{cursor:pointer}.lgrid .fig{max-height:70px;margin:0}
/* data handling */
.dq{text-align:center;font:700 1.15rem 'Noto Sans Telugu';margin:6px 0}
.dqi{font:700 1.05rem 'Noto Sans Telugu';width:min(420px,90%);min-height:44px;border:1.5px dashed #b9a4d6;border-radius:12px;padding:0 10px;text-align:center}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin:6px 0}
.vcard{background:#fff;border-radius:14px;padding:6px;text-align:center;box-shadow:0 0 0 1.5px #e3dccb inset;display:flex;flex-direction:column;align-items:center;gap:2px}
.vcard .ve{font-size:1.8rem}.vcard .vn{font-size:.9rem}
.vni{width:100%;font:700 .85rem 'Noto Sans Telugu';border:1px dashed #bbb;border-radius:8px;text-align:center;min-height:32px}
.vrow{display:flex;align-items:center;gap:4px}.vc{font:800 1.3rem 'Baloo Tamma 2';min-width:28px}

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const SVGNS='http://www.w3.org/2000/svg';

const store={get(k,d){try{const v=localStorage.getItem('ganitham_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('ganitham_'+k,JSON.stringify(v));}catch(e){}}};
const U=['సున్నా','ఒకటి','రెండు','మూడు','నాలుగు','ఐదు','ఆరు','ఏడు','ఎనిమిది','తొమ్మిది','పది','పదకొండు','పన్నెండు','పదమూడు','పద్నాలుగు','పదిహేను','పదహారు','పదిహేడు','పద్దెనిమిది','పందొమ్మిది'];
const T=['','','ఇరవై','ముప్పై','నలభై','యాభై','అరవై','డెబ్బై','ఎనభై','తొంభై'];
function tw(n){if(n<20)return U[n];if(n<100)return T[Math.floor(n/10)]+(n%10?' '+U[n%10]:'');if(n<1000){const hh=Math.floor(n/100),r=n%100;if(!r)return hh===1?'వంద':U[hh]+' వందలు';return(hh===1?'నూట':U[hh]+' వందల')+' '+tw(r);}return String(n);}
const PLACE=['ఒకట్ల స్థానం','పదుల స్థానం','వందల స్థానం','వేల స్థానం'];
const PL=['ఒ','ప','వం','వే'];
const dg=(n,p)=>{const st=String(n);return p<st.length?+st[st.length-1-p]:null;};

/* ---------- voice ---------- */
let voiceOn=store.get('voice',false);
function speak(t,lang){
  try{if(!('speechSynthesis' in window)||!t)return;lang=lang||'te-IN';
    t=String(t).replace(/<[^>]+>/g,' ').replace(/×/g,' ఇంటూ ').replace(/÷/g,' భాగహారం ').replace(/−/g,' తీసివేత ').replace(/\+/g,' కూడిక ').replace(/=/g,' సమానం ').replace(/₹/g,' రూపాయలు ').replace(/[🎵✓✗⭐🔄🐸🐜➡⬅▶◀]/gu,' ');
    speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=.92;
    const vs=speechSynthesis.getVoices();const v=vs.find(x=>x.lang&&x.lang.replace('_','-').toLowerCase()===lang.toLowerCase())||vs.find(x=>x.lang&&x.lang.toLowerCase().startsWith(lang.slice(0,2)));if(v)u.voice=v;
    speechSynthesis.speak(u);}catch(e){}
}
const say=t=>{if(voiceOn)speak(t);};

/* ---------- stars ---------- */
let stars=store.get('stars',0);

function addStar(){stars++;store.set('stars',stars);showStars();const e=$('stars');e.classList.remove('flash','go');void e.offsetWidth;e.classList.add('flash','go');}

/* ---------- challenge helpers ---------- */
function quiz(C,gen){
  h('h4',{text:'🎯 సవాలు'},C);const q=h('div',{class:'q'},C);const row=h('div',{class:'qrow'},C);
  const inp=h('input',{type:'number',inputmode:'numeric',placeholder:'జవాబు','aria-label':'జవాబు'},row);
  btn(row,'చూడు ✓',check);btn(row,'మరొకటి',next,'ghost');const fb=h('div',{class:'fb'},C);let cur,tries=0;

  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.stopPropagation();check();}});
  next();
}
function goal(C,make){
  h('h4',{text:'🎯 సవాలు – బొమ్మలో చూపించండి'},C);const q=h('div',{class:'q'},C);const fb=h('div',{class:'fb'},C);
  let g,done=false;btn(h('div',{class:'qrow'},C),'కొత్త సవాలు',next,'ghost');
  function next(){g=make();q.innerHTML=g.text;fb.textContent='';fb.className='fb';done=false;}
  next();
  return{check(st){if(!done&&g.test(st)){done=true;fb.textContent='✓ సరిగ్గా చూపించారు! ⭐';fb.className='fb ok';addStar();say('శభాష్! సరిగ్గా చూపించారు');setTimeout(()=>{if(C.isConnected)next();},2200);}}};
}

/* ---------- cleanup registry ---------- */
let CL=[];const onClean=f=>CL.push(f);

/* ---------- step demo engine (column add / sub / mul / division) ---------- */
function stepDemo(R,o){
  const top=h('div',{class:'row'},R);let lvl=0;

  btn(ctr,'🔄 కొత్త లెక్క',fresh,'ghost');const bk=btn(ctr,'◀',()=>show(i-1),'ghost');const nx=btn(ctr,'తర్వాత అడుగు ▶',()=>show(i+1));btn(ctr,'▶▶',()=>show(frames.length-1),'ghost');

function recorder(){const st={carry:{},res:{},pre:{},add:{}};const frames=[];return{frames,push(o){['carry','res','pre','add'].forEach(k=>{if(o[k])Object.assign(st[k],o[k]);});frames.push({hi:o.hi,msg:o.msg,carry:{...st.carry},res:{...st.res},pre:{...st.pre},add:{...st.add},newKey:o.newKey});}};}

/* ---------- chapters ---------- */
const CH=[
/* 1 Ten frame */
{t:'పది చట్రం – లెక్కపెడదాం',c:'1–2 తరగతి',col:'#e85d75',key:'10 + 3 = 13',
 body:['పది చట్రంలో 10 గడులు ఉంటాయి – పైన 5, కింద 5.','ఒక చట్రం పూర్తిగా నిండితే అది ఒక <b>పది</b>. రెండో చట్రంలో ఉన్నవి <b>ఒకట్లు</b>.','13 అంటే ఒక పది, మూడు ఒకట్లు.'],
 tip:'గడిని తాకితే గింజ పడుతుంది. నిండిన గడిని తాకితే అక్కడి నుండి తీసేస్తుంది.',
 build(R,C){
  let n=0;const g=goal(C,()=>{const t=rnd(1,20);return{text:'పది చట్రంలో <b>'+t+'</b> ('+tw(t)+') గింజలు పెట్టండి',test:v=>v===t};});
  const big=h('div',{class:'bigline'},R);const sv=svgBox(R,'0 0 340 248');const cells=[];
  for(let f=0;f<2;f++){s('rect',{x:14,y:10+f*122,width:312,height:106,rx:10,class:'frame'},sv);
   for(let r=0;r<2;r++)for(let c=0;c<5;c++){const i=f*10+r*5+c,x=20+c*60,y=16+f*122+r*47;const gg=s('g',{class:'cell',onclick:()=>{n=i<n?i:i+1;upd();}},sv);s('rect',{x,y,width:60,height:47,class:'cellbox'},gg);cells.push(s('circle',{cx:x+30,cy:y+23.5,r:16,class:'seed '+(f?'b':'a')},gg));}}

{t:'గుణకారం – నిలువు పద్ధతి',c:'3–5 తరగతి',col:'#d35400',key:'234 × 65 = 15210',
 body:['గుణకంలోని <b>ఒక్కో అంకెతో</b> పై సంఖ్య మొత్తాన్ని ఒకట్ల స్థానం నుండి గుణించాలి.','లబ్ధం 10 లేదా ఎక్కువ అయితే – <b>ముందు</b> పదుల అంకెను పక్క అంకె <b>పైన</b> రాయాలి, <b>తర్వాత</b> ఒకట్ల అంకెను కింద రాయాలి.','పదుల అంకెతో గుణించేటప్పుడు ఒకట్ల స్థానంలో <b>0</b>, వందల అంకెతో అయితే <b>0, 0</b> రాసి మొదలు పెట్టాలి. చివరగా వరుసలన్నీ <b>కూడాలి</b>.'],

 build(R,C){

  function gen(){const L=LV[lvl];let a,b,k=0;do{a=rnd(L.a[0],L.a[1]);b=rnd(L.b[0],L.b[1]);k++;}while(k<300&&((a%10)*(b%10)<10||(String(b).length>1&&b%10===0)));return{a,b};}
  function ownCalc(){const a=Math.floor(+aIn.value),b=Math.floor(+bIn.value);if(!(a>=1&&a<=9999&&b>=1&&b<=999&&String(a).length+String(b).length<=7)){msg.innerHTML='<span class=warn>సంఖ్య 1–9999, గుణకం 1–999 మధ్య ఇవ్వండి.</span>';return;}load({a,b});}

   push('<b>'+a+' × '+b+'</b>. '+(nb>1?'గుణకం '+b+' లోని ఒక్కో అంకెతో '+a+' ని గుణిద్దాం – ':'')+'<b>ఒకట్ల స్థానం</b> నుండి మొదలు.',null,[],'',0);
   for(let j=0;j<nb;j++){const bj=dg(b,j),P='P'+j,CR='c'+j;
    if(nb>1){const z={};for(let k=0;k<j;k++)z[k]=0;push(PLX[j]+' అంకె <b>'+bj+'</b> తో గుణిద్దాం.'+(j?' ముందు '+(j===1?'ఒకట్ల స్థానంలో <b>0</b>':'ఒకట్లు, పదుల స్థానాల్లో <b>0, 0</b>')+' రాయాలి.':''),j?{[P]:z}:null,[['B',j]],j?P+':0':'',j+1);}
    if(bj===0){const z={};for(let k=0;k<la;k++)z[k+j]=0;push('0 తో గుణిస్తే అన్నీ <b>0</b> – ఈ వరుసలో 0 లు రాయాలి.',{[P]:z},[['B',j]],'',j+1);continue;}
    let c=0;for(let k=0;k<la;k++){const x=dg(a,k),pr=x*bj,s=pr+c,p=k+j,hi=[['A',k],['B',j],[CR,k]];
     push(x+' × '+bj+' = '+pr+(c?' , + '+c+' (పైన రాసినది) = <b>'+s+'</b>':''),null,hi,'',j+1);
     if(s>=10){const cc=Math.floor(s/10);push(s+' – <b>ముందు</b> '+cc+' ని '+(k<la-1?'పక్క అంకె':'ఎడమ వైపు')+' <b>పైన</b> రాయాలి.',{[CR]:{[k+1]:cc}},hi,CR+':'+(k+1),j+1);
      push('<b>తర్వాత</b> '+(s%10)+' ని కింద రాయాలి.',{[P]:{[p]:s%10}},hi.concat([[P,p]]),P+':'+p,j+1);c=cc;}
     else{push(s+' ని కింద రాయాలి.',{[P]:{[p]:s}},hi.concat([[P,p]]),P+':'+p,j+1);c=0;}}

  fresh();
  quiz(C,()=>{const two=Math.random()<.6,a=two?rnd(12,99):rnd(102,999),b=two?rnd(12,99):rnd(2,9);return{q:'గుణించండి: <b>'+a+' × '+b+'</b> = ?',a:a*b};});

 body:['<b>కోణం:</b> రెండు భుజాలు ఒక బిందువు (శీర్షం) దగ్గర కలిస్తే కోణం. 90° కంటే తక్కువ – అల్పకోణం, 90° – లంబకోణం, 90°–180° – అధికకోణం, 180° – సరళకోణం.','<b>త్రిభుజాలు:</b> భుజాల ప్రకారం – సమబాహు, సమద్విబాహు, విషమబాహు. కోణాల ప్రకారం – అల్పకోణ, లంబకోణ, అధికకోణ త్రిభుజం. మూడు కోణాల మొత్తం ఎప్పుడూ 180°.','<b>వృత్తం:</b> కేంద్రం నుండి అంచుకు దూరం – వ్యాసార్థం. కేంద్రం గుండా వెళ్లే అంచు నుండి అంచుకు గీత – వ్యాసం. <b>సౌష్ఠవం:</b> మడిస్తే రెండు భాగాలు సరిగ్గా సరిపోతే ఆ గీత సౌష్ఠవ రేఖ.'],
 tip:'పైన విభాగం ఎంచుకోండి. ఎరుపు చుక్కలను వేలితో లాగండి – కోణాలు, భుజాలు తనంతట కొలుస్తుంది.',
 build(R,C){
  const TB=[['ang','📐 కోణాలు'],['tri','🔺 త్రిభుజాలు'],['shp','🟦 ఆకారాలు, రేఖలు'],['cir','⭕ వృత్తం'],['sym','🦋 సౌష్ఠవం']];
  let tab=store.get('geo_tab','ang');if(!TB.some(t=>t[0]===tab))tab='ang';
  const tr=h('div',{class:'row'},R);const tb={};TB.forEach(([k,l])=>{tb[k]=btn(tr,l,()=>{tab=k;store.set('geo_tab',k);TB.forEach(([x])=>tb[x].classList.toggle('on',x===k));render();},'chip'+(k===tab?' on':''));});
  const pane=h('div',{class:'gpane'},R);
  const svgPt=(sv,e,W,H)=>{const b=sv.getBoundingClientRect();return[(e.clientX-b.left)/b.width*W,(e.clientY-b.top)/b.height*H];};
  function dragOn(sv,down,move,up){let d=false;sv.style.touchAction='none';sv.addEventListener('pointerdown',e=>{d=down(e)!==false;if(d)try{sv.setPointerCapture(e.pointerId);}catch(_){}});sv.addEventListener('pointermove',e=>{if(d)move(e);});const end=e=>{if(d){d=false;up&&up(e);}};sv.addEventListener('pointerup',end);sv.addEventListener('pointercancel',end);}
  function cards(list,on){const g=h('div',{class:'ugrid'},pane);list.forEach(it=>{const c=h('button',{class:'ucard',onclick:()=>on(it)},g);h('span',{class:'uic',text:it[0]},c);h('b',{text:it[1]},c);if(it[2]!=null)h('span',{class:'ut',html:'<small>'+it[2]+'</small>'},c);});}
  function render(){pane.innerHTML='';({ang,tri,shp,cir,sym})[tab]();}
  /* ---- angles ---- */
  function ang(){let th=60,snap=5;const O=[180,170];
   const g=goal(pane,()=>{const t=pick([30,45,60,90,120,135,150,180,210,270]);return{text:'ఎరుపు భుజాన్ని తిప్పి <b>'+t+'°</b> కోణం చేయండి',test:v=>v===t};});
   const big=h('div',{class:'bigline'},pane);const sv=svgBox(pane,'0 0 360 330');sv.style.maxWidth='420px';
   s('circle',{cx:O[0],cy:O[1],r:150,fill:'none',stroke:'#d6e4f3','stroke-width':1.5,'stroke-dasharray':'4 5'},sv);
   s('path',{d:'M'+(O[0]-150)+' '+O[1]+' A150 150 0 0 1 '+(O[0]+150)+' '+O[1]+' Z',fill:'#eef6ff',stroke:'#7aa7d9','stroke-width':1.5},sv);
   for(let d=0;d<=180;d+=5){const a=d*Math.PI/180,r1=d%30===0?126:d%10===0?136:142;s('line',{x1:O[0]+r1*Math.cos(a),y1:O[1]-r1*Math.sin(a),x2:O[0]+150*Math.cos(a),y2:O[1]-150*Math.sin(a),stroke:'#7aa7d9','stroke-width':d%30===0?2:1},sv);if(d%30===0)s('text',{x:O[0]+112*Math.cos(a),y:O[1]-112*Math.sin(a)+5,'text-anchor':'middle','font-size':12,style:'fill:#4a78ad',text:d},sv);}
   const arc=s('path',{opacity:.35},sv);const sq=s('path',{fill:'none',stroke:'#3a7bd5','stroke-width':2.5},sv);
   s('line',{x1:O[0],y1:O[1],x2:O[0]+160,y2:O[1],stroke:'#2b2b2b','stroke-width':5,'stroke-linecap':'round'},sv);
   const arm=s('line',{x1:O[0],y1:O[1],stroke:'#e85d75','stroke-width':5,'stroke-linecap':'round'},sv);
   const knob=s('circle',{r:12,fill:'#e85d75',stroke:'#fff','stroke-width':3},sv);s('circle',{cx:O[0],cy:O[1],r:6,fill:'#2b2b2b'},sv);
   const lab=s('text',{'text-anchor':'middle','font-size':17,'font-weight':800},sv);s('text',{x:O[0]-10,y:O[1]+22,'font-size':13,text:'శీర్షం'},sv);
   const kind=d=>d===0?['సున్నా కోణం','#999']:d<90?['అల్పకోణం (90° కంటే తక్కువ)','#2e9e5b']:d===90?['లంబకోణం (సరిగ్గా 90°)','#3a7bd5']:d<180?['అధికకోణం (90° – 180° మధ్య)','#f08a24']:d===180?['సరళకోణం (180° – సరళ రేఖ)','#8e44ad']:['పరావర్తన కోణం (180° కంటే ఎక్కువ)','#e85d75'];
   function upd(q){const a=th*Math.PI/180,k=kind(th),r=44,x=O[0]+155*Math.cos(a),y=O[1]-155*Math.sin(a);arm.setAttribute('x2',x);arm.setAttribute('y2',y);knob.setAttribute('cx',x);knob.setAttribute('cy',y);
    arc.setAttribute('d',th?'M'+O[0]+' '+O[1]+' L'+(O[0]+r)+' '+O[1]+' A'+r+' '+r+' 0 '+(th>180?1:0)+' 0 '+(O[0]+r*Math.cos(a))+' '+(O[1]-r*Math.sin(a))+' Z':'');arc.setAttribute('fill',k[1]);
    sq.setAttribute('d',th===90?'M'+(O[0]+22)+' '+O[1]+' L'+(O[0]+22)+' '+(O[1]-22)+' L'+O[0]+' '+(O[1]-22):'');
    const b=a/2;lab.setAttribute('x',O[0]+70*Math.cos(b));lab.setAttribute('y',O[1]-70*Math.sin(b)+6);lab.textContent=th+'°';lab.setAttribute('style','fill:'+k[1]);
    big.innerHTML='<span class=num style="color:'+k[1]+'">'+th+'°</span><span class=word>'+k[0]+'</span>';if(!q){say(th+' డిగ్రీలు. '+k[0]);g.check(th);}}
   const mv=e=>{const[x,y]=svgPt(sv,e,360,330);let d=Math.atan2(-(y-O[1]),x-O[0])*180/Math.PI;if(d<0)d+=360;th=Math.round(d/snap)*snap%360;upd(true);};
   dragOn(sv,mv,mv,()=>upd());
   const r1=h('div',{class:'row'},pane);btn(r1,'− 1°',()=>{th=(th+359)%360;upd();},'ghost');btn(r1,'+ 1°',()=>{th=(th+1)%360;upd();},'ghost');btn(r1,'− 5°',()=>{th=(th+355)%360;upd();},'ghost');btn(r1,'+ 5°',()=>{th=(th+5)%360;upd();},'ghost');
   const sb=btn(r1,'లాగితే 5° చొప్పున',()=>{snap=snap===5?1:5;sb.innerHTML='లాగితే '+snap+'° చొప్పున';},'chip on');
   h('h4',{class:'mh',html:'🕒 గడియారం ముళ్ల మధ్య కోణం (1 గంట = 30°) – మన చుట్టూ కోణాలు'},pane);
   cards([['🕐','1 గంట','30° · అల్పకోణం',30],['🕑','2 గంటలు','60°',60],['🕒','3 గంటలు','90° · లంబకోణం',90],['🕓','4 గంటలు','120° · అధికకోణం',120],['🕕','6 గంటలు','180° · సరళకోణం',180],['📕','పుస్తకం మూల','90°',90],['✂️','తెరిచిన కత్తెర','అల్పకోణం',35],['🪑','కుర్చీ వీపు','అధికకోణం',105]],it=>{th=it[3];upd();});
   upd(true);}
  /* ---- triangles ---- */
  function tri(){const U=30,CO=12,RO=9,W=CO*U+40,H=RO*U+40;let P=[[2,7],[9,7],[2,2]];
   const g=goal(pane,()=>{const t=pick([['r','లంబకోణ త్రిభుజం'],['o','అధికకోణ త్రిభుజం'],['a','అల్పకోణ త్రిభుజం'],['i','సమద్విబాహు త్రిభుజం'],['s','విషమబాహు త్రిభుజం']]);return{text:'చుక్కలను లాగి <b>'+t[1]+'</b> చేయండి',test:c=>c&&c[t[0]]};});
   const info=h('div',{class:'eq tinfo'},pane);const sv=svgBox(pane,'0 0 '+W+' '+H);sv.style.maxWidth='520px';
   for(let x=0;x<=CO;x++)for(let y=0;y<=RO;y++)s('circle',{cx:20+x*U,cy:20+y*U,r:1.8,fill:'#c9bfa8'},sv);
   const tg=s('g',{},sv);const X=p=>20+p[0]*U,Y=p=>20+p[1]*U;const NM=['A','B','C'];
   const sq=(p,q)=>(p[0]-q[0])**2+(p[1]-q[1])**2;
   function calc(){const a2=Math.abs((P[1][0]-P[0][0])*(P[2][1]-P[0][1])-(P[2][0]-P[0][0])*(P[1][1]-P[0][1]));if(!a2)return null;
    const dot=i=>{const p=P[i],q=P[(i+1)%3],r=P[(i+2)%3];return(q[0]-p[0])*(r[0]-p[0])+(q[1]-p[1])*(r[1]-p[1]);};
    const raw=[0,1,2].map(i=>{const p=P[i],q=P[(i+1)%3],r=P[(i+2)%3];return Math.acos(Math.max(-1,Math.min(1,dot(i)/Math.sqrt(sq(p,q)*sq(p,r)))))*180/Math.PI;});
    const A=raw.map(Math.round);let df=180-A[0]-A[1]-A[2];if(df){let bi=-1,be=-1;raw.forEach((v,i)=>{if(dot(i)===0)return;const e=Math.abs(v-A[i]);if(e>be){be=e;bi=i;}});if(bi<0)bi=0;A[bi]+=df;}
    const S=[sq(P[1],P[2]),sq(P[0],P[2]),sq(P[0],P[1])];const r=[0,1,2].some(i=>dot(i)===0),o=[0,1,2].some(i=>dot(i)<0);const iso=S[0]===S[1]||S[1]===S[2]||S[0]===S[2],eq=S[0]===S[1]&&S[1]===S[2];
    return{A,S,r,o,a:!r&&!o,i:iso&&!eq,e:eq,s:!iso,dot};}
   const L=v=>{const x=Math.sqrt(v);return Number.isInteger(x)?String(x):x.toFixed(1);};
   function draw(q){tg.innerHTML='';const c=calc();const pts=P.map(p=>X(p)+','+Y(p)).join(' ');
    s('polygon',{points:pts,fill:c?(c.r?'#dbe9ff':c.o?'#ffe6cc':'#dff5e8'):'#f3d6d6',stroke:'#2b2b2b','stroke-width':3,'stroke-linejoin':'round'},tg);
    const cx=(X(P[0])+X(P[1])+X(P[2]))/3,cy=(Y(P[0])+Y(P[1])+Y(P[2]))/3;
    if(c){[[0,1,2],[1,2,0],[2,0,1]].forEach(([i,j,k])=>{const mx=(X(P[i])+X(P[j]))/2,my=(Y(P[i])+Y(P[j]))/2,dx=mx-cx,dy=my-cy,dl=Math.hypot(dx,dy)||1;s('text',{x:mx+dx/dl*16,y:my+dy/dl*16+5,'text-anchor':'middle','font-size':14,'font-weight':800,style:'fill:#8a5a00',text:L(c.S[k])},tg);});
     P.forEach((p,i)=>{const vx=cx-X(p),vy=cy-Y(p),vl=Math.hypot(vx,vy)||1;
      if(c.dot(i)===0){const q=P[(i+1)%3],r=P[(i+2)%3];const u1=[(q[0]-p[0]),(q[1]-p[1])],u2=[(r[0]-p[0]),(r[1]-p[1])];const n1=Math.hypot(...u1),n2=Math.hypot(...u2),d=12;const a1=[X(p)+u1[0]/n1*d,Y(p)+u1[1]/n1*d],a2=[X(p)+u2[0]/n2*d,Y(p)+u2[1]/n2*d];s('path',{d:'M'+a1[0]+' '+a1[1]+' L'+(a1[0]+u2[0]/n2*d)+' '+(a1[1]+u2[1]/n2*d)+' L'+a2[0]+' '+a2[1],fill:'none',stroke:'#3a7bd5','stroke-width':2},tg);}
      s('text',{x:X(p)+vx/vl*34,y:Y(p)+vy/vl*34+5,'text-anchor':'middle','font-size':14,'font-weight':800,style:'fill:#e85d75',text:c.A[i]+'°'},tg);});}
    P.forEach((p,i)=>{s('circle',{cx:X(p),cy:Y(p),r:11,fill:'#e85d75',stroke:'#fff','stroke-width':3},tg);const vx=X(p)-cx,vy=Y(p)-cy,vl=Math.hypot(vx,vy)||1;s('text',{x:X(p)+vx/vl*22,y:Y(p)+vy/vl*22+5,'text-anchor':'middle','font-size':15,'font-weight':800,text:NM[i]},tg);});
    if(!c){info.innerHTML='<span class=warn>మూడు చుక్కలు ఒకే రేఖ మీద ఉన్నాయి – ఇది త్రిభుజం కాదు!</span>';return;}
    const bs=c.e?'సమబాహు':c.i?'సమద్విబాహు (2 భుజాలు సమానం)':'విషమబాహు (3 భుజాలు వేర్వేరు)',ba=c.r?'లంబకోణ త్రిభుజం (ఒక కోణం 90°)':c.o?'అధికకోణ త్రిభుజం (ఒక కోణం 90° కంటే ఎక్కువ)':'అల్పకోణ త్రిభుజం (అన్నీ 90° కంటే తక్కువ)';
    info.innerHTML='∠A + ∠B + ∠C = '+c.A[0]+'° + '+c.A[1]+'° + '+c.A[2]+'° = <b>180°</b><br>భుజాల ప్రకారం: <b style="font-size:1em">'+bs+'</b><br>కోణాల ప్రకారం: <b style="font-size:1em">'+ba+'</b>';
    if(!q){say(bs+'. '+ba);g.check(c);}}
   let sel=-1;dragOn(sv,e=>{const[x,y]=svgPt(sv,e,W,H);let bd=1e9;P.forEach((p,i)=>{const d=Math.hypot(X(p)-x,Y(p)-y);if(d<bd){bd=d;sel=i;}});if(bd>45){sel=-1;return false;}},e=>{if(sel<0)return;const[x,y]=svgPt(sv,e,W,H);const nx=Math.max(0,Math.min(CO,Math.round((x-20)/U))),ny=Math.max(0,Math.min(RO,Math.round((y-20)/U)));if(P.some((p,i)=>i!==sel&&p[0]===nx&&p[1]===ny))return;if(P[sel][0]!==nx||P[sel][1]!==ny){P[sel]=[nx,ny];draw(true);}},()=>{sel=-1;draw();});
   const r1=h('div',{class:'row'},pane);[['లంబకోణ',[[2,7],[9,7],[2,2]]],['సమద్విబాహు',[[2,8],[10,8],[6,2]]],['అధికకోణ',[[1,7],[11,7],[4,4]]],['అల్పకోణ',[[2,8],[10,7],[5,1]]]].forEach(([l,pp])=>btn(r1,l,()=>{P=pp.map(p=>p.slice());draw();},'ghost'));
   draw(true);}
  /* ---- shapes & lines ---- */
  function shp(){const poly=n=>Array.from({length:n},(_,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[130+100*Math.cos(a),135+100*Math.sin(a)];});
   const SH=[{n:'త్రిభుజం',p:poly(3),pr:['3 భుజాలు, 3 శీర్షాలు, 3 కోణాలు','కోణాల మొత్తం 180°'],ex:'సమోసా, ట్రాఫిక్ హెచ్చరిక బోర్డు'},
    {n:'చతురస్రం',p:[[60,65],[200,65],[200,205],[60,205]],pr:['4 భుజాలు అన్నీ సమానం','4 కోణాలూ లంబకోణాలు (90°)','కర్ణాలు సమానం'],ex:'క్యారమ్ బోర్డు, చెస్ బోర్డు గడి'},
    {n:'దీర్ఘచతురస్రం',p:[[25,85],[235,85],[235,185],[25,185]],pr:['ఎదురెదురు భుజాలు సమానం, సమాంతరం','4 కోణాలూ లంబకోణాలు','కర్ణాలు సమానం'],ex:'తలుపు, పుస్తకం, నల్లబల్ల'},
    {n:'సమచతుర్భుజం',p:[[130,30],[215,135],[130,240],[45,135]],pr:['4 భుజాలు సమానం','ఎదురెదురు కోణాలు సమానం','కర్ణాలు లంబంగా ఖండించుకుంటాయి'],ex:'గాలిపటం ఆకారం 🪁'},
    {n:'సమాంతర చతుర్భుజం',p:[[75,75],[245,75],[185,195],[15,195]],pr:['ఎదురెదురు భుజాలు సమానం, సమాంతరం','ఎదురెదురు కోణాలు సమానం'],ex:'ఒరిగిన పెట్టె వైపు'},
    {n:'సమలంబ చతుర్భుజం',p:[[85,75],[175,75],[245,195],[15,195]],pr:['ఒక జత ఎదురెదురు భుజాలు సమాంతరం'],ex:'బకెట్ పక్క ఆకారం'},
    {n:'పంచభుజి',p:poly(5),pr:['5 భుజాలు, 5 శీర్షాలు','కోణాల మొత్తం 540°'],ex:'ఇంటి ముందు భాగం (పైకప్పుతో)'},

 [[30,120,'#f6c453',48],[86,120,'#f6c453',48]].forEach(([x,y,f,w])=>{s('path',{d:'M'+x+' '+y+' l8 -8 h'+w+' v'+w+' l-8 8z',fill:'#0002'},sv);s('rect',{x,y,width:w,height:w,fill:f,class:'ink'},sv);for(let i=1;i<10;i++){s('line',{x1:x,y1:y+w*i/10,x2:x+w,y2:y+w*i/10,stroke:'#0003'},sv);s('line',{x1:x+w*i/10,y1:y,x2:x+w*i/10,y2:y+w,stroke:'#0003'},sv);}});
 for(let i=0;i<4;i++){s('rect',{x:150+i*14,y:48,width:11,height:120,fill:'#6fb6f2',class:'ink'},sv);}
 for(let i=0;i<5;i++)s('rect',{x:216+(i%3)*20,y:132+Math.floor(i/3)*20,width:15,height:15,fill:'#ef7d8f',class:'ink'},sv);
 s('circle',{cx:310,cy:70,r:36,fill:'#fff3dc',class:'ink'},sv);s('path',{d:'M310 70 L310 34 A36 36 0 0 1 346 70 Z',fill:'#f08a24',class:'ink'},sv);
 s('text',{x:180,y:28,'text-anchor':'middle','font-size':22,'font-weight':800,text:'1 + 2 × 3 ÷ ½'},sv);}
function renderPages(){
 CL.forEach(f=>{try{f();}catch(e){}});CL=[];try{speechSynthesis.cancel();}catch(e){}
 L.innerHTML='';Rp.innerHTML='';
 const sp=btn(L,'🔊',()=>speak(pageText()),'ghost spk');sp.title='ఈ పేజీ వినండి';
 if(page===0){
  h('div',{class:'chno',text:'రాయ్ ఎడ్యుకేషన్ · Raay Education'},L);h('div',{class:'cover-t',text:'గణిత పుస్తకం'},L);h('div',{class:'cover-s',text:'ఆడుతూ, తాకుతూ, తిప్పుతూ నేర్చుకునే గణితం – 1 నుండి 5 తరగతులు'},L);
  coverArt(L);
  h('ul',{class:'howto',html:'<li>◀ ▶ బటన్లతో లేదా ← → కీలతో పేజీలు తిప్పండి.</li><li>కుడి పేజీలోని బొమ్మలను <b>తాకండి, లాగండి</b> – అవి కదులుతాయి.</li><li>🎯 సవాళ్లు గెలిస్తే ⭐ నక్షత్రాలు వస్తాయి.</li><li>🔊 పేజీ వినండి · 🔈 ఆటో వాయిస్ ఆన్ చేస్తే ప్రతి అడుగు చదువుతుంది.</li><li>TV రిమోట్: ← → పేజీలు, OK = వినండి, Back = విషయ సూచిక, 1–9 = అధ్యాయం.</li>'},L);
  h('div',{class:'mt',text:'విషయ సూచిక'},Rp);const t=h('div',{class:'ctitle',text:'విషయ సూచిక'},Rp);t.classList.add('toc-h');
  tocList(h('ul',{class:'toc'},Rp),go);
 }else{
  const c=CH[page-1];
  h('div',{class:'chno',text:'అధ్యాయం '+page},L);const tt=h('div',{class:'ctitle',text:c.t},L);h('span',{class:'cls',text:c.c},tt);
  h('div',{class:'key',html:c.key},L);const b=h('div',{class:'body'},L);c.body.forEach(p=>h('p',{html:p},b));
  h('div',{class:'tip',html:'<span>👆</span><span>'+c.tip+'</span>'},L);
  const C=h('div',{class:'chal'},L);
  h('div',{class:'mt',text:page+'. '+c.t},Rp);
  try{c.build(Rp,C);}catch(e){console.error(e);h('div',{class:'warn',text:'ఈ పేజీ లోడ్ కాలేదు: '+e.message},Rp);}
 }
 $('ttl').textContent=page?page+'. '+CH[page-1].t:'విషయ సూచిక';$('prog').style.width=(page/N*100)+'%';
 $('pBtn').disabled=page===0;$('nBtn').disabled=page===N;
 document.querySelectorAll('#mList li').forEach((li,i)=>li.classList.toggle('sel',i===page));
}
function pageText(){if(!page)return 'గణిత పుస్తకం. ఆడుతూ నేర్చుకునే గణితం. విషయ సూచిక: '+CH.map((c,i)=>(i+1)+'. '+c.t).join('. ');const c=CH[page-1];return c.t+'. '+c.body.join(' ')+' '+c.tip;}
function go(n){if(n<0||n>N||n===page)return;closeMenu();const dir=n>page?1:-1;const wide=matchMedia('(min-width:900px)').matches;
 if(wide){const src=dir>0?Rp:L;const leaf=src.cloneNode(true);leaf.removeAttribute('id');leaf.classList.add('leaf',dir>0?'leaf-next':'leaf-prev');book.appendChild(leaf);leaf.addEventListener('animationend',()=>leaf.remove());setTimeout(()=>leaf.remove(),1200);}
 else{book.classList.remove('slide-l','slide-r');void book.offsetWidth;book.classList.add(dir>0?'slide-l':'slide-r');window.scrollTo({top:0,behavior:'smooth'});}
 page=n;store.set('page',page);renderPages();if(voiceOn)setTimeout(()=>speak(pageText()),400);}

/* ---------- menu ---------- */
const menu=$('menu'),scrim=$('scrim');let mSel=0;
function openMenu(){tocList($('mList'),go);mSel=page;hl();menu.classList.add('open');scrim.classList.add('open');}
function closeMenu(){menu.classList.remove('open');scrim.classList.remove('open');}
function hl(){document.querySelectorAll('#mList li').forEach((li,i)=>{li.classList.toggle('sel',i===mSel);if(i===mSel)li.scrollIntoView({block:'nearest'});});}
$('mBtn').onclick=()=>menu.classList.contains('open')?closeMenu():openMenu();$('mClose').onclick=closeMenu;scrim.onclick=closeMenu;
$('pBtn').onclick=()=>go(page-1);$('nBtn').onclick=()=>go(page+1);
$('sBtn').onclick=()=>speak(pageText());
$('fBtn').onclick=()=>{try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen();}catch(e){}};
function vUpd(){$('vBtn').textContent=voiceOn?'🔊 ఆటో':'🔈';$('vBtn').classList.toggle('on',voiceOn);}
$('vBtn').onclick=()=>{voiceOn=!voiceOn;store.set('voice',voiceOn);vUpd();if(voiceOn)speak('ఆటో వాయిస్ ఆన్');else try{speechSynthesis.cancel();}catch(e){}};
document.addEventListener('keydown',e=>{
 const tg=e.target,typing=tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA');const open=menu.classList.contains('open');
 if(e.key==='Escape'||(e.key==='Backspace'&&!typing)||e.key==='BrowserBack'||e.key==='GoBack'){e.preventDefault();open?closeMenu():openMenu();return;}
 if(typing)return;
 if(open){if(e.key==='ArrowDown'){e.preventDefault();mSel=Math.min(N,mSel+1);hl();}else if(e.key==='ArrowUp'){e.preventDefault();mSel=Math.max(0,mSel-1);hl();}else if(e.key==='Enter'){e.preventDefault();go(mSel);closeMenu();}return;}
 if(e.key==='ArrowRight'||e.key==='PageDown'||e.key==='MediaTrackNext'){e.preventDefault();go(page+1);}
 else if(e.key==='ArrowLeft'||e.key==='PageUp'||e.key==='MediaTrackPrevious'){e.preventDefault();go(page-1);}
 else if(e.key==='Enter'&&!(tg&&tg.tagName==='BUTTON')){e.preventDefault();speak(pageText());}
 else if(/^[0-9]$/.test(e.key)){go(+e.key);}
});
showStars();vUpd();tocList($('mList'),go);renderPages();
})();
</script>
</body>
