.lg1,.ar2{transform-box:fill-box;transform-origin:50% 0;animation:sw .5s ease-in-out infinite alternate}
.lg2,.ar1{transform-box:fill-box;transform-origin:50% 0;animation:sw .5s ease-in-out infinite alternate-reverse}
@keyframes sw{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
.cl{animation:cl 30s linear infinite}@keyframes cl{from{transform:translateX(-60px)}to{transform:translateX(420px)}}
.fl{transform-box:fill-box;transform-origin:0 50%;animation:fl 1s ease-in-out infinite alternate}@keyframes fl{to{transform:skewY(-8deg) scaleX(.9)}}
.sun{transform-box:fill-box;transform-origin:center;animation:sp 12s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.kids{animation:none;transform:translateX(120px)}.bob,.bob2,.lg1,.lg2,.ar1,.ar2,.cl,.fl,.sun{animation:none}}

 <button class="b3" id="bShare">📤 షేర్</button>

<script>
(function(){
var T={te:{hint:'👆 బొమ్మను తాకితే English',app:'📲 యాప్ తెరువు',vid:'🎬 30 సె. వీడియో',sh:'📤 షేర్',alt:'రాయ్ విద్యార్థి బ్యానర్'},
       en:{hint:'👆 Tap the picture for తెలుగు',app:'📲 Open App',vid:'🎬 30 s Video',sh:'📤 Share',alt:'Raay Vidyarthi banner'}};
var q=new URLSearchParams(location.search),L=q.get('lang')==='en'?'en':'te';
var pic=document.getElementById('pic'),wrap=document.getElementById('wrap');
function kind(){return innerWidth>innerHeight*1.1?'wide':'phone';}
function src(l){return 'help/banner/'+kind()+'_'+l+'.jpg?v=2';}
['te','en'].forEach(function(l){var i=new Image();i.src=src(l);});
function show(anim){
  var t=T[L];document.documentElement.lang=L;
  document.getElementById('hint').textContent=t.hint;document.getElementById('bApp').textContent=t.app;
  document.getElementById('bVid').textContent=t.vid;document.getElementById('bShare').textContent=t.sh;
  if(!anim){pic.src=src(L);pic.alt=t.alt;return;}
  pic.classList.add('fade');setTimeout(function(){pic.src=src(L);pic.alt=t.alt;pic.classList.remove('fade');},200);
}
function flip(){L=L==='te'?'en':'te';show(true);try{history.replaceState(null,'',L==='en'?'?lang=en':location.pathname);}catch(e){}}
wrap.addEventListener('click',flip);
wrap.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();flip();}});
var lk=kind();addEventListener('resize',function(){if(kind()!==lk){lk=kind();show(false);}});
document.getElementById('bShare').addEventListener('click',function(){
  var u=location.href.split('?')[0],txt='రాయ్ విద్యార్థి లెర్నింగ్ యాప్ – 1 నుండి 10 తరగతులు, ఉచితం 🎉';
  if(navigator.share){navigator.share({title:'Raay Vidyarthi',text:txt,url:u}).catch(function(){});}
  else location.href='https://wa.me/?text='+encodeURIComponent(txt+' '+u);
});
show(false);
})();
</script>
