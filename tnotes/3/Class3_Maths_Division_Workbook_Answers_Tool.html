*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans Telugu',sans-serif;background:#fff8e7;color:#222}

const m=document.getElementById('m'),nav=document.getElementById('nav');
function sp(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='te-IN';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
let h='';D.W.forEach(w=>{h+=`<div class="wsh" id="${w[0]}">${w[1]} – ${w[2]}</div>`;D.Q.forEach((q,i)=>{if(q.ws!=w[0])return;
h+=`<div class="card" id="q${i}"><h2>ప్రశ్న ${q.no}: ${q.title}</h2>${q.imgs.map(s=>`<img src="${s}" alt="ప్రశ్న ${q.no}">`).join('')}
<div class="bar"><button class="p" onclick="tg(${i})">✅ జవాబు చూపు / దాచు</button><button onclick="sp(D.Q[${i}].speak)">🔊 చదువు</button></div>
<div class="ans"><div><b>సాధన (దశలవారీగా):</b></div><ol>${q.steps.map(s=>`<li>${s}</li>`).join('')}</ol><div class="final">జవాబు: ${q.ans}</div></div></div>`})});
m.innerHTML=h;
let n='<button onclick="nav.classList.remove(\'open\')">✖ మూసివేయి</button>';D.W.forEach(w=>{n+=`<h3>${w[1]}</h3>`;D.Q.forEach((q,i)=>{if(q.ws==w[0])n+=`<a onclick="go(${i})">ప్రశ్న ${q.no}</a>`})});nav.innerHTML=n;
function go(i){cur=i;document.getElementById('q'+i).scrollIntoView({behavior:'smooth',block:'start'});nav.classList.remove('open')}
function tg(i){const c=document.getElementById('q'+i);c.classList.toggle('show');if(voice&&c.classList.contains('show'))sp(D.Q[i].speak);try{localStorage.setItem('c3div_'+i,c.classList.contains('show')?1:0)}catch(e){}}
document.getElementById('mb').onclick=()=>nav.classList.toggle('open');
document.getElementById('vb').onclick=function(){voice=!voice;this.textContent='🔊 వాయిస్: '+(voice?'ఆన్':'ఆఫ్');this.classList.toggle('on',voice)};
document.getElementById('all').onclick=()=>{shown=!shown;document.querySelectorAll('.card').forEach(c=>c.classList.toggle('show',shown))};
document.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowRight'){cur=Math.min(cur+1,D.Q.length-1);go(cur)}else if(e.key==='ArrowUp'||e.key==='ArrowLeft'){cur=Math.max(cur-1,0);go(cur)}else if(e.key==='Enter'){tg(cur)}else if(e.key==='Escape'||e.key==='Backspace'){nav.classList.toggle('open')}else if(e.key>='1'&&e.key<='5'){document.getElementById('WS'+e.key).scrollIntoView({behavior:'smooth'})}});
try{D.Q.forEach((q,i)=>{if(localStorage.getItem('c3div_'+i)==='1')document.getElementById('q'+i).classList.add('show')})}catch(e){}
</script></body></html>
