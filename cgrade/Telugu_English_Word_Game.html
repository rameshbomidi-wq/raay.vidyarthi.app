    function setMode(m) { mode = m; start(); }

    function splitTe(w) {
        if (mode === 'en') return w.split('');
        return w.match(/[\u0c00-\u0c7f][\u0c00-\u0c03\u0c3e-\u0c56\u0c62-\u0c63]*/g) || [];
    }

        const list = bank[mode];
        word = list[Math.floor(Math.random() * list.length)];
        document.getElementById('counter').innerText = `Total Words: ${list.length}`;
        const chars = splitTe(word);
        const shuf = [...chars].sort(() => Math.random() - 0.5);
        ans = new Array(chars.length).fill("");
        
        const sD = document.getElementById('slots');
        const lD = document.getElementById('letters');
        sD.innerHTML = ''; lD.innerHTML = '';

        chars.forEach((_, i) => {
            let d = document.createElement('div');
            d.className = 'box'; d.id = 's'+i;
            sD.appendChild(d);
        });

        shuf.forEach(c => {
            let b = document.createElement('div');
            b.className = 'box tile';
            b.innerText = c;
            b.onclick = () => {
                let idx = ans.indexOf("");
                if (idx !== -1) {
                    ans[idx] = c;
                    document.getElementById('s'+idx).innerText = c;
                    b.style.visibility = 'hidden';
                    if (!ans.includes("")) check();
                }
            };
            lD.appendChild(b);
        });
    }

    function check() {
        if (ans.join('') === word) {
            document.querySelectorAll('.box').forEach(b => b.classList.add('win'));
            let u = new SpeechSynthesisUtterance(word);
            u.lang = mode === 'te' ? 'te-IN' : 'en-US';
            speechSynthesis.speak(u);
        } else {
            setTimeout(() => { alert("Try Again!"); start(); }, 300);
        }
    }
    start();
