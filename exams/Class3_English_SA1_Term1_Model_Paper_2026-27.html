var PASS="Once, a thirsty crow was flying around looking for water. After a long time, he saw a pitcher on the ground. He flew down to drink, but the water was at the bottom, and his beak could not reach it. The crow thought of a clever plan. He picked up some small pebbles one by one and dropped them into the pitcher. Slowly, the water rose to the top. The crow drank the water and flew away happily.";

[25,"Read the passage.<div class=pass>Tenali Rama and his wife were talking loudly so that the thieves hiding in the bushes could hear them. Rama said, “We must keep all our valuables safe. Let us put our gold and silver coins in this heavy trunk and drop it into the well.” The thieves heard this and were very happy. (<em>Tenali Rama and the Thieves</em>)</div>a. Why were Tenali Rama and his wife talking loudly?<br>b. Where did Rama say they would put the gold and silver coins?<br>c. Where were the thieves hiding? A) behind the large tree B) inside the heavy trunk C) in the bushes D) near the water well<br>d. How did the thieves feel? A) very scared B) very happy C) angry D) confused","a) So that the thieves hiding in the bushes could hear them.<br>b) In a heavy trunk, which they would drop into the well.<br>c) C – in the bushes<br>d) B – They were very happy."],

[30,"<b>A) At the Stationery Shop.</b> Complete the conversation. Help box: <em>money, morning, thank, want, much, five, pencil, red</em><div class=sub>Child: Good (i)___, uncle.<br>Shopkeeper: Good morning! What do you (ii)___?<br>Child: I want a (iii)___, please.<br>Shopkeeper: We have many types. Which one do you like?<br>Child: I want the (iv)___ one. How (v)___ does it cost?<br>Shopkeeper: It costs (vi)___ rupees.<br>Child: Here is the (vii)___.<br>Shopkeeper: (viii)___ you. Here is your pencil.</div><div class=or>(Or)</div><b>B)</b> Describe your favourite food using the clues: name of the food – who makes it – what it tastes like – why you like it so much.","A) (i) morning (ii) want (iii) pencil (iv) red (v) much (vi) five (vii) money (viii) thank<br><br>B) Sample: My favourite food is dosa. My mother makes it every Sunday. It tastes crispy and yummy. I like it so much because it is hot and I eat it with my family."],

[33,"<b>A)</b> Write a letter to your friend about a magic show. Hints: <em>tricks, happy, a magician, magic wand, town</em><div class=sub>Date: ____ · Dear ____,<br>How are you? Yesterday, I went to see a magic show in our ____. The ____ was wearing a tall hat. He showed us many wonderful ____ with his ____. I felt very ____ to see the show.<br>Yours lovingly, ____.</div><div class=or>(Or)</div><b>B)</b> Diary entry about the puppy. Hints: <em>happy, street, milk, safe, sleeping, home, puppy</em><div class=sub>Today, I found a small ____ crying on the ____. It was very hungry. I brought it ____ and gave it some warm ____. Now, it is ____ peacefully. I feel very ____ that the puppy is ____ and with me.</div>","A) town · magician · tricks · magic wand · happy<br>B) puppy · street · home · milk · sleeping · happy · safe"]];
