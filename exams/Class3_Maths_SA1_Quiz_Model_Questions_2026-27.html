<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3వ తరగతి గణితం – క్విజ్ & మోడల్ ప్రశ్నలు</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Noto+Sans+Telugu:wght@400;600;800&family=Mallanna&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fffdf6; --ink:#1f2a44; --muted:#6b7280; --line:#dbe7f5; --margin:#f2a7a7;
  --brand:#2f6fdb; --brand2:#ff8a3d; --ok:#16a34a; --okbg:#e8f8ee; --bad:#dc2626; --badbg:#fdecec;
  --card:#ffffff; --chip:#eef4ff; --shadow:0 6px 20px rgba(31,42,68,.10);
}
@media (prefers-color-scheme: dark){
  :root{--paper:#16191f; --ink:#e8ecf4; --muted:#9aa3b2; --line:#232a36; --margin:#5a2a2a;
  --card:#1e232c; --chip:#243049; --okbg:#12301f; --badbg:#3a1717; --shadow:0 6px 20px rgba(0,0,0,.4)}
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:"Noto Sans Telugu","Mallanna",system-ui,sans-serif; color:var(--ink);
  background:var(--paper);
  background-image:linear-gradient(90deg,transparent 34px,var(--margin) 34px,var(--margin) 36px,transparent 36px),
                   repeating-linear-gradient(var(--paper) 0 31px,var(--line) 31px 32px);
  min-height:100vh; line-height:1.55;
}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 90px 46px}
h1{font-size:1.35rem;margin:6px 0 2px}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 14px}
.num,.kalam{font-family:"Kalam","Noto Sans Telugu",cursive}
.cards{display:grid;gap:12px}
.mode{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);cursor:pointer;border:2px solid transparent;display:flex;gap:14px;align-items:center;text-align:left;width:100%;color:inherit;font:inherit}
.mode:hover{border-color:var(--brand)}
.mode .ic{font-size:2rem;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--chip);flex:none}
.mode b{display:block;font-size:1.05rem}
.mode span{color:var(--muted);font-size:.88rem}
.best{margin-left:auto;font-family:Kalam;color:var(--brand2);font-weight:700;white-space:nowrap}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 12px}
.seg{display:inline-flex;background:var(--card);border-radius:999px;box-shadow:var(--shadow);overflow:hidden}
.seg button{border:0;background:none;padding:6px 12px;font:inherit;font-size:.85rem;color:var(--ink);cursor:pointer}
.seg button.on{background:var(--brand);color:#fff}
.btn{border:0;border-radius:12px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer;background:var(--brand);color:#fff;box-shadow:var(--shadow)}
.btn.alt{background:var(--card);color:var(--ink)}
.btn.orange{background:var(--brand2)}
.btn:disabled{opacity:.45;cursor:default}
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.prog{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));width:0;transition:width .3s}
.count{font-family:Kalam;font-weight:700;white-space:nowrap}
.qcard{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px 16px 18px}
.chip{display:inline-block;background:var(--chip);color:var(--brand);border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600;margin-bottom:8px}
.qno{font-family:Kalam;font-weight:700;color:var(--brand2);margin-right:4px}
.en{font-size:1.05rem;font-weight:600}
.te{font-size:1rem;color:var(--ink);opacity:.85;margin-top:2px}
body.only-te .en{display:none} body.only-te .te{opacity:1;font-weight:600;font-size:1.05rem}
body.only-en .te{display:none}
.fig{margin:12px 0;display:flex;justify-content:center;overflow-x:auto}
.opts{display:grid;gap:9px;margin-top:14px}
@media(min-width:560px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;font:inherit;color:inherit;cursor:pointer;font-size:1.02rem}
.opt .l{font-family:Kalam;font-weight:700;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--brand);flex:none}
.opt.sel{border-color:var(--brand);background:var(--chip)}
.opt.ok{border-color:var(--ok);background:var(--okbg)} .opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)} .opt.bad .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
input.blank,select.blank{font-family:Kalam,"Noto Sans Telugu";font-size:1.15rem;font-weight:700;width:5.2em;text-align:center;border:2px dashed var(--brand);border-radius:8px;padding:3px 4px;background:var(--paper);color:var(--ink)}
input.blank.d1{width:2.1em}
select.blank{width:auto;max-width:100%;font-size:.95rem;font-family:"Noto Sans Telugu";text-align:left}
.blank.ok{border:2px solid var(--ok);background:var(--okbg)} .blank.bad{border:2px solid var(--bad);background:var(--badbg)}
.fill{margin-top:14px;font-size:1.1rem}
.fill .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0}
.mrow{display:flex;align-items:center;gap:10px;margin:9px 0;flex-wrap:wrap}
.mrow .left{font-family:Kalam;font-weight:700;font-size:1.1rem;min-width:90px}
.vert{font-family:Kalam;font-size:1.5rem;font-weight:700;display:inline-grid;text-align:right;line-height:1.5;margin:0 18px}
.vert .ln{border-top:2px solid var(--ink);margin-top:2px;padding-top:4px}
.fb{margin-top:14px;border-radius:12px;padding:10px 12px;display:none}
.fb.ok{display:block;background:var(--okbg);border-left:5px solid var(--ok)}
.fb.bad{display:block;background:var(--badbg);border-left:5px solid var(--bad)}
.fb b{display:block;margin-bottom:2px}
.actions{display:flex;gap:10px;justify-content:space-between;margin-top:14px}
.hidden{display:none!important}
.result{text-align:center;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:22px 16px}
.big{font-family:Kalam;font-size:3rem;font-weight:700;color:var(--brand)}
.stars{font-size:2rem;letter-spacing:4px}
.review{text-align:left;margin-top:16px}
.ritem{border-top:1px dashed var(--line);padding:8px 2px;font-size:.92rem}
.ritem .a{color:var(--ok);font-weight:600}
.nl-wrap{overflow-x:auto;width:100%;padding-bottom:6px}
.nl-tick{cursor:pointer}
.perm{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.perm input{width:100%}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pp .35s}
@keyframes pp{50%{transform:scale(1.06)}}
.foot{color:var(--muted);font-size:.8rem;text-align:center;margin-top:20px}
.secHead{font-weight:800;margin:18px 0 6px;font-size:.95rem;color:var(--brand)}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.jump button{width:34px;height:34px;border-radius:9px;border:2px solid var(--line);background:var(--card);font-family:Kalam;font-weight:700;color:var(--ink);cursor:pointer}
.jump button.cur{border-color:var(--brand)}
.jump button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.jump button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
</style>
</head>
<body>
<div class="wrap">

<!-- HOME -->
<section id="home">
  <h1>📘 3వ తరగతి గణితం – క్విజ్</h1>
  <p class="sub">SA-1 మోడల్ పేపర్ 2026-27 · Class 3 Maths · ప్రతి ప్రశ్నకు జవాబు వెంటనే సరిచూడవచ్చు</p>
  <div class="bar">
    <span style="font-size:.85rem">భాష:</span>
    <div class="seg" id="langSeg">
      <button data-l="both" class="on">రెండూ</button>
      <button data-l="te">తెలుగు</button>
      <button data-l="en">English</button>
    </div>
  </div>
  <div class="cards">
    <button class="mode" data-mode="paper"><div class="ic">📝</div><div><b>మోడల్ పేపర్ (అసలు ప్రశ్నలు)</b><span>సెక్షన్ A, B, C, D – మొత్తం 33 ప్రశ్నలు (ఎంపిక ప్రశ్నలు రెండూ)</span></div><div class="best" id="best-paper"></div></button>
    <button class="mode" data-mode="extra"><div class="ic">⭐</div><div><b>అదనపు మోడల్ ప్రశ్నలు</b><span>అదే పాఠాల నుండి 47 కొత్త ప్రశ్నలు</span></div><div class="best" id="best-extra"></div></button>
    <button class="mode" data-mode="practice"><div class="ic">♾️</div><div><b>అపరిమిత అభ్యాసం</b><span>ప్రతిసారి 10 కొత్త లెక్కలు – కూడిక, తీసివేత, గుణకారం, స్థాన విలువ</span></div><div class="best" id="best-practice"></div></button>
  </div>
  <div class="bar" style="margin-top:16px">
    <label style="font-size:.9rem"><input type="checkbox" id="shuffle"> ప్రశ్నలను కలగలపు (shuffle)</label>
  </div>
  <p class="foot">సూచన: జవాబు ఎంచుకుని <b>సరిచూడు</b> నొక్కండి. తప్పయితే సరైన జవాబు, వివరణ కనిపిస్తాయి.</p>
</section>

<!-- QUIZ -->
<section id="quiz" class="hidden">
  <div class="top">
    <button class="btn alt" id="homeBtn" style="padding:7px 11px">🏠</button>
    <div class="prog"><i id="progI"></i></div>
    <div class="count" id="count"></div>
  </div>
  <div class="qcard" id="qcard">
    <div class="chip" id="qsec"></div>
    <div id="qtext"></div>
    <div id="qbody"></div>
    <div class="fb" id="fb"></div>
    <div class="actions">
      <button class="btn alt" id="prevBtn">◀ వెనక్కి</button>
      <button class="btn" id="checkBtn">సరిచూడు ✓</button>
      <button class="btn orange hidden" id="nextBtn">తర్వాత ▶</button>
    </div>
  </div>
  <div class="jump" id="jump"></div>
</section>

<!-- RESULT -->
<section id="result" class="hidden">
  <div class="result">
    <div class="stars" id="stars"></div>
    <div class="big" id="score"></div>
    <div id="msg" style="font-weight:600"></div>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap">
      <button class="btn" id="againBtn">⟲ మళ్ళీ చేయి</button>
      <button class="btn alt" id="home2Btn">🏠 మొదటి పేజీ</button>
    </div>
    <div class="review" id="review"></div>
  </div>
</section>

</div>
<script>
/* ---------------- helpers ---------------- */
const $=s=>document.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- figures ---------- */
const abacusSVG=`<svg viewBox="0 0 230 150" width="230" height="150">
 <g stroke="currentColor" stroke-width="3">${[40,90,140,190].map(x=>`<line x1="${x}" y1="10" x2="${x}" y2="112"/>`).join('')}</g>
 <g fill="#ff8a3d">${[40,140,190].map(x=>`<circle cx="${x}" cy="104" r="9"/>`).join('')}</g>
 <rect x="15" y="112" width="200" height="34" rx="4" fill="none" stroke="currentColor" stroke-width="2"/>
 <g font-family="Kalam" font-size="15" text-anchor="middle" fill="currentColor"><text x="40" y="128">Th</text><text x="90" y="128">H</text><text x="140" y="128">T</text><text x="190" y="128">O</text></g>
 <g font-size="11" text-anchor="middle" fill="currentColor"><text x="40" y="142">వే</text><text x="90" y="142">వం</text><text x="140" y="142">ప</text><text x="190" y="142">ఒ</text></g></svg>`;
const oilSVG=`<svg viewBox="0 0 140 170" width="120" height="146"><rect x="45" y="4" width="26" height="18" rx="3" fill="#333"/>
 <path d="M20 30h80q12 0 12 12v115q0 9-9 9H17q-9 0-9-9V42q0-12 12-12z" fill="#2b2b2b"/>
 <path d="M86 40h16v60H86z" fill="none" stroke="#666" stroke-width="6" rx="6"/>
 <rect x="18" y="62" width="62" height="64" rx="12" fill="#fff"/>
 <text x="49" y="86" font-family="Kalam" font-size="16" text-anchor="middle" fill="#111">Oil</text>
 <text x="49" y="110" font-family="Kalam" font-size="17" font-weight="700" text-anchor="middle" fill="#111">Rs.537</text></svg>`;
const bakery=`<div style="display:flex;gap:14px;border:2px solid currentColor;border-radius:14px;padding:10px 16px;font-family:Kalam;font-size:1.2rem;font-weight:700;text-align:center">
 <div><div style="font-size:2.4rem">🍫</div>₹25</div><div><div style="font-size:2.4rem">🧁</div>₹10</div><div><div style="font-size:2.4rem">🍪</div>₹15</div></div>`;
const caps=`<div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:360px">${'<span style="border:2px solid currentColor;border-radius:6px;padding:2px 6px;font-size:1.4rem">🧢🧢</span>'.repeat(7)}</div>`;
const vert=(a,b,sign,ans)=>`<div class="vert"><span>${a}</span><span>${sign} ${b}</span><span class="ln">${ans}</span></div>`;

/* ---------- ORIGINAL MODEL PAPER ---------- */
const SA='సెక్షన్ A · బహుళైచ్ఛిక', SB='సెక్షన్ B · 2 మార్కులు', SC='సెక్షన్ C · 4 మార్కులు', SD='సెక్షన్ D · 8 మార్కులు';
const PAPER=[
{no:'1',sec:SA,en:'The place value of the digit 3 in 307',te:'307 లో 3 అంకె యొక్క స్థాన విలువ.',opts:['3','30','300','307'],ans:2,exp:'307 లో 3 వందల స్థానంలో ఉంది → 3 × 100 = 300.'},
{no:'2',sec:SA,en:'What is the missing number in the pattern? 890, 892, 894, ___, 898',te:'అమరికలో లోపించిన సంఖ్య: 890, 892, 894, ___, 898',opts:['896','895','893','891'],ans:0,exp:'ప్రతిసారి 2 పెరుగుతోంది: 894 + 2 = 896.'},
{no:'3',sec:SA,en:'What is the value of Fifty six + Three = ?',te:'యాభై ఆరు + మూడు = విలువ ఎంత?',opts:['863','563','69','59'],ans:3,exp:'56 + 3 = 59.'},
{no:'4',sec:SA,en:'Which of the following has a value smaller than 5?',te:'కింది వానిలో దేని విలువ 5 కన్నా తక్కువ?',opts:['14 − 2','19 − 15','9 − 2','21 − 10'],ans:1,exp:'14−2=12, 19−15=4, 9−2=7, 21−10=11. 4 మాత్రమే 5 కన్నా తక్కువ.'},
{no:'5',sec:SA,en:'Which number comes immediately after 999?',te:'999 తరువాత వెంటనే వచ్చే సంఖ్య ఏది?',opts:['998','1000','1001','1100'],ans:1,exp:'999 + 1 = 1000.'},
{no:'6',sec:SA,en:'5 more than 365 is',te:'365 కన్నా 5 ఎక్కువైన సంఖ్య',opts:['355','360','370','3655'],ans:2,exp:'365 + 5 = 370.'},
{no:'7',sec:SA,en:'300 + 2 = ___',te:'300 + 2 = ___',opts:['3002','3020','302','32'],ans:2,exp:'3 వందలు + 2 ఒకట్లు = 302.'},
{no:'8',sec:SA,en:'By how much 315 is greater than 238?',te:'238 కన్నా 315 ఎంత ఎక్కువ?',opts:['77','123','177','5413'],ans:0,exp:'315 − 238 = 77.'},
{no:'9',sec:SA,en:'584 − 5 = ?',te:'584 − 5 = ?',opts:['574','579','581','589'],ans:1,exp:'584 − 5 = 579.'},
{no:'10',sec:SA,en:'In the multiplication 15 × 5 = 75, identify the multiplicand.',te:'15 × 5 = 75 గుణకారంలో గుణ్యాన్ని గుర్తించండి.',opts:['5','15','20','45'],ans:1,exp:'గుణ్యం (multiplicand) = 15, గుణకం (multiplier) = 5, లబ్ధం (product) = 75.'},
{no:'11',sec:SA,en:'Look at the Abacus and identify the number represented on it.',te:'అబాకస్‌ను చూసి దానిపై సూచించిన సంఖ్యను గుర్తించండి.',fig:abacusSVG,opts:['1101','1011','201','111'],ans:1,exp:'వేలు 1, వందలు 0, పదులు 1, ఒకట్లు 1 → 1011.'},
{no:'12',sec:SA,en:'9 fives is the same as',te:'9 ఐదులు అనగా',opts:['9 + 5','9 ÷ 5','9 − 5','9 × 5'],ans:3,exp:'9 సార్లు 5 = 9 × 5 = 45.'},
{no:'13',sec:SA,en:'Which two numbers have a sum equal to 500?',te:'ఏ రెండు సంఖ్యల మొత్తం 500 అవుతుంది?',opts:['240 మరియు 270','325 మరియు 175','215 మరియు 275','340 మరియు 165'],ans:1,exp:'325 + 175 = 500. (510, 490, 505 మిగతావి)'},
{no:'14',sec:SA,en:'Estimate the sum of 276 and 489 by rounding each number to the nearest hundred.',te:'276 మరియు 489 లను దగ్గరి వందలకు సవరించి మొత్తాన్ని అంచనా వేయండి.',opts:['700','750','800','900'],ans:2,exp:'276 → 300, 489 → 500. 300 + 500 = 800.'},
{no:'15',sec:SA,en:'Which number should be subtracted from 347 to get 291?',te:'సమాధానం 291 అవటానికి 347 నుండి ఏ సంఖ్యను తీసివేయవలెను?',opts:['46','56','66','76'],ans:1,exp:'347 − 291 = 56.'},
{no:'16',sec:SA,en:'☐ − 100 = 350 + 20. What is the missing number?',te:'☐ − 100 = 350 + 20. లోపించిన సంఖ్య ఏది?',opts:['270','330','370','470'],ans:3,exp:'350 + 20 = 370. ☐ = 370 + 100 = 470.'},
{no:'17',sec:SA,en:'In a toy shop, there are 609 toy cars. 19 are sold. How many are left?',te:'బొమ్మల దుకాణంలో 609 బొమ్మ కార్లు ఉన్నాయి. 19 అమ్మిన, ఇంకా ఎన్ని మిగిలి ఉన్నాయి?',opts:['580','590','628','600'],ans:1,exp:'609 − 19 = 590.'},

/* ---------- RANDOM PRACTICE ---------- */
function mcqFrom(correct, wrongs){
  const set=[...new Set([correct,...wrongs.filter(w=>w!==correct&&w>=0)])].slice(0,4);
  while(set.length<4){const w=correct+rnd(-20,20);if(w>=0&&!set.includes(w))set.push(w)}
  const opts=shuffle(set);return{opts:opts.map(String),ans:opts.indexOf(correct)};
}

 ()=>{const a=rnd(2,10),b=rnd(2,10),c=a*b;return{sec:'ఎక్కాలు',en:`${a} × ${b} = ?`,te:`${a} × ${b} = ?`,...mcqFrom(c,[c+a,c-a,c+b,c+1]),exp:`${a} ఎక్కంలో ${a} × ${b} = ${c}.`}},
 ()=>{const n=rnd(1000,9999),s=String(n),p=rnd(0,3),d=+s[p],pv=d*10**(3-p);const names=['వేల','వందల','పదుల','ఒకట్ల'];
   if(d===0)return GEN[0]();return{sec:'స్థాన విలువ',en:`Place value of ${d} in ${n}`,te:`${n} లో ${s[p]} (${names[p]} స్థానం) యొక్క స్థాన విలువ`,...mcqFrom(pv,[d,d*10,d*100,d*1000]),exp:`${d} ${names[p]} స్థానంలో ఉంది → ${pv}.`}},

 ()=>{const n=rnd(110,989),c=Math.round(n/100)*100;if(n%100===50)return GEN[6]();return{sec:'సవరించడం',en:`Round ${n} to the nearest hundred`,te:`${n} ని దగ్గరి వందకు సవరించండి`,...mcqFrom(c,[c+100,c-100,Math.round(n/10)*10]),exp:`పదుల అంకె ${Math.floor(n/10)%10} → ${c}.`}},

   return{sec:'అమరికలు',en:`Next in the pattern: ${seq.join(', ')}, ___`,te:`అమరికలో తర్వాతి సంఖ్య: ${seq.join(', ')}, ___`,...mcqFrom(c,[c+step,c-step,c+1]),exp:`ప్రతిసారి ${step} ${up?'పెరుగుతోంది':'తగ్గుతోంది'} → ${c}.`}},

function genPractice(){return Array.from({length:10},()=>GEN[rnd(0,GEN.length-1)]())}

/* ---------------- state ---------------- */
let mode='paper', Q=[], idx=0, st=[];
const langSeg=$('#langSeg');
function setLang(l){document.body.classList.toggle('only-te',l==='te');document.body.classList.toggle('only-en',l==='en');
  langSeg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));store.set('g3lang',l)}
langSeg.onclick=e=>{if(e.target.dataset.l)setLang(e.target.dataset.l)};
setLang(store.get('g3lang')||'both');

function showBest(){['paper','extra','practice'].forEach(m=>{const v=store.get('g3best-'+m);$('#best-'+m).textContent=v?('🏆 '+v+'%'):''})}
showBest();
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>start(b.dataset.mode));

function start(m){
  mode=m;
  let list = m==='paper'?PAPER : m==='extra'?EXTRA : genPractice();
  if($('#shuffle').checked && m!=='practice') list=shuffle(list);
  Q=list.map((q,i)=>({...q,type:q.type||'mcq',_n:q.no||String(i+1)}));
  st=Q.map(()=>({done:false,ok:false,resp:null}));
  idx=0; show("quiz"); buildJump(); render();
}
function show(id){['home','quiz','result'].forEach(s=>$('#'+s).classList.toggle('hidden',s!==id));window.scrollTo(0,0)}
$('#homeBtn').onclick=()=>{show('home');showBest()};
$('#home2Btn').onclick=()=>{show('home');showBest()};
$('#againBtn').onclick=()=>start(mode);

function buildJump(){
  $('#jump').innerHTML=Q.map((q,i)=>`<button data-i="${i}">${q._n.replace(/ \((.)\)/,'$1')}</button>`).join('');
  $('#jump').onclick=e=>{const i=e.target.dataset.i;if(i!==undefined){idx=+i;render()}};
  paintJump();
}
function paintJump(){[...$('#jump').children].forEach((b,i)=>{b.className=(i===idx?'cur ':'')+(st[i].done?(st[i].ok?'ok':'bad'):'')})}

/* ---------------- render ---------------- */
function render(){
  const q=Q[idx], s=st[idx];
  $('#count').textContent=`${idx+1} / ${Q.length}`;
  $('#progI').style.width=(st.filter(x=>x.done).length/Q.length*100)+'%';
  $('#qsec').textContent=q.sec;
  $('#qtext').innerHTML=`<div class="en"><span class="qno">${q._n}.</span>${q.en}</div><div class="te">${mode==='paper'||true?'':''}${q.te}</div>`+(q.fig?`<div class="fig">${q.fig}</div>`:'');
  const body=$('#qbody'); body.innerHTML='';
  if(q.type==='mcq'){
    const long=q.opts.some(o=>o.length>14);
    body.innerHTML=`<div class="opts ${long?'':'two'}">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="l">${'ABCD'[i]}</span><span class="kalam" style="font-size:1.1rem">${o}</span></button>`).join('')}</div>`;
    body.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(st[idx].done)return;s.resp=+b.dataset.i;body.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b))});
  }
  else if(q.type==='fill'){
    let h=q.html.replace(/\{(\d)\}/g,(m,k)=>{
      if(q.sel&&q.sel[k])return `<select class="blank" data-k="${k}"><option value="">?</option>${q.sel[k].map(o=>`<option>${o}</option>`).join('')}</select>`;
      return `<input class="blank ${q.small?'d1':''}" data-k="${k}" inputmode="numeric" autocomplete="off">`});
    body.innerHTML=`<div class="fill">${h}</div>`;
    const ins=[...body.querySelectorAll('input.blank')];
    ins.forEach((inp,i)=>inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(ins[i+1])ins[i+1].focus();else check()}}));
  }
  else if(q.type==='match'){
    body.innerHTML=`<div style="margin-top:12px">${q.rows.map((r,i)=>`<div class="mrow"><span class="left">${r.left}</span><select class="blank" data-k="${i}"><option value="">— ఎంచుకోండి —</option>${r.opts.map((o,j)=>`<option value="${j}">${o}</option>`).join('')}</select></div>`).join('')}</div>`;
  }
  else if(q.type==='numberline'){ body.innerHTML=numberLine(q); }
  else if(q.type==='perm'){
    body.innerHTML=`<div class="perm">${Array.from({length:8},(_,i)=>`<input class="blank" data-k="${i}" inputmode="numeric" maxlength="4" autocomplete="off">`).join('')}</div>`;
  }
  // restore state
  const fb=$('#fb'); fb.className='fb'; fb.innerHTML='';
  if(s.done){ restore(q,s); feedback(q,s.ok,s.detail); }
  $('#checkBtn').classList.toggle('hidden',s.done);
  $('#nextBtn').classList.toggle('hidden',!s.done);
  $('#nextBtn').textContent= idx===Q.length-1?'ఫలితం చూడు 🏁':'తర్వాత ▶';
  $('#prevBtn').disabled= idx===0;
  paintJump();
}

function numberLine(q){
  const n=(q.to-q.from)/q.step, gap=26, W=n*gap+60;
  let t='';
  for(let i=0;i<=n;i++){const v=q.from+i*q.step,x=30+i*gap,major=v%q.label===0;
    t+=`<g class="nl-tick" data-v="${v}"><rect x="${x-12}" y="8" width="24" height="70" fill="transparent"/>
    <line x1="${x}" y1="${major?30:36}" x2="${x}" y2="${major?62:56}" stroke="currentColor" stroke-width="${major?2.5:1.5}"/>
    ${major?`<text x="${x}" y="80" font-family="Kalam" font-size="14" text-anchor="middle" fill="currentColor">${v}</text>`:''}
    <g class="mk" style="display:none"><circle cx="${x}" cy="46" r="7" fill="#ff8a3d"/><text x="${x}" y="22" font-family="Kalam" font-weight="700" font-size="13" text-anchor="middle" fill="#ff8a3d">${v}</text></g></g>`}
  return `<div class="nl-wrap"><svg viewBox="0 0 ${W} 90" width="${W}" height="90" style="color:var(--ink)" id="nl">
   <line x1="10" y1="46" x2="${W-10}" y2="46" stroke="currentColor" stroke-width="2"/>
   <path d="M10 46l8-5v10z M${W-10} 46l-8-5v10z" fill="currentColor"/>${t}</svg></div>
   <p class="te" style="font-size:.85rem">👉 సంఖ్యారేఖను పక్కకు జరపవచ్చు. తప్పుగా నొక్కితే మళ్ళీ నొక్కి తీసేయండి.</p>`;
}
document.addEventListener('click',e=>{
  const g=e.target.closest('.nl-tick'); if(!g||st[idx].done)return;
  const mk=g.querySelector('.mk'); mk.style.display=mk.style.display==='none'?'':'none';
});

/* ---------------- check ---------------- */
const norm=v=>String(v).replace(/[\s,]/g,'').replace('x','×').replace('*','×').replace('-','−');
function collect(q){
  const b=$('#qbody');
  if(q.type==='mcq')return st[idx].resp;
  if(q.type==='numberline')return [...b.querySelectorAll('.nl-tick')].filter(g=>g.querySelector('.mk').style.display!=='none').map(g=>+g.dataset.v);
  return [...b.querySelectorAll('.blank')].map(x=>x.value);
}
function check(){
  const q=Q[idx], s=st[idx]; const r=collect(q);
  let ok=false, detail='';
  if(q.type==='mcq'){ if(r==null){nudge('ఒక జవాబు ఎంచుకోండి');return} ok=r===q.ans; }
  else if(q.type==='fill'){ if(r.every(v=>v.trim()==='')){nudge('డబ్బాలలో జవాబు రాయండి');return} s.marks=r.map((v,i)=>norm(v)===norm(q.ans[i])); ok=s.marks.every(Boolean); }
  else if(q.type==='match'){ if(r.every(v=>v==='')){nudge('జతలను ఎంచుకోండి');return} s.marks=r.map((v,i)=>v!==''&&+v===q.rows[i].ans); ok=s.marks.every(Boolean); }
  else if(q.type==='numberline'){ if(!r.length){nudge('సంఖ్యారేఖపై గీతలను నొక్కండి');return} ok=r.length===q.targets.length&&q.targets.every(t=>r.includes(t)); }
  else if(q.type==='perm'){
    const want=q.digits.split('').sort().join(''); const seen=new Set();
    s.marks=r.map(v=>{v=v.trim();const good=/^\d{4}$/.test(v)&&v.split('').sort().join('')===want&&!seen.has(v);if(good)seen.add(v);return good});
    ok=s.marks.every(Boolean); if(!ok)detail='ఎరుపు డబ్బాలలోని సంఖ్యలు సరికావు: ప్రతి సంఖ్యలో 1, 3, 9, 8 ఒక్కొక్కసారే ఉండాలి, ఒకే సంఖ్య రెండుసార్లు రాకూడదు.';
  }
  s.done=true; s.ok=ok; s.resp=r; s.detail=detail;
  restore(q,s); feedback(q,ok,detail);
  $('#checkBtn').classList.add('hidden'); $('#nextBtn').classList.remove('hidden');
  $('#progI').style.width=(st.filter(x=>x.done).length/Q.length*100)+'%';
  $('#qcard').classList.remove('pop'); void $('#qcard').offsetWidth; if(ok)$('#qcard').classList.add('pop');
  paintJump();
}
function restore(q,s){
  const b=$('#qbody');
  if(q.type==='mcq'){ b.querySelectorAll('.opt').forEach((o,i)=>{o.disabled=true;if(i===q.ans)o.classList.add('ok');else if(i===s.resp)o.classList.add('bad')}); }
  else if(q.type==='numberline'){
    b.querySelectorAll('.nl-tick').forEach(g=>{const v=+g.dataset.v,mk=g.querySelector('.mk');const picked=s.resp.includes(v),tgt=q.targets.includes(v);
      if(picked||tgt){mk.style.display='';const col=tgt?'#16a34a':'#dc2626';mk.querySelector('circle').setAttribute('fill',col);mk.querySelector('text').setAttribute('fill',col)}});
  } else {
    b.querySelectorAll('.blank').forEach((x,i)=>{x.value=s.resp[i]??'';x.disabled=true;x.classList.add(s.marks[i]?'ok':'bad')});
  }
}
function answerText(q){
  if(q.type==='mcq')return q.opts[q.ans];
  if(q.type==='fill')return q.ans.join(', ');
  if(q.type==='match')return q.rows.map(r=>`${r.left} → ${r.opts[r.ans]}`).join(' ; ');
  if(q.type==='numberline')return q.targets.join(', ');
  if(q.type==='perm')return '1389, 1398, 1839, 1893 …';
}
function feedback(q,ok,detail){
  const fb=$('#fb');
  fb.className='fb '+(ok?'ok':'bad');
  fb.innerHTML= ok?`<b>✅ సరైనది! శభాష్!</b>${q.exp}`:`<b>❌ తప్పు. సరైన జవాబు: <span class="kalam">${answerText(q)}</span></b>${detail?detail+'<br>':''}${q.exp}`;
}
function nudge(msg){const fb=$('#fb');fb.className='fb bad';fb.innerHTML='<b>⚠️ '+msg+'</b>';$('#qcard').classList.remove('shake');void $('#qcard').offsetWidth;$('#qcard').classList.add('shake')}

$('#checkBtn').onclick=check;
$('#prevBtn').onclick=()=>{if(idx>0){idx--;render()}};
$('#nextBtn').onclick=()=>{
  if(idx<Q.length-1){idx++;render();return}
  const nxt=st.findIndex(x=>!x.done); if(nxt>=0){idx=nxt;render();return}
  finish();
};

function finish(){
  const n=st.filter(x=>x.ok).length, pct=Math.round(n/Q.length*100);
  $('#score').textContent=`${n} / ${Q.length}`;
  $('#stars').textContent= pct>=90?'⭐⭐⭐':pct>=60?'⭐⭐':pct>=35?'⭐':'💪';
  $('#msg').textContent= pct>=90?`అద్భుతం! ${pct}% – చాలా బాగా చేశావు!`:pct>=60?`బాగుంది! ${pct}% – ఇంకొంచెం సాధన చేయి.`:`${pct}% – తప్పులను చూసి మళ్ళీ ప్రయత్నించు.`;
  const prev=+(store.get('g3best-'+mode)||0); if(pct>prev)store.set('g3best-'+mode,pct);
  const wrong=Q.map((q,i)=>({q,i})).filter(o=>!st[o.i].ok);
  $('#review').innerHTML= wrong.length?`<div class="secHead">❌ సరిచేసుకోవలసినవి (${wrong.length})</div>`+wrong.map(({q})=>`<div class="ritem"><b class="kalam">${q._n}.</b> ${q.te}<br><span class="a">✓ ${answerText(q)}</span></div>`).join(''):'<div class="secHead" style="text-align:center">🎉 అన్నీ సరైనవి!</div>';
  show('result');
}
</script>
</body>
</html>
