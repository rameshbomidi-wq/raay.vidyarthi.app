["రామాయణ కాండలు","రావణ వధ – ఏ కాండ?",["బాలకాండ","సుందరకాండ","అరణ్యకాండ","యుద్ధకాండ"],3,"యుద్ధకాండ"]];
const W=[
["సున్నితత్వం – 8 నుండి 10 వాక్యాలు","పాఠ్యభాగ సారాంశాన్ని సొంతమాటల్లో రాయండి.","ఒక పాత్ర వ్యక్తిత్వాన్ని విశ్లేషించండి (ఉదా. ఎల్లమ్మ).","స్వాతంత్ర్య పోరాటంలో భారతీయుల పరిస్థితిని వివరించండి."],
["4–5 వాక్యాల ప్రశ్నలు","పాఠ్యభాగ కవి జీవిత విశేషాలు తెల్పండి.","నాటక ప్రక్రియను వివరించండి.","ఒక పాత్ర స్వభావాన్ని రాయండి (ఉదా. సుగ్రీవుడు)."],
["సృజనాత్మకత – 8 నుండి 10 వాక్యాలు","రెండు పాత్రల మధ్య సంభాషణ రాయండి.","మీ పాఠశాలలో ప్రత్యేక అవసరాలు గల పిల్లలకు మీరు ఎలా తోడ్పడతారు?","రామాయణ ప్రాశస్త్యం / సీతాన్వేషణ వృత్తాంతం రాయండి."],
["అలంకారం & ఛందస్సు (2 మార్కులు)","ఇచ్చిన వాక్యంలో అలంకారం గుర్తించి లక్షణం రాయండి.","పద్య పాదానికి గణవిభజన చేసి పద్యం పేరు రాయండి."]];
let tab=0,cat="అన్నీ",done={},right=0,tot=0;
const tabs=["అవగాహన (గద్యం)","భాషాంశాలు","రచనా అభ్యాసం"];
const $=id=>document.getElementById(id);
function nav(){$("tabs").innerHTML=tabs.map((t,i)=>`<button class="${i==tab?'on':''}" onclick="tab=${i};cat='అన్నీ';draw()">${t}</button>`).join("")}
function opts(id,o,a,e){return o.map((x,i)=>`<button class="o" id="${id}_${i}" onclick="pick('${id}',${i},${a},${o.length})">${["అ","ఆ","ఇ","ఈ"][i]}) ${x}</button>`).join("")+`<div class="e" id="${id}_e" data-e="${e||""}"></div>`}
function pick(id,i,a,n){if(done[id]!==undefined)return;done[id]=i;tot++;if(i==a)right++;
for(let k=0;k<n;k++){const b=$(id+"_"+k);if(k==a)b.classList.add("ok");else if(k==i)b.classList.add("no")}
const e=$(id+"_e");e.textContent=(i==a?"✓ సరైనది! ":"✗ సరైన జవాబు: "+["అ","ఆ","ఇ","ఈ"][a]+". ")+e.dataset.e;$("sc").textContent=`మార్కులు: ${right} / ${tot}`}
function bar(){return `<div class="bar sc"><span id="sc">మార్కులు: ${right} / ${tot}</span><button onclick="reset()">మళ్ళీ మొదలు</button></div>`}
function draw(){nav();let h="";
if(tab==0){h+=bar();P.forEach((p,pi)=>{h+=`<div class="c"><span class="tag">అపరిచిత గద్యం (4 × 1)</span><div class="ps">${p.x}</div>`;p.q.forEach((q,qi)=>{h+=`<div class="q">${["అ","ఆ","ఇ","ఈ"][qi]}) ${q[0]}</div>${opts("p"+pi+qi,q[1],q[2],"")}`});h+="</div>"})}
else if(tab==1){const cs=["అన్నీ",...new Set(G.map(g=>g[0]))];
h+=bar()+`<div class="chips">${cs.map(c=>`<button class="${c==cat?'on':''}" onclick="cat='${c}';draw()">${c}</button>`).join("")}</div>`;
G.forEach((g,i)=>{if(cat!="అన్నీ"&&g[0]!=cat)return;h+=`<div class="c"><span class="tag">${g[0]} · ప్ర. ${i+1}</span><div class="q">${g[1]}</div>${opts("g"+i,g[2],g[3],g[4])}</div>`})}
else{W.forEach(w=>{h+=`<div class="c"><b>${w[0]}</b><ul>${w.slice(1).map(x=>`<li>${x}</li>`).join("")}</ul></div>`});
h+=`<div class="c"><b>సూచనలు</b><ul><li>సమాధానాలు స్పష్టంగా, గుండ్రంగా రాయాలి.</li><li>ప్రశ్న సూచించిన వాక్యాల సంఖ్యను పాటించండి.</li><li>పరిచయం – ముఖ్యాంశాలు – ముగింపు క్రమంలో రాయండి.</li></ul></div>`}
$("v").innerHTML=h}
function reset(){done={};right=0;tot=0;draw()}
draw();
</script></body></html>
