function ansScale(src,w){let cur=src,cw=src.width,ch=src.height;const h=Math.round(ch*w/cw);

 const o=document.createElement('canvas');o.width=w;o.height=h;const x=o.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(cur,0,0,w,h);return o;}
function ansClean(src,w){const cv=ansScale(src,w),h=cv.height,x=cv.getContext('2d');const id=x.getImageData(0,0,w,h),d=id.data,n=w*h,g=new Uint8ClampedArray(n);
 for(let i=0;i<n;i++)g[i]=(d[i*4]*.3+d[i*4+1]*.59+d[i*4+2]*.11)|0;
 const r=Math.max(8,Math.round(w/28)),bg=new Float32Array(n),tmp=new Float32Array(n);
 for(let y=0;y<h;y++){let s=0,c=0;for(let xx=-r;xx<w+r;xx++){const a=xx+r,b=xx-r-1;if(a<w&&a>=0){s+=g[y*w+a];c++;}if(b>=0&&b<w){s-=g[y*w+b];c--;}if(xx>=0&&xx<w)tmp[y*w+xx]=s/c;}}

async function libLoad(force){if(view!=='library')return;const tab=param.tab||'books',c=param.c||S.cur.c;const box=document.getElementById('libList');if(!box)return;

 let items=[];
 if(tab==='books'){const files=await listDir('books/'+c,force);
  (files||[]).filter(f=>/\.pdf$/i.test(f.name)).sort((a,b)=>a.name.localeCompare(b.name)).forEach(f=>items.push({t:prettyName(f.name),u:'books/'+c+'/'+encodeURIComponent(f.name),k:'pdf',ic:bookIcon(f.name),sub:mb(f.size)}));
  live('notes').filter(n=>n.kind==='book'&&n.c===c).forEach(n=>items.push({t:n.t,u:n.url,k:tKind(n.url),ic:n.up?'📘':'🔗',sub:(SUBJ[n.s]?SUBJ[n.s].n+' • ':'')+(n.up?'టీచర్ అప్‌లోడ్ చేసింది':'టీచర్ జోడించింది')}));
  if(files===null&&!items.length){box.innerHTML='<div class="empty">📴 ఇంటర్నెట్ లేదు – నెట్ ఆన్ చేసి 🔄 నొక్కు</div>';return;}}
 else{const files=await listDir('tools',force);
  (files||[]).filter(f=>/\.html?$/i.test(f.name)).sort((a,b)=>a.name.localeCompare(b.name)).forEach(f=>items.push({t:prettyName(f.name),u:'tools/'+encodeURIComponent(f.name),k:'tool',ic:'🧰',sub:'అందరికీ'}));
  live('notes').filter(n=>n.kind==='tool'&&(!n.c||n.c===S.cur.c)).forEach(n=>items.push({t:n.t,u:n.url,k:tKind(n.url),ic:'🔗',sub:(n.c?n.c+'వ తరగతి • ':'')+'టీచర్ జోడించింది'}));
  if(files===null&&!items.length){box.innerHTML='<div class="empty">📴 ఇంటర్నెట్ లేదు – నెట్ ఆన్ చేసి 🔄 నొక్కు</div>';return;}}
 if(view!=='library')return;
 LIB=items;const pos=S.bookPos||{};
 box.innerHTML=items.length?`<div class="list">${items.map((it,i)=>`<button class="li" onclick="openItem(${i})"><span style="display:flex;gap:12px;align-items:center;text-align:left"><span style="font-size:30px">${it.ic}</span><span><b style="display:block">${esc(it.t)}</b><small class="mut">${esc(it.sub||'')}${pos[it.u]?' • పేజీ '+pos[it.u]+' దగ్గర ఆపావు':''}</small></span></span><span>▶</span></button>`).join('')}</div>`
  :`<div class="empty">${tab==='books'?'ఈ తరగతికి పుస్తకాలు ఇంకా జోడించలేదు 📚':'టూల్స్ ఇంకా జోడించలేదు 🧰'}</div>`;}

V.book=()=>{const p=param,k=p.k;const ext=/^https?:/i.test(p.u);
 const top=`<div class="bvtop"><button class="ib" onclick="closeBook()" aria-label="మూసివేయి">✕</button><b>${esc(p.t||'')}</b>${k!=='pdf'?`<a class="ib" href="${esc(k==='drive'?'https://drive.google.com/file/d/'+driveId(p.u)+'/view':p.u)}" target="_blank" rel="noopener" aria-label="కొత్త ట్యాబ్">↗</a>`:`<a class="ib" href="${esc(p.u)}" target="_blank" rel="noopener" download aria-label="డౌన్‌లోడ్">⬇</a>`}</div>`;
 if(k==='drive')return `<div class="bview">${top}<iframe class="bframe" src="https://drive.google.com/file/d/${esc(driveId(p.u))}/preview" allow="autoplay; fullscreen" referrerpolicy="no-referrer"></iframe></div>`;
 if(k==='tool')return `<div class="bview">${top}<iframe class="bframe" src="${esc(p.u)}" allow="autoplay; fullscreen; clipboard-write; microphone; camera" ${ext?'referrerpolicy="no-referrer"':''}></iframe></div>`;
 return `<div class="bview">${top}<div id="bbox" class="bbox"><div id="bmsg" class="bmsg">⏳ పుస్తకం తెరుస్తోంది...</div><canvas id="bcv"></canvas></div>

function bmsg(h){const m=document.getElementById('bmsg');if(m){m.innerHTML=h;m.style.display=h?'block':'none';}}
async function pdfInit(){const u=param.u;BV={url:u,page:(S.bookPos||{})[u]||1,zoom:1,doc:null,tok:0};
 try{const lib=await loadPdfjs();const task=lib.getDocument({url:u,disableRange:true,disableStream:true,cMapUrl:PDFJS.cmap,cMapPacked:true});
  task.onProgress=(p)=>{if(p&&p.total)bmsg('⏳ లోడ్ అవుతోంది '+Math.min(100,Math.round(p.loaded*100/p.total))+'%');};BV.task0=task;
  const doc=await task.promise;if(view!=='book'||param.u!==u){try{doc.destroy();}catch(e){}return;}
  BV.doc=doc;BV.n=doc.numPages;BV.page=Math.min(Math.max(1,BV.page),BV.n);bmsg('');pdfDraw();}
 catch(e){if(view==='book'&&param.u===u)bmsg(`😕 పుస్తకం తెరవలేకపోయాం (ఇంటర్నెట్ చూడండి).<br><br><a class="btn sm" href="${esc(u)}" target="_blank" rel="noopener" download>⬇ డౌన్‌లోడ్ చేసి తెరువు</a>`);}}
async function pdfDraw(){if(!BV.doc)return;const tok=++BV.tok,n=BV.page;const pg=document.getElementById('bpg'),pn=document.getElementById('bpn');if(pg)pg.value=n;if(pn)pn.textContent='/ '+BV.n;
 try{const page=await BV.doc.getPage(n);if(tok!==BV.tok||view!=='book')return;
  const box=document.getElementById('bbox'),cv=document.getElementById('bcv');if(!box||!cv)return;
  const cw=Math.max(200,box.clientWidth-12),v1=page.getViewport({scale:1}),vp=page.getViewport({scale:cw/v1.width*BV.zoom}),dpr=Math.min(window.devicePixelRatio||1,2);
  if(BV.rt){try{BV.rt.cancel();}catch(e){}}
  cv.width=Math.floor(vp.width*dpr);cv.height=Math.floor(vp.height*dpr);cv.style.width=Math.floor(vp.width)+'px';cv.style.height=Math.floor(vp.height)+'px';
  BV.rt=page.render({canvasContext:cv.getContext('2d'),viewport:vp,transform:dpr!==1?[dpr,0,0,dpr,0,0]:null});
  await BV.rt.promise.catch(()=>{});if(tok!==BV.tok)return;box.scrollTop=0;S.bookPos=S.bookPos||{};S.bookPos[BV.url]=n;save();}catch(e){}}
function pdfGo(d){if(!BV.doc)return;const n=Math.min(BV.n,Math.max(1,BV.page+d));if(n!==BV.page){BV.page=n;pdfDraw();}}
function pdfTo(v){if(!BV.doc)return;const n=parseInt(v,10);if(n>=1&&n<=BV.n){BV.page=n;pdfDraw();}else{const pg=document.getElementById('bpg');if(pg)pg.value=BV.page;}}
function pdfZoom(f){if(!BV.doc)return;BV.zoom=Math.min(4,Math.max(0.6,BV.zoom*f));pdfDraw();}
function closeBook(){try{BV.rt&&BV.rt.cancel();}catch(e){}try{BV.doc&&BV.doc.destroy();}catch(e){}try{BV.task0&&BV.task0.destroy();}catch(e){}const b=param.back||{};BV={};go('library',b);}
document.addEventListener('keydown',e=>{if(view!=='book'||param.k!=='pdf'||(e.target&&e.target.tagName==='INPUT'))return;
 if(e.key==='ArrowRight'||e.key==='PageDown'){pdfGo(1);e.preventDefault();}else if(e.key==='ArrowLeft'||e.key==='PageUp'){pdfGo(-1);e.preventDefault();}
 else if(e.key==='+'||e.key==='='){pdfZoom(1.25);}else if(e.key==='-'){pdfZoom(0.8);}else if(e.key==='Escape'||e.key==='Backspace'){closeBook();}});
let tsx=null,tsy=null;
document.addEventListener('touchstart',e=>{if(view==='book'&&param.k==='pdf'&&e.touches.length===1&&BV.zoom<=1){tsx=e.touches[0].clientX;tsy=e.touches[0].clientY;}else tsx=null;},{passive:true});
document.addEventListener('touchend',e=>{if(tsx==null)return;const t=e.changedTouches[0],dx=t.clientX-tsx,dy=t.clientY-tsy;tsx=null;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)pdfGo(dx<0?1:-1);},{passive:true});

(function(){const h=location.hash||'';const m=h.match(/join=([A-Za-z0-9_\-]+)/);if(m)joinWith(m[1]);const g=h.match(/go=(\w+)/);if(g&&V[g[1]])view=g[1];if(m||g){try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}}})();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')Sync.run();});
window.addEventListener('online',()=>Sync.run());
markDay();render();
(function(){const sp=document.getElementById('splash');if(!sp)return;let seen=false;try{seen=sessionStorage.getItem('raiSplash')==='1';sessionStorage.setItem('raiSplash','1');}catch(e){}
 if(seen){sp.remove();return;}setTimeout(()=>{sp.classList.add('out');setTimeout(()=>sp.remove(),500);},900);})();
if(S.cfg.type)Sync.start();
if(/^https?:$/.test(location.protocol))loadPubCfg();

/* 📤 PDF నేరుగా అప్‌లోడ్ (Google Sheets సర్వర్ → యజమాని Google Drive) */
const UPMAX=20*1048576,UPCH=2000000;let UPBUSY=false;
function bkFile(inp){const f=inp.files&&inp.files[0];const n=document.getElementById('bkfn');if(!f){if(n)n.textContent='ఫైల్ ఎంచుకోలేదు';return;}
 if(n)n.innerHTML=`📄 <b>${esc(f.name)}</b> • ${mb(f.size)}${f.size>UPMAX?' <span style="color:#dc2626">(20 MB కంటే పెద్దది)</span>':''}`;const t=document.getElementById('bkt');if(t&&!t.value.trim())t.value=prettyName(f.name);}
function upProg(p,msg){const b=document.getElementById('bkp');if(!b)return;b.hidden=false;const i=b.querySelector('i'),s=b.querySelector('span');if(p>=0)i.style.width=p+'%';i.style.background=p<0?'#fca5a5':'';s.textContent=msg;}
function upErr(e){return {key:'అనుమతి లేదు – మీ తరగతికి మాత్రమే అప్‌లోడ్ చేయగలరు',big:'ఫైల్ 20 MB కంటే పెద్దది – Compress చేయండి',pdf:'ఇది PDF ఫైల్ కాదు',quota:'పాఠశాల PDF స్థలం (500 MB) నిండింది – పాత పుస్తకాలు తొలగించండి',busy:'ఈ గంటలో అప్‌లోడ్ పరిమితి దాటింది – కాసేపాగి ప్రయత్నించండి',drive:'సర్వర్‌కు Google Drive అనుమతి లేదు – యజమాని Apps Script లో driveSetup ▶ Run చేయాలి',part:'అప్‌లోడ్ మధ్యలో తెగింది – మళ్ళీ ప్రయత్నించండి',bad:'అప్‌లోడ్ అభ్యర్థన తప్పు – మళ్ళీ ప్రయత్నించండి'}[e]||gsErr(e);}
function b64File(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const s=String(r.result);ok(s.slice(s.indexOf(',')+1));};r.onerror=()=>no(new Error('ఫైల్ చదవలేకపోయాం'));r.readAsDataURL(f);});}
const UPOLD='సర్వర్ కోడ్ పాతది – పబ్లిక్ సర్వర్ కోడ్ మార్చి New version Deploy చేయాలి';
async function upPdf(f,c,prog){prog(1,'ఫైల్ సిద్ధం చేస్తోంది...');const data=await b64File(f);const n=Math.ceil(data.length/UPCH),u=uid();let j=null;
 for(let i=0;i<n;i++){const part=data.slice(i*UPCH,(i+1)*UPCH);prog(Math.max(2,Math.round(i*95/n)),i===n-1?'Drive లో సేవ్ చేస్తోంది... (కొంచెం సమయం పడుతుంది)':'అప్‌లోడ్ అవుతోంది '+Math.round(i*100/n)+'%');j=null;
  for(let a=0;a<3&&!j;a++){try{const r=await fetch(S.cfg.url,{method:'POST',body:JSON.stringify({a:'up',s:S.cfg.sid,k:GS.key(),dev:S.dev,u,i,n,c,name:f.name,data:part})});j=await r.json();}catch(e){j=null;if(a<2)await new Promise(z=>setTimeout(z,1500*(a+1)));}}
  if(!j)throw new Error('ఇంటర్నెట్ సమస్య – నెట్ చూసి మళ్ళీ ప్రయత్నించండి');
  if(!j.ok)throw new Error(upErr(j.err));
  if(j.got!==i)throw new Error(UPOLD);}
 if(!j||!j.url)throw new Error(UPOLD);prog(100,'✓ అప్‌లోడ్ పూర్తయింది');return j.url;}
async function upBook(){const fi=document.getElementById('bkf'),f=fi&&fi.files&&fi.files[0];if(!f)return;
 const t=$('#bkt').value.trim()||prettyName(f.name),c=+$('#bkc').value,s=$('#bkcs').value;
 if(S.cfg.type!=='gs')return toast('PDF అప్‌లోడ్‌కు ఆన్‌లైన్ సింక్ (Google Sheets) కావాలి – లేదా Drive లింక్ ఇవ్వండి');
 if(!S.cfg.isT)return toast('ఉపాధ్యాయ కీతో కనెక్ట్ అయితేనే అప్‌లోడ్ చేయగలరు');
 if(!/\.pdf$/i.test(f.name)&&f.type!=='application/pdf')return toast('PDF ఫైల్ మాత్రమే అప్‌లోడ్ చేయగలరు');
 if(f.size>UPMAX)return toast(`ఫైల్ ${mb(f.size)} – 20 MB లోపు ఉండాలి (ilovepdf.com → Compress PDF)`);
 if(UPBUSY)return;UPBUSY=true;const btn=document.getElementById('bkbtn');if(btn){btn.disabled=true;btn.textContent='⏳ అప్‌లోడ్ అవుతోంది...';}
 try{const url=await upPdf(f,c,upProg);put('notes',{id:uid(),kind:'book',c,s,t,url,fid:driveId(url),up:1,x:''});toast('PDF అప్‌లోడ్ అయింది ✓ పిల్లలకు కనిపిస్తుంది');go('teacher',{t:'lb'});}
 catch(e){upProg(-1,'❌ '+e.message);toast(e.message);}
 finally{UPBUSY=false;const b2=document.getElementById('bkbtn');if(b2){b2.disabled=false;b2.textContent='➕ పుస్తకం జోడించు';}}}
function delBook(id){if(!confirm('తొలగించాలా?'))return;const n=live('notes').find(x=>x.id===id);
 if(n&&n.up&&n.fid&&S.cfg.type==='gs')fetch(S.cfg.url,{method:'POST',body:JSON.stringify({a:'rm',s:S.cfg.sid,k:GS.key(),dev:S.dev,fid:n.fid})}).catch(()=>{});
 remove('notes',id);go('teacher',{t:'lb'});}

</script>
