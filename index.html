<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#063a5b">
<meta name="description" content="1 నుండి 10 తరగతుల విద్యార్థుల లెర్నింగ్ యాప్ – రాయ్ ఎడ్యుకేషన్">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="రాయ్ విద్యార్థి">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>రాయ్ విద్యార్థి లెర్నింగ్ యాప్ – 1 నుండి 10 తరగతులు</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#063a5b;--teal:#2aa6a6;--teal2:#1d8c8c;--ink:#1f2937;--mut:#6b7280;--bg:#eef5f6;--card:#fff;--line:#e5e7eb;--red:#e5484d;--green:#16a34a;--amber:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#dfe9eb;max-width:100%}
html{overflow-x:hidden}
body{overflow-x:clip}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html{overscroll-behavior-y:none}
.car-in,.hscroll,.tchips{overscroll-behavior-x:contain}
.bbox{overscroll-behavior:contain}
body{font-family:'Poppins','Noto Sans Telugu',system-ui,sans-serif;color:var(--ink);font-size:15px;line-height:1.45}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:86px;position:relative}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--teal)}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px;color:#374151}
a{color:#2563eb;cursor:pointer}
main{padding:14px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--navy);color:#fff}
.top .who{flex:1;line-height:1.25;min-width:0}
.top .who b{font-size:15px;letter-spacing:.3px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .who small{opacity:.75;font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{border:0;background:rgba(255,255,255,.14);color:inherit;width:40px;height:40px;border-radius:12px;font-size:18px;position:relative;flex:none;display:grid;place-items:center}
.bell i{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-style:normal;font-size:10px;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 4px;font-weight:700}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.bar .ib{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.bar h2{font-size:19px;flex:1}
.hero{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;border-radius:22px;padding:18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 20px rgba(42,166,166,.25)}
.hero small{opacity:.9}.hero h2{font-size:23px;line-height:1.2}.hero p{opacity:.9;font-size:13px;margin-top:2px}.mascot{font-size:54px}
.perf{background:#fdeaa8;border-radius:22px;padding:16px 16px 14px;display:flex;gap:10px;align-items:center;margin-top:14px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.06)}
.perf>div{flex:1}.perf h3{font-size:18px}.perf p{font-size:13px;color:#4b5563;margin:4px 0 10px}.more{font-size:12px;letter-spacing:1.5px}
.sec{margin:20px 2px 10px;font-size:13px;letter-spacing:.9px;color:#374151;font-weight:700}
.mut{color:var(--mut);font-size:13px}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}.hscroll::-webkit-scrollbar{display:none}
.ecard{flex:0 0 68%;max-width:230px;background:#fff;border:1.5px solid #1f2937;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px}
.ecard b{font-size:15px;line-height:1.3}.ecard small{color:var(--mut)}
.ecard .lk2{border-top:1.5px solid #1f2937;padding-top:8px;margin-top:auto;font-size:12px;font-weight:700;letter-spacing:1px;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:var(--ink)}
.tag{display:inline-block;background:#fde047;font-size:11px;padding:2px 9px;border-radius:7px;font-weight:600;align-self:flex-start}
.tag.t{background:#bfdbfe}.tag.h{background:#fecaca}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border:0;border-radius:18px;padding:14px 6px;text-align:center;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.05);transition:transform .15s}
.tile:active{transform:scale(.95)}
.tile span{font-size:30px;display:block;line-height:1.2}.tile b{font-size:13px;display:block;margin-top:5px}.tile small{font-size:11px;color:#4b5563}
.doubt{background:#f7d4d6;border-radius:22px;padding:18px;position:relative;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.06)}
.doubt h3{font-size:20px}.doubt p{color:#4b5563;font-size:14px;margin-top:6px;max-width:78%}
.doubt .bub{position:absolute;right:18px;top:14px;font-size:38px}
.doubt .play{position:absolute;right:16px;bottom:14px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.75);display:grid;place-items:center;font-size:14px}
.subs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sub{border:0;border-radius:16px;padding:14px 12px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;text-align:left;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.05)}
.si{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.7);display:grid;place-items:center;font-size:20px;font-weight:700;flex:none}
.sub b{font-size:14px;display:block;line-height:1.25}.sub small{font-size:11px;color:#4b5563}
.pb{flex-basis:100%;height:6px;background:rgba(255,255,255,.7);border-radius:4px;overflow:hidden;display:block}.pb i{display:block;height:100%;background:var(--teal);border-radius:4px}
.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.05);margin-bottom:12px}
.card h3{font-size:16px;margin-bottom:6px}
.btn{border:0;background:var(--teal);color:#fff;padding:12px 16px;border-radius:14px;font-weight:600;width:100%;margin-top:14px;font-size:15px}
.btn:disabled{opacity:.45}
.btn.ghost{background:#fff;color:var(--teal2);border:1.5px solid var(--teal)}
.btn.dark{background:#111827;width:auto;padding:11px 20px;border-radius:30px;letter-spacing:1px;font-size:13px}
.btn.sm{width:auto;padding:8px 14px;font-size:13px;margin-top:10px}
.btn.red{background:var(--red)}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.les{background:#fff;border-radius:16px;margin-bottom:10px;box-shadow:0 2px 6px rgba(0,0,0,.05);overflow:hidden;border-left:5px solid var(--teal)}
.les.done{border-left-color:var(--green)}
.les summary{padding:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center;list-style:none;cursor:pointer}
.les summary::-webkit-details-marker{display:none}
.les summary em{font-style:normal;color:var(--green);font-weight:700}
.les ul{padding:0 16px 0 34px}.les li{margin:6px 0;font-size:14.5px}
.les .lfoot{display:flex;gap:8px;padding:0 14px 14px;flex-wrap:wrap}
.spk{border:0;background:#e0f2f1;border-radius:10px;padding:8px 12px;margin-top:10px;font-size:13px}
.tabs{display:flex;background:#fff;border-radius:14px;padding:4px;margin:14px 0;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.tabs button{flex:1;border:0;background:none;padding:10px 4px;border-radius:10px;color:var(--mut);font-size:13.5px;font-weight:500}
.tabs button.on{background:var(--teal);color:#fff;font-weight:600}
.tcard{background:#fff;border-radius:16px;margin-bottom:10px;overflow:hidden;border:1.5px solid #d1e7e7}
.tcard .th{padding:10px 14px;display:flex;align-items:center;gap:10px;font-weight:600}
.tcard .tb{padding:10px 14px;font-size:13.5px;border-top:1px solid #eef2f2}
.tcard .tb .r{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
.badge{background:#2563eb;color:#fff;font-size:11px;padding:3px 10px;border-radius:8px 0 0 8px;margin-right:-14px}
.pct{font-weight:700;padding:3px 10px;border-radius:20px;font-size:13px}
.pct.g{background:#dcfce7;color:#166534}.pct.y{background:#fef3c7;color:#92400e}.pct.r{background:#fee2e2;color:#991b1b}
.lk{border:0;background:none;font-weight:700;font-size:12.5px;letter-spacing:.8px;color:var(--ink);padding:4px 0}
.lk.b{background:var(--ink);color:#fff;padding:7px 12px;border-radius:20px;letter-spacing:.3px}
.sbar{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:13px}.sbar span:first-child{width:120px;flex:none}
.sbar .tr{flex:1;height:10px;background:#eef2f2;border-radius:6px;overflow:hidden}.sbar .tr i{display:block;height:100%;border-radius:6px}
.sbar b{width:42px;text-align:right}
.trbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--navy);color:#fff}
.trbar b{flex:1}.trbar>span{background:rgba(255,255,255,.15);padding:5px 10px;border-radius:10px;font-size:13px}
.prog{height:6px;background:#cfe3e3}.prog i{display:block;height:100%;background:var(--amber);transition:width .3s}
.qcard{background:#fff;border-radius:20px;padding:18px;margin:14px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.qcard small{color:var(--mut);font-weight:600}.qcard h3{font-size:20px;margin:8px 0 14px;line-height:1.5;word-break:break-word}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px;text-align:left;display:flex;align-items:center;gap:12px;font-size:16px;color:var(--ink)}
.opt span{width:30px;height:30px;border-radius:50%;background:#eef2f2;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.opt.sel{border-color:var(--teal);background:#e6f6f6}.opt.sel span{background:var(--teal);color:#fff}
.qnav{padding:0 14px}
.rv{background:#fff;border-radius:14px;padding:12px;margin-bottom:8px;border-left:5px solid var(--green);font-size:14px}
.rv.x{border-left-color:var(--red)}.rv p{font-weight:600;margin-bottom:4px}.rv small{display:block;color:#4b5563}
.center{text-align:center}
.big{font-size:44px;font-weight:700}
.month{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 10px}
.month b{font-size:14px;letter-spacing:.8px}
.strip{display:flex;align-items:center;gap:4px}
.strip .ar{border:0;background:#fff;width:30px;height:56px;border-radius:10px;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.days{display:flex;gap:5px;flex:1;justify-content:space-between}
.day{border:1.5px solid #9ca3af;background:#fff;border-radius:50%;width:44px;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;line-height:1.1;color:#4b5563;position:relative;flex:none}
.day b{font-size:14px;color:var(--ink)}
.day.on{background:#111827;border-color:#111827;color:#d1d5db}.day.on b{color:#fff}
.day.td::after{content:'';position:absolute;bottom:-7px;width:6px;height:6px;border-radius:50%;background:var(--teal)}
.day.ev::before{content:'';position:absolute;top:1px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.period{display:flex;gap:10px;margin-bottom:8px}
.period .tm{width:66px;font-size:12px;color:#4b5563;padding-top:12px;flex:none}
.period .pc{flex:1;background:#fff;border-radius:12px;padding:10px 12px;border-left:4px solid var(--teal);box-shadow:0 1px 4px rgba(0,0,0,.04)}
.period .pc small{color:#2563eb;font-weight:600;font-size:11px;letter-spacing:.8px}
.period .pc b{display:block;font-size:15px}.period .pc span{font-size:12px;color:var(--mut)}
.period .pc.brk{background:#f3f4f6;border-left-color:#9ca3af}
.period .pc.now{background:#dbeafe;border-left-color:#2563eb;box-shadow:0 4px 12px rgba(37,99,235,.2)}
.now-tag{float:right;background:#2563eb;color:#fff;font-size:10px;padding:2px 8px;border-radius:8px}
.holiday{background:#fff;border-radius:18px;padding:30px;text-align:center;font-size:18px}
.task{display:flex;align-items:center;gap:10px;background:#fff;padding:12px;border-radius:14px;margin-bottom:8px}
.task div{flex:1}.task small{display:block;color:var(--mut);font-size:12px}
.concept{background:#cdeee3;border-radius:20px;padding:18px;margin-top:14px;position:relative}
.concept h3{font-size:18px}.concept p{font-size:13px;color:#4b5563;max-width:70%;margin:4px 0 8px}
.concept>span{position:absolute;right:18px;bottom:18px;font-size:50px}
.gtiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gt{border:0;border-radius:20px;padding:16px;text-align:left;min-height:130px;display:flex;flex-direction:column;justify-content:space-between;color:var(--ink);position:relative;box-shadow:0 4px 12px rgba(0,0,0,.07)}
.gt b{font-size:17px;line-height:1.25}.gt small{font-size:12px;color:#374151}.gt em{font-style:normal;font-weight:700;font-size:16px}
.gt i{position:absolute;right:12px;bottom:10px;font-size:40px;font-style:normal}
.gt.wide{grid-column:span 2;min-height:100px}
.lb{background:#fff;border-radius:16px;padding:6px 12px}
.lbr{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f1f5f9}
.lbr:last-child{border:0}.lbr .rk{width:28px;height:28px;border-radius:50%;background:#eef2f2;display:grid;place-items:center;font-weight:700;font-size:13px}
.lbr .nm{flex:1}.lbr.me{background:#ecfeff;border-radius:10px;padding-left:6px}
.gscore{text-align:center;margin:14px;font-size:16px}
.gq{background:#fff;margin:0 14px;border-radius:22px;padding:30px 10px;text-align:center;font-size:40px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.gemo{font-size:90px;text-align:center;line-height:1.2}
.gopts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 14px}
.gopts button{border:0;border-radius:18px;padding:18px 6px;font-size:26px;font-weight:700;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.08);color:var(--ink)}
.gopts button:active{transform:scale(.95)}
.gmsg{text-align:center;min-height:26px;font-weight:600;margin:8px}
.gmsg.ok{color:var(--green)}.gmsg.no{color:var(--red)}
.slots{display:flex;justify-content:center;gap:6px;margin:12px;flex-wrap:wrap}
.slots span{width:40px;height:46px;border-bottom:3px solid var(--navy);display:grid;place-items:center;font-size:26px;font-weight:700;text-transform:lowercase}
.ltiles{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:14px}
.ltiles button{width:50px;height:54px;border:0;border-radius:14px;background:#c9c3f7;font-size:24px;font-weight:700;box-shadow:0 3px 0 #9d94e8;color:var(--ink)}
.ltiles button:disabled{opacity:.25}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.hw{border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 2px 6px rgba(0,0,0,.05);border:1.5px solid rgba(0,0,0,.06)}
.hwt{font-size:15px;display:flex;gap:8px;align-items:flex-start}
.hw p{font-size:13px;color:#374151;margin:4px 0 0 28px}
.hw .st{display:block;margin:6px 0 0 28px;font-size:13px;font-weight:500}
.late{color:var(--red)}.due{color:#c2410c}.okc{color:#166534}
.hwa{display:flex;justify-content:flex-end;gap:14px;align-items:center;margin-top:8px}
.dline{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:13px;color:#374151}.dline::after{content:'';flex:1;height:1px;background:#d1d5db}
.dq{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px}
.dq small{color:var(--mut)}.dq p{margin:4px 0;font-weight:500}
.ans{background:#ecfdf5;border-radius:10px;padding:8px 10px;font-size:14px;color:#065f46}
.wait{font-size:13px;color:#92400e}
.empty{text-align:center;color:var(--mut);padding:30px 10px;background:#fff;border-radius:16px}
.list{display:flex;flex-direction:column;gap:8px}
.li{border:0;background:#fff;border-radius:14px;padding:15px;text-align:left;font-size:15px;display:flex;justify-content:space-between;align-items:center;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.05)}
.li span{color:var(--mut);font-size:13px}
.pt{font-size:20px;margin:6px 0 14px}
.login{padding:28px 18px;text-align:center}
.login .logo{font-size:64px}.login h1{font-size:23px;margin-top:6px}.login>p{color:var(--mut);margin:4px 0 18px}
.login .card{text-align:left}
.clsrow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cb{min-width:0;border:2px solid var(--line);background:#fff;border-radius:14px;height:50px;font-size:22px;font-weight:700;color:var(--ink)}
.cb.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:7px 12px;margin:4px 4px 0 0;font-size:13px;color:var(--ink)}
.link{border:0;background:none;color:var(--teal2);font-weight:600;margin-top:10px;padding:10px}
.bn{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#fff;display:flex;border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.bn button{flex:1;border:0;background:none;padding:8px 0 9px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px}
.bn button span{font-size:21px;filter:grayscale(1);opacity:.7}
.bn button.on{color:var(--teal2);font-weight:700}.bn button.on span{filter:none;opacity:1}
.ft{text-align:center;padding:18px 10px 8px;font-size:13px;color:var(--mut)}
.ft a{color:var(--teal2);font-weight:700;text-decoration:none}
.tchips{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:8px;margin-bottom:10px}
.tchips button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:8px 13px;font-size:13px;color:var(--ink)}
.tchips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.titem{background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.titem div{flex:1}.titem small{color:var(--mut);display:block}
.del{border:0;background:#fee2e2;color:#b91c1c;border-radius:8px;padding:6px 10px;font-size:12px;flex:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff;border-radius:12px;overflow:hidden}
.tbl th{background:var(--navy);color:#fff;padding:8px 6px;text-align:left;font-weight:600}
.tbl td{padding:8px 6px;border-bottom:1px solid #f1f5f9}
.tscroll{overflow-x:auto;border-radius:12px}
.inst{background:linear-gradient(135deg,#063a5b,#1d8c8c);color:#fff;border-radius:18px;padding:14px 16px;margin-top:14px;display:flex;align-items:center;gap:12px}
.inst img{width:46px;height:46px;border-radius:12px;flex:none}.inst div{flex:1;font-size:13px}.inst b{font-size:15px;display:block}
.inst button{border:0;background:#fde047;color:#111827;font-weight:700;padding:9px 14px;border-radius:20px;font-size:13px}

<body>
<div id="splash"><img src="icon-192.png" alt=""><b>రాయ్ విద్యార్థి</b><small>లెర్నింగ్ యాప్ • రాయ్ ఎడ్యుకేషన్</small></div>
<div id="app"></div>
<div id="toast"></div>
<script type="text/plain" id="gs-code">
/******************************************************************
 * రాయ్ ఎడ్యుకేషన్ – విద్యార్థి లెర్నింగ్ యాప్ సర్వర్ (Google Apps Script)
 * Google Sheet → Extensions → Apps Script లో ఈ కోడ్ పేస్ట్ చేసి
 * Deploy → New deployment → Web app
 *   Execute as: Me   |   Who has access: Anyone
 * PDF అప్‌లోడ్ కోసం: ఫంక్షన్ లిస్ట్‌లో driveSetup ఎంచుకుని ▶ Run → Allow
 ******************************************************************/
var SCHOOL_KEY  = '__SCHOOL_KEY__';   // విద్యార్థుల కీ (జాయిన్ లింక్‌లో వెళ్తుంది)
var TEACHER_KEY = '__TEACHER_KEY__';  // ఉపాధ్యాయుల కీ – ఎవరికీ ఇవ్వకండి
var ALL_COLS = ['students','hw','events','doubts','notes','results','games','subs','teachers','roster','marks','qb','papers'];
var TEACHER_COLS = ['hw','events','notes','roster','marks','qb','papers'];
var PRIV = ['students','results','doubts','subs'];  // విద్యార్థికి తన డేటా మాత్రమే
var SUBJ = {tel:'తెలుగు', hin:'హిందీ', eng:'English', mat:'గణితం', evs:'పరిసరాల విజ్ఞానం', sci:'సైన్స్', phy:'భౌతిక శాస్త్రం', bio:'జీవ శాస్త్రం', soc:'సాంఘిక శాస్త్రం'};

function db_() {
  var ss = SpreadsheetApp.getActive(), sh = ss.getSheetByName('DB');
  if (!sh) {
    sh = ss.insertSheet('DB');
    sh.getRange('A:F').setNumberFormat('@');
    sh.appendRow(['key','col','id','srv','upd','json']);
    sh.setFrozenRows(1);
  }
  return sh;
}
function json_(o) {
  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
}

/* ఉపాధ్యాయుల సొంత కీలు (ప్రధానోపాధ్యాయులు యాప్‌లో జోడిస్తారు) */
function tkeys_() {
  var c = CacheService.getScriptCache(), h = c.get('tkeys');
  if (h) return JSON.parse(h);
  var sh = db_(), n = sh.getLastRow(), out = {};
  if (n > 1) {
    var v = sh.getRange(2, 2, n - 1, 5).getValues();
    for (var i = 0; i < v.length; i++) {
      if (v[i][0] !== 'teachers') continue;
      try { var d = JSON.parse(v[i][4]); if (!d.del && d.key) out[d.key] = {id: d.id, n: d.n, cls: d.cls || [], subs: d.subs || []}; } catch (x) {}
    }
  }
  c.put('tkeys', JSON.stringify(out), 600);
  return out;
}
function who_(k) {
  if (k && k === TEACHER_KEY) return {isT: true, admin: true};
  if (k && k === SCHOOL_KEY) return {isT: false};
  var m = k ? tkeys_()[k] : null;
  return m ? {isT: true, admin: false, me: m} : null;
}
function cleanT_(col, js, admin) {
  if (col !== 'teachers' || admin) return js;
  try { var d = JSON.parse(js); delete d.key; return JSON.stringify(d); } catch (x) { return js; }
}

/* డేటా చదవడం (pull) */
function doGet(e) {
  var p = (e && e.parameter) || {};
  if (p.a === 'ping') return json_({ok:true, up:true, roster:true, qp:true});
  var w = who_(p.k);
  if (!w) return json_({ok:false, err:'key'});
  if (p.a === 'card') return card_(p, db_(), SpreadsheetApp.getActive().getName(), 'cardf_one');
  var isT = w.isT, since = Number(p.since || 0), cc = CacheService.getScriptCache(), lc = Number(cc.get('chg') || 0);
  // ⚡ మార్పు లేకపోతే షీట్ చదవకుండానే జవాబు
  if (since > 0 && lc > 0 && lc <= since) return json_({ok:true, now:since, rows:[], teacher:isT, admin:!!w.admin, me:w.me || null});
  var lock = LockService.getScriptLock(); lock.waitLock(20000);
  try {
    var sh = db_(), n = sh.getLastRow(), max = since, rows = [];
    if (n > 1) {
      var v = sh.getRange(2, 1, n - 1, 6).getValues();
      for (var i = 0; i < v.length; i++) {
        var srv = Number(v[i][3]);
        if (srv > max) max = srv;
        if (srv <= since) continue;
        if (!isT && PRIV.indexOf(v[i][1]) >= 0) { var o = ''; try { o = JSON.parse(v[i][5]).o || ''; } catch (x) {} if (!o || o !== p.dev) continue; }
        if (TONLY.indexOf(v[i][1]) >= 0 && (!isT || !tonlyOk_(v[i][1], v[i][5], w.me))) continue;
        rows.push([v[i][1], String(v[i][2]), cleanT_(v[i][1], v[i][5], w.admin)]);
      }
    }
    if (!lc && max > 0) cc.put('chg', String(max), 21600);
    return json_({ok:true, now:max, rows:rows, teacher:isT, admin:!!w.admin, me:w.me || null});
  } finally { lock.releaseLock(); }
}

/* డేటా పంపడం (push) */
function doPost(e) {
  var b;
  try { b = JSON.parse(e.postData.contents); } catch (x) { return json_({ok:false, err:'bad'}); }
  var w = who_(b.k);
  if (!w) return json_({ok:false, err:'key'});
  if (b.a === 'up') return up_(b, w, '');
  if (b.a === 'rm') return rm_(b, w, '');
  var isT = w.isT, tch = false;
  var lock = LockService.getScriptLock(); lock.waitLock(20000);
  try {
    var sh = db_(), n = sh.getLastRow(), idx = {};
    if (n > 1) sh.getRange(2, 1, n - 1, 1).getValues().forEach(function (r, i) { idx[r[0]] = i + 2; });
    var srv = Date.now(), done = [], rej = [], add = [], uniq = {};
    (b.recs || []).forEach(function (r) { if (r && r.col && r.id != null) uniq[r.col + '|' + r.id] = r; });
    Object.keys(uniq).forEach(function (key) {
      var r = uniq[key], d = r.data || {};
      if (ALL_COLS.indexOf(r.col) < 0 || (TEACHER_COLS.indexOf(r.col) >= 0 && !isT) || (r.col === 'teachers' && !w.admin) || !tonlyOk_(r.col, JSON.stringify(d), w.me)) { rej.push(key); return; }
      if (r.col === 'teachers') tch = true;
      var row = idx[key];
      if (row) {
        var old = {};
        try { old = JSON.parse(sh.getRange(row, 6).getValue() || '{}'); } catch (x) {}
        if (Number(old.upd || 0) > Number(d.upd || 0)) { done.push(key); return; }
        if (!isT && old.o && old.o !== b.dev) { rej.push(key); return; }
        if (r.col === 'doubts' && !isT) { d.r = old.r || ''; d.ra = old.ra || 0; }
        sh.getRange(row, 1, 1, 6).setValues([[key, r.col, String(r.id), String(srv), String(d.upd || 0), JSON.stringify(d)]]);
      } else {
        if (r.col === 'doubts' && !isT) d.r = '';
        add.push([key, r.col, String(r.id), String(srv), String(d.upd || 0), JSON.stringify(d)]);
      }
      done.push(key);
    });
    if (add.length) sh.getRange(sh.getLastRow() + 1, 1, add.length, 6).setValues(add);
    var cc = CacheService.getScriptCache();
    if (done.length) cc.put('chg', String(Math.max(Number(cc.get('chg') || 0), srv)), 21600);
    if (tch) cc.remove('tkeys');
    return json_({ok:true, done:done, rej:rej, teacher:isT, admin:!!w.admin});
  } finally { lock.releaseLock(); }
}

function clean_(v, n) { return String(v == null ? '' : v).replace(/[<>]/g, '').trim().slice(0, n); }

/* 🎓 విద్యార్థి ప్రగతి కార్డు – విద్యార్థి ID + పుట్టిన తేదీ సరిపోతేనే, తన రికార్డు మాత్రమే */

        var old = {};

        if (Number(old.upd || 0) > Number(d.upd || 0)) { done.push(key); return; }
        if (!a.isT && old.o && old.o !== b.dev) { rej.push(key); return; }
        if (r.col === 'doubts' && !a.isT) { d.r = old.r || ''; d.ra = old.ra || 0; }
        sh.getRange(row, 1, 1, 6).setValues([[key, r.col, String(r.id), String(srv), String(d.upd || 0), JSON.stringify(d)]]);
      } else {
        if (r.col === 'doubts' && !a.isT) d.r = '';
        add.push([key, r.col, String(r.id), String(srv), String(d.upd || 0), JSON.stringify(d)]);
      }
      done.push(key);
    });
    // కొత్త వరుసలు చేర్చడం & మార్పు సమయం – క్షణంలో అయిపోయే చిన్న భాగం మాత్రమే అందరికీ ఒకే తాళంతో
    var gl = LockService.getScriptLock(); gl.waitLock(25000);
    try {
      if (add.length) sh.getRange(sh.getLastRow() + 1, 1, add.length, 6).setValues(add);
      var cc = CacheService.getScriptCache(), ck = 'chg_' + a.sc.id;
      if (done.length) cc.put(ck, String(Math.max(Number(cc.get(ck) || 0), srv)), 21600);
    } finally { gl.releaseLock(); }
    if (tch) CacheService.getScriptCache().remove('tk_' + a.sc.id);
    return json_({ok: true, done: done, rej: rej, teacher: a.isT, admin: !!a.admin});
  } finally { unlock(); }
}

/* 📤 PDF అప్‌లోడ్ – యజమాని Google Drive లో “Raay_Vidyarthi_PDFs” ఫోల్డర్‌లో సేవ్ అవుతాయి.
   మొదటిసారి: పైన ఫంక్షన్ లిస్ట్‌లో driveSetup ఎంచుకుని ▶ Run → Allow చేయండి. */
var UP_MAX_MB = 20, SCHOOL_MAX_MB = 500, UP_PER_HOUR = 40;
function driveSetup() { folder_('Raay_Vidyarthi_PDFs'); Logger.log('Drive అనుమతి సరే ✓'); }
function folder_(name, parent) {
  var it = parent ? parent.getFoldersByName(name) : DriveApp.getFoldersByName(name);
  while (it.hasNext()) { var f = it.next(); if (!f.isTrashed()) return f; }
  return parent ? parent.createFolder(name) : DriveApp.createFolder(name);
}
function upFolder_(sid) { var root = folder_('Raay_Vidyarthi_PDFs'); return sid ? folder_(sid, root) : root; }
function used_(f) { var t = 0, it = f.getFiles(); while (it.hasNext()) { var x = it.next(); if (!x.isTrashed()) t += x.getSize(); } return t; }
function up_(b, a, sid) {
  if (!a.isT) return json_({ok: false, err: 'key'});
  if (a.me && a.me.cls && a.me.cls.length && a.me.cls.map(Number).indexOf(Number(b.c)) < 0) return json_({ok: false, err: 'key'});
  var i = Number(b.i), n = Number(b.n), u = String(b.u || '').replace(/[^\w-]/g, '').slice(0, 40), data = String(b.data || '');
  if (!u || !(n >= 1 && n <= 14) || !(i >= 0 && i < n) || data.length > 2100000 || /[^A-Za-z0-9+\/=]/.test(data)) return json_({ok: false, err: 'bad'});
  var isImg = b.kind === 'img';  // 📷 సందేహాల జవాబు ఫోటోలు
  try {
    var sf = upFolder_(sid), dst = isImg ? folder_('answers', sf) : sf, tmp = folder_('_tmp', sf);
    if (i === 0) {
      var c = CacheService.getScriptCache(), ck = (isImg ? 'upi_' : 'up_') + (sid || 'one'), cnt = Number(c.get(ck) || 0);
      if (cnt >= (isImg ? 300 : UP_PER_HOUR)) return json_({ok: false, err: 'busy'});
      c.put(ck, String(cnt + 1), 3600);
    }
    if (i < n - 1) { tmp.createFile(u + '_' + i, data, MimeType.PLAIN_TEXT); return json_({ok: true, got: i}); }
    var parts = [], old = [];
    for (var k = 0; k < n - 1; k++) {
      var it = tmp.getFilesByName(u + '_' + k), f = null;
      while (it.hasNext()) { var y = it.next(); if (!y.isTrashed()) f = y; }
      if (!f) return json_({ok: false, err: 'part'});
      parts.push(f.getBlob().getDataAsString()); old.push(f);
    }
    parts.push(data);
    var bytes = Utilities.base64Decode(parts.join(''));
    parts = null;
    old.forEach(function (f) { f.setTrashed(true); });
    var cut = Date.now() - 86400000, it2 = tmp.getFiles();
    while (it2.hasNext()) { var x = it2.next(); if (!x.isTrashed() && x.getDateCreated().getTime() < cut) x.setTrashed(true); }
    if (bytes.length > (isImg ? 3 : UP_MAX_MB) * 1048576) return json_({ok: false, err: 'big'});
    var mime = 'application/pdf', name;
    if (isImg) {
      if (bytes[0] === -1 && bytes[1] === -40) mime = 'image/jpeg';
      else if (bytes[0] === -119 && bytes[1] === 80) mime = 'image/png';
      else if (bytes[0] === 82 && bytes[1] === 73 && bytes[8] === 87 && bytes[9] === 69) mime = 'image/webp';
      else return json_({ok: false, err: 'pdf'});
      name = 'answer_' + Utilities.formatDate(new Date(), 'Asia/Kolkata', 'yyyyMMdd_HHmmss') + '_' + u.slice(0, 6) + '.' + mime.split('/')[1].replace('jpeg', 'jpg');
    } else {
      if (!(bytes[0] === 37 && bytes[1] === 80 && bytes[2] === 68 && bytes[3] === 70)) return json_({ok: false, err: 'pdf'});
      if (used_(sf) + bytes.length > SCHOOL_MAX_MB * 1048576) return json_({ok: false, err: 'quota'});
      name = clean_(b.name, 90).replace(/[\\\/:*?"|]/g, '-') || 'book.pdf';
      if (!/\.pdf$/i.test(name)) name += '.pdf';
    }
    var file = dst.createFile(Utilities.newBlob(bytes, mime, name));
    file.setSharing(DriveApp.Access.ANYONE_WITH_LINK, DriveApp.Permission.VIEW);
    file.setDescription('Raay Vidyarthi ' + (sid || '') + ' – ' + (b.c || '') + 'వ తరగతి');
    return json_({ok: true, got: i, id: file.getId(), url: 'https://drive.google.com/file/d/' + file.getId() + '/view'});
  } catch (x) { return json_({ok: false, err: 'drive', msg: String(x).slice(0, 200)}); }
}
function rm_(b, a, sid) {

  try {
    var f = DriveApp.getFileById(String(b.fid || '')), sf = upFolder_(sid), ps = f.getParents(), mine = false;
    while (ps.hasNext()) if (ps.next().getId() === sf.getId()) mine = true;

    f.setTrashed(true);

}

function reg_(b) {
  var name = clean_(b.name, 80), place = clean_(b.place, 80), teacher = clean_(b.teacher, 60), phone = clean_(b.phone, 15);
  if (name.length < 3) return json_({ok: false, err: 'name'});

  if (cnt >= MAX_REG_PER_HOUR) return json_({ok: false, err: 'busy'});

    var skey = 's' + rnd_(10), tkey = 't' + rnd_(14);

/* 🎓 విద్యార్థి ప్రగతి కార్డు – విద్యార్థి ID + పుట్టిన తేదీ సరిపోతేనే, తన రికార్డు మాత్రమే */
var TONLY = ['roster', 'marks', 'qb'];  // విద్యార్థులకు ఎప్పుడూ పంపము
function sha_(t) { return Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, t, Utilities.Charset.UTF_8).map(function (b) { return ('0' + (b & 255).toString(16)).slice(-2); }).join(''); }
function tonlyOk_(col, js, me) {
  if (TONLY.indexOf(col) < 0 || !me || !me.cls || !me.cls.length) return true;
  var c = 0; try { c = Number(JSON.parse(js).c) || 0; } catch (x) {}
  return me.cls.map(Number).indexOf(c) >= 0;
}
function card_(p, sh, school, fk) {
  var cache = CacheService.getScriptCache(), dk = fk + '_' + String(p.dev || '').replace(/\W/g, '').slice(0, 24), bad = Number(cache.get(fk) || 0), bd = Number(cache.get(dk) || 0);
  if (bad >= 200 || bd >= 10) return json_({ok: false, err: 'busy'});  // తప్పు ప్రయత్నాలు: ఒక ఫోన్ 10, పాఠశాల 200 / గంట
  var sid = String(p.sid || '').replace(/\D/g, '').slice(0, 20), dob = String(p.dob || '').trim();
  if (!sid || !/^\d{4}-\d{2}-\d{2}$/.test(dob)) return json_({ok: false, err: 'card'});
  var n = sh.getLastRow(), r = null, mk = [];
  if (n > 1) {
    var v = sh.getRange(2, 1, n - 1, 6).getValues(), rk = 'roster|rs_' + sid, mp = 'marks|mk_' + sid + '_';
    for (var i = 0; i < v.length; i++) {
      var key = String(v[i][0]);
      if (key === rk) { try { r = JSON.parse(v[i][5]); } catch (x) {} }
      else if (key.indexOf(mp) === 0) { try { var d = JSON.parse(v[i][5]); if (!d.del) mk.push({s: d.s, a: d.a || {}}); } catch (x) {} }
    }
  }
  if (!r || r.del || !r.h || r.h !== sha_(sid + '|' + dob)) { cache.put(fk, String(bad + 1), 3600); cache.put(dk, String(bd + 1), 3600); return json_({ok: false, err: 'card'}); }
  return json_({ok: true, r: {sid: r.sid, n: r.n, c: r.c, sec: r.sec || '', att: r.att || [], yr: r.yr || ''}, m: mk, school: school || ''});
}

/* ఒక పాఠశాల తాళం (CacheService) – 30 సెకన్లలో దానంతట అదే విడుదల */
function slock_(id) {
  var c = CacheService.getScriptCache(), k = 'lk_' + id, tok = Utilities.getUuid(), t0 = Date.now();
  while (Date.now() - t0 < 20000) {
    if (!c.get(k)) {
      c.put(k, tok, 30); Utilities.sleep(40);
      if (c.get(k) === tok) return function () { if (c.get(k) === tok) c.remove(k); };
    }
    Utilities.sleep(120 + Math.floor(Math.random() * 180));
  }
  return null;
}

/* 📦 పాత టెస్ట్ ఫలితాలు, ఆటలు, హోంవర్క్ సమర్పణలు, సందేహాలు వేరే ఫైల్‌కు – ప్రధాన షీట్ తేలికగా, వేగంగా */
function archiveOld() {
  var ui = SpreadsheetApp.getUi();
  var r = ui.prompt('📦 పాత డేటా ఆర్కైవ్', 'ఈ తేదీ కంటే ముందున్న టెస్ట్ ఫలితాలు, ఆటల స్కోర్లు, హోంవర్క్ సమర్పణలు, సందేహాలు కొత్త ఫైల్‌కు మారుతాయి.\n(విద్యార్థులు, ఉపాధ్యాయులు, పాఠాలు, పుస్తకాలు, హోంవర్క్‌లు అలాగే ఉంటాయి)\n\nతేదీ ఇవ్వండి – ఉదా: 2027-06-01', ui.ButtonSet.OK_CANCEL);

  if (!m) { ui.alert('తేదీ ఇలా ఇవ్వండి: 2027-06-01'); return; }

  var OLD = ['results', 'games', 'subs', 'doubts'], arc = null, moved = 0, skipped = [];

      v.forEach(function (row) { var t = Number(row[4] || 0) || Number(row[3] || 0); (OLD.indexOf(String(row[1])) >= 0 && t > 0 && t < cut ? out : keep).push(row); });

/* 📏 ఏ పాఠశాలకు ఎన్ని వరుసలు – 1 కోటి సెల్స్ పరిమితికి ఎంత దూరం */

function schoolReport() {

  function by(c) { return all.filter(function (x) { return x.col === c; }).map(function (x) { return x.d; }); }

function put_(name, head, rows) {

const $=s=>document.querySelector(s);
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseD(s){const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function todayS(){return ymd(new Date());}
function addDays(s,n){const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d);}
function diffDays(a,b){return Math.round((parseD(a)-parseD(b))/864e5);}
function fmtD(s){if(!s)return '';const d=s.length===10?parseD(s):new Date(s);return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear();}
function fmtLong(s){const d=parseD(s);return DAYF[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear();}
function to12(t){if(!t)return '';let [h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+String(m).padStart(2,'0')+' '+ap;}
function mmss(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2000);}

function ring(p,sz,col){sz=sz||96;col=col||'#f59e0b';const r=sz/2-8,C=2*Math.PI*r,off=C*(1-p/100);return `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" style="flex:none"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="#fff7e0" stroke-width="9"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 ${sz/2} ${sz/2})"/><text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" font-size="${Math.round(sz/4.6)}" font-weight="700" fill="#1f2937">${p}%</text></svg>`;}

function migrate(d){
 if(!d.dev){d.dev=newDev();const mine=new Set((d.local||[]).map(x=>x.n));if(d.cur)mine.add(d.cur.n);d.q=d.q||{};
  ['students','results','doubts','subs'].forEach(c=>(d[c]||[]).forEach(r=>{if(!r.o&&mine.has(r.n)){r.o=d.dev;r.upd=(r.upd||1)+1;if(d.cfg&&d.cfg.type)d.q[c+'|'+r.id]=r.upd;}}));}
 if(d.cur&&!d.cfg.type&&d.offline===undefined)d.offline=true;
 if(!d.cfg)d.cfg={type:''};
 if(d.students.length&&!d.students[0].id){d.local=d.students.map(s=>({n:s.n,c:s.c}));d.students=d.students.map(s=>({id:sid(s.n),n:s.n,c:s.c,upd:Date.now()}));}
 d.hw.forEach(h=>{if(h.sub){Object.entries(h.sub).forEach(([n,dt])=>d.subs.push({id:h.id+'|'+sid(n),hw:h.id,n,c:h.c,d:dt,upd:Date.now()}));delete h.sub;}});
 COLS.forEach(c=>d[c].forEach(r=>{if(!r.id)r.id=uid();if(!r.upd)r.upd=1;}));
 return d;}

const Sync={st:'off',msg:'',timer:null,poll:null,primed:false,running:false,
 later(){clearTimeout(this.timer);this.timer=setTimeout(()=>this.run(),1200);},
 set(st,msg){this.st=st;this.msg=msg||'';const b=document.getElementById('syncb');if(b)b.textContent=syncIcon();const s=document.getElementById('syncst');if(s)s.innerHTML=syncLine();},

   if(S.cfg.type==='gs'){await GS.push();await GS.pull();this.primed=true;}
   else{if(!FBK.ready){await FBK.start();}else await FBK.push();}
   S.lastSync=Date.now();save();this.set('ok');}catch(e){this.set('err',String((e&&e.message)||e));}finally{this.running=false;}},
 start(){if(!S.cfg.type)return;this.run();clearInterval(this.poll);if(S.cfg.type==='gs')this.poll=setInterval(()=>{if(document.visibilityState!=='hidden')this.run();},S.cfg.sid?60000:45000);}
};

 key(){return S.cfg.tkey||S.cfg.key;},

  const j=await (await fetch(u)).json();if(!j.ok)throw new Error(gsErr(j.err));

  applyIncoming((j.rows||[]).map(([col,id,js])=>{try{return [col,JSON.parse(js)];}catch(e){return [col,null];}}));},
 async push(){const all=Object.keys(S.q),ks=all.slice(0,250);if(!ks.length)return;const sent={};

const FBB='https://www.gstatic.com/firebasejs/10.12.2/';
const FBK={ready:false,user:null,
 async init(){if(this.ready)return;
  const [A,F,U]=await Promise.all([import(FBB+'firebase-app.js'),import(FBB+'firebase-firestore.js'),import(FBB+'firebase-auth.js')]);
  this.F=F;this.U=U;const app=A.initializeApp(S.cfg.fb);this.db=F.getFirestore(app);this.auth=U.getAuth(app);
  U.onAuthStateChanged(this.auth,u=>{this.user=u;S.cfg.isT=!!(u&&u.email&&S.cfg.temail&&u.email.toLowerCase()===S.cfg.temail.toLowerCase());save();if(u)this.push().catch(()=>{});if(view==='teacher')softRender();});
  this.ready=true;},
 async start(){await this.init();this.listen();await this.push();setTimeout(()=>{Sync.primed=true;},5000);},
 listen(){const F=this.F;COLS.filter(c=>c!=='roster'&&c!=='marks').forEach(col=>{
  const q=F.query(F.collection(this.db,'schools',S.cfg.school,col),F.where('srv','>',F.Timestamp.fromMillis(S.last[col]||0)));
  F.onSnapshot(q,snap=>{const ch=[];snap.docChanges().forEach(c=>{if(c.type==='removed')return;const x=c.doc.data();const ms=x.srv&&x.srv.toMillis?x.srv.toMillis():0;if(ms>(S.last[col]||0))S.last[col]=ms;delete x.srv;ch.push([col,x]);});
   S.lastSync=Date.now();applyIncoming(ch);save();Sync.set('ok');},e=>Sync.set('err',e.message));});},
 async push(){if(!this.ready)return;const F=this.F;
  for(const k of Object.keys(S.q)){const i=k.indexOf('|');const col=k.slice(0,i),id=k.slice(i+1);const d=(S[col]||[]).find(x=>x.id===id);const sent=S.q[k];
   if(!d){delete S.q[k];continue;}
   try{await F.setDoc(F.doc(this.db,'schools',S.cfg.school,col,id),Object.assign(JSON.parse(JSON.stringify(d)),{srv:F.serverTimestamp()}));if(S.q[k]===sent)delete S.q[k];}
   catch(e){if(e&&e.code==='permission-denied'){delete S.q[k];dropLocal(k);toast('అనుమతి లేదు: '+col);}else throw e;}}
  save();},
 async login(email,pw){await this.init();await this.U.signInWithEmailAndPassword(this.auth,email,pw);},
 async logout(){if(this.ready)await this.U.signOut(this.auth);}
};

function me(){return S.cur.n;}
function lessonsOf(c,s){const b=((L[c]||{})[s]||[]).map((x,i)=>({k:'b'+i,t:x[0],b:x[1].split('|')}));
 const n=live('notes').filter(x=>!x.kind&&x.c===c&&x.s===s).map(x=>({k:'n'+x.id,t:x.t,b:String(x.x||'').split('\n').filter(Boolean),tn:1,img:x.img||''}));return b.concat(n);}
function readMap(){return S.read[me()]||(S.read[me()]={});}
function isRead(k){return !!readMap()[k];}
function readPct(s){const c=S.cur.c,ls=lessonsOf(c,s);if(!ls.length)return 0;return Math.round(ls.filter(l=>isRead(c+'-'+s+'-'+l.k)).length*100/ls.length);}
function myRes(){return live('results').filter(r=>r.n===me()&&r.c===S.cur.c);}
function myScored(){return myRes();}
function avgOf(rs){return rs.length?Math.round(rs.reduce((a,x)=>a+x.s*100/x.t,0)/rs.length):0;}
function stats(){const r=myScored();const by={};subjectsFor(S.cur.c).forEach(s=>{const rs=r.filter(x=>x.sb===s);by[s]=rs.length?avgOf(rs):null;});return {avg:avgOf(r),n:r.length,by};}
function perfMsg(a,n){if(!n)return 'ఇంకా టెస్ట్ రాయలేదు. మొదటి టెస్ట్ రాసి నీ ప్రదర్శన చూడు!';if(a>=80)return 'అద్భుతం! ఇలాగే కొనసాగించు 🌟';if(a>=60)return 'బాగుంది! ఇంకా మెరుగ్గా చేయగలవు. శుభాకాంక్షలు!';return 'పర్వాలేదు! రోజూ సాధన చేస్తే తప్పకుండా మెరుగవుతావు 💪';}
function myHw(){return live('hw').filter(h=>h.c===S.cur.c).sort((a,b)=>a.due<b.due?-1:1);}
function subOf(h){const x=live('subs').find(s=>s.hw===h.id&&s.n===me()&&(!s.o||s.o===S.dev));return x&&x.d;}
function pendingHw(){return myHw().filter(h=>!subOf(h));}
function eventsOn(d){return live('events').filter(e=>e.d===d&&(e.c===0||e.c===S.cur.c)).sort((a,b)=>(a.tm||'')<(b.tm||'')?-1:1);}
function upcoming(n){const t=todayS();return live('events').filter(e=>e.d>=t&&(e.c===0||e.c===S.cur.c)).sort((a,b)=>(a.d+a.tm)<(b.d+b.tm)?-1:1).slice(0,n);}
function dueText(h){const sd=subOf(h);const d=diffDays(h.due,todayS());
 if(sd)return `<span class="st okc">✓ సమర్పించారు: ${fmtD(sd)}</span>`;
 if(d<0)return `<span class="st late">${-d} రోజులు ఆలస్యం (గడువు: ${fmtD(h.due)})</span>`;
 if(d===0)return `<span class="st late">ఈరోజే గడువు</span>`;
 if(d===1)return `<span class="st due">రేపే గడువు</span>`;
 return `<span class="st due">ఇంకా ${d} రోజుల గడువు</span>`;}

 while(d.firstChild)document.body.appendChild(d.firstChild);

function slCtx(){const cv=document.getElementById('slCv'),x=cv.getContext('2d');x.setTransform(SL.dpr,0,0,SL.dpr,0,0);x.lineCap='round';x.lineJoin='round';return x;}
function slStyle(x,s){x.lineWidth=s.w;x.strokeStyle=s.c;x.fillStyle=s.c;x.globalCompositeOperation=s.er?'destination-out':'source-over';}
function slSeg(s){const x=slCtx(),p=s.p,n=p.length;slStyle(x,s);x.beginPath();
 if(n===1){x.arc(p[0][0],p[0][1],s.w/2,0,Math.PI*2);x.fill();return;}
 if(n===2){x.moveTo(p[0][0],p[0][1]);x.lineTo(p[1][0],p[1][1]);x.stroke();return;}
 const a=p[n-3],b=p[n-2],c=p[n-1];x.moveTo((a[0]+b[0])/2,(a[1]+b[1])/2);x.quadraticCurveTo(b[0],b[1],(b[0]+c[0])/2,(b[1]+c[1])/2);x.stroke();}
function slDraw(x,s){const p=s.p;slStyle(x,s);x.beginPath();
 if(p.length===1){x.arc(p[0][0],p[0][1],s.w/2,0,Math.PI*2);x.fill();return;}
 x.moveTo(p[0][0],p[0][1]);if(p.length===2)x.lineTo(p[1][0],p[1][1]);else{x.lineTo((p[0][0]+p[1][0])/2,(p[0][1]+p[1][1])/2);for(let i=1;i<p.length-1;i++)x.quadraticCurveTo(p[i][0],p[i][1],(p[i][0]+p[i+1][0])/2,(p[i][1]+p[i+1][1])/2);x.lineTo(p[p.length-1][0],p[p.length-1][1]);}x.stroke();}

 const y=slCtx();SL.strokes.slice(lc+1).forEach(s=>slDraw(y,s));}

 const d=await slGet(k+'#p'+i);if(SL.key!==k||SL.page!==i)return;
 if(d&&d.img){const im=new Image();im.onload=()=>{if(SL.key===k&&SL.page===i)slRedraw();};im.src=d.img;SL.base=im;SL.bw=d.pw||0;}}

function slFlush(){if(SL.cur){SL.strokes.push(SL.cur);SL.cur=null;}SL.pid=null;slSave();}

async function slAddPage(){if(SL.busy)return;if(SL.n>=SLMAXP)return toast('ఒక విభాగానికి గరిష్ఠంగా '+SLMAXP+' పేజీలు');SL.busy=true;
 try{slFlush();const k=SL.key;for(let j=SL.n-1;j>SL.page;j--)await slPut(k+'#p'+(j+1),await slGet(k+'#p'+j));
  await slPut(k+'#p'+(SL.page+1),null);SL.n++;await slLoadPage(SL.page+1);slMeta();toast('కొత్త పేజీ '+(SL.page+1)+' ✓');}finally{SL.busy=false;}}
async function slDelPage(){if(SL.busy)return;if(!confirm(`పేజీ ${SL.page+1} తొలగించాలా?`))return;SL.busy=true;
 try{const k=SL.key;if(SL.n<=1){SL.strokes=[];SL.base=null;SL.cur=null;slRedraw();slSave();toast('పేజీ తుడిచాం');return;}
  for(let j=SL.page;j<SL.n-1;j++)await slPut(k+'#p'+j,await slGet(k+'#p'+(j+1)));
  await slPut(k+'#p'+(SL.n-1),null);SL.n--;await slLoadPage(Math.min(SL.page,SL.n-1));slMeta();toast('పేజీ తొలగించాం');}finally{SL.busy=false;}}

 slPut(SL.key+'#p'+SL.page,slEmpty()?null:{img:cv.toDataURL('image/png'),pw:cv.width});slMeta();}

function noteFile(ext){return 'Raay_Vidyarthi_School_Note_'+(S.cfg.sid||'school')+'.'+ext;}
async function noteCanvas(){const d=noteData();const W=1080,cv=document.createElement('canvas');const ctx=cv.getContext('2d');
 const F=(w,s)=>`${w} ${s}px "Noto Sans Telugu","Poppins",sans-serif`;
 function wrap(t,font,max){ctx.font=font;const out=[];let line='';for(const ch of String(t).split(/(\s+)/)){const tryL=line+ch;if(ctx.measureText(tryL).width>max&&line.trim()){out.push(line.trim());line=ch.trimStart();}else line=tryL;}if(line.trim())out.push(line.trim());
  return out.flatMap(l=>{if(ctx.measureText(l).width<=max)return [l];const r=[];let cur='';for(const c of l){if(ctx.measureText(cur+c).width>max){r.push(cur);cur=c;}else cur+=c;}if(cur)r.push(cur);return r;});}
 const items=[['h',d.name,F(700,52),'#063a5b'],['s',[d.place,d.teacher?'ఉపాధ్యాయులు: '+d.teacher:''].filter(Boolean).join(' • '),F(500,32),'#4b5563'],['gap'],
  ['l','పాఠశాల కోడ్ (విద్యార్థులకు ఇవ్వండి)',F(500,30),'#6b7280'],['h',d.sid,F(700,96),'#063a5b'],['gap'],
  ['l','టీచర్ కీ (రహస్యం – ఎవరికీ ఇవ్వకండి)',F(500,30),'#6b7280'],['h',d.tkey,F(700,48),'#b91c1c'],['gap'],
  ['l','విద్యార్థుల జాయిన్ లింక్',F(500,30),'#6b7280'],['s',d.join,F(500,26),'#1f2937'],['gap'],['l','యాప్ లింక్',F(500,30),'#6b7280'],['s',d.app,F(500,28),'#1f2937']];
 try{await document.fonts.ready;}catch(e){}
 const lines=[];let H=230;items.forEach(it=>{if(it[0]==='gap'){lines.push(['gap']);H+=26;return;}if(!it[1])return;const sz=parseInt(it[2].split(' ')[1]);wrap(it[1],it[2],W-140).forEach(t=>{lines.push([t,it[2],it[3],sz]);H+=sz*1.35;});});H+=140;
 cv.width=W;cv.height=Math.ceil(H);ctx.fillStyle='#fffbea';ctx.fillRect(0,0,W,cv.height);
 ctx.fillStyle='#063a5b';ctx.fillRect(0,0,W,170);ctx.fillStyle='#fff';ctx.font=F(700,44);ctx.fillText('📚 రాయ్ విద్యార్థి లెర్నింగ్ యాప్',60,80);ctx.font=F(500,32);ctx.fillStyle='#fde047';ctx.fillText('📝 పాఠశాల సేవ్ నోట్',60,135);
 let y=230;lines.forEach(l=>{if(l[0]==='gap'){y+=26;return;}ctx.font=l[1];ctx.fillStyle=l[2];ctx.fillText(l[0],70,y+l[3]*0.9);y+=l[3]*1.35;});
 ctx.strokeStyle='#d4a017';ctx.setLineDash([14,10]);ctx.lineWidth=4;ctx.strokeRect(30,195,W-60,cv.height-280);
 ctx.setLineDash([]);ctx.fillStyle='#0f766e';ctx.font=F(600,30);ctx.fillText('రాయ్ ఎడ్యుకేషన్ • raayeducation.in',60,cv.height-40);return cv;}
async function noteImage(){try{const cv=await noteCanvas();const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download=noteFile('png');document.body.appendChild(a);a.click();a.remove();toast('ఫోటో సేవ్ అయింది ✓ (Downloads)');}catch(e){toast('ఫోటో కాలేదు – కాపీ వాడండి');}}
async function noteShare(){try{const cv=await noteCanvas();const blob=await new Promise(r=>cv.toBlob(r,'image/png'));const f=new File([blob],noteFile('png'),{type:'image/png'});
 if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'పాఠశాల సేవ్ నోట్',text:noteText()});return;}}catch(e){if(e&&e.name==='AbortError')return;}

async function joinByCode(){const code=$('#jsc').value.trim().toUpperCase();if(code.length<4)return toast('పాఠశాల కోడ్ రాయి');const ps=pubServer();if(!ps)return toast('ఇంటర్నెట్ ఆన్ చేసి మళ్ళీ ప్రయత్నించు');
 const b=$('#jsbtn');if(b){b.disabled=true;b.textContent='వెతుకుతోంది...';}
 try{const j=await (await fetch(ps+'?a=join&s='+encodeURIComponent(code)+'&_='+Date.now())).json();if(!j.ok)throw new Error(gsErr(j.err));

/* ---------- ✎ రోజువారీ లెక్కలు (+ − × ÷ – ఒక్కో ప్రక్రియకు 4) – వెంటనే జవాబు, మార్కులు, ర్యాంక్ ---------- */
const WSO={add:{s:'+',c:'#2b8a3e',n:'కూడిక'},sub:{s:'−',c:'#d6336c',n:'తీసివేత'},mul:{s:'×',c:'#1c7ed6',n:'గుణకారం'},div:{s:'÷',c:'#7048e8',n:'భాగాహారం'}};

 brw(a,b){let c=0,br=0;for(let i=0;i<3;i++){const x=WSU.dg(a,i),y=WSU.dg(b,i)+br;if(x<y){c++;br=1;}else br=0;}return c;},

/* ఒక్కో స్థాయి: 4 కూడికలు, 4 తీసివేతలు, 4 గుణకారాలు (2 అం×1 – 2, 3 అం×1 – 2), 4 భాగాహారాలు (2 అం – 2, 3 అం – 2) */
const WSLV=(()=>{const {ri,dg,rej,brw}=WSU;return [
 {t:'సులభం',d:'2 అంకెల + −, × 2–3, ÷ 2',r:[
  ['add',4,()=>rej(()=>[ri(10,99),ri(10,99)],([a,b])=>dg(a,0)+dg(b,0)>=10)],
  ['sub',4,()=>rej(()=>{const a=ri(20,99);return[a,ri(10,a-1)];},([a,b])=>dg(a,0)<dg(b,0))],
  ['mul',2,()=>[ri(11,49),ri(2,3)]],['mul',2,()=>[ri(100,499),2]],
  ['div',2,()=>[ri(10,99),2]],['div',2,()=>[ri(100,999),2]]]},
 {t:'మధ్యస్థం',d:'3 అంకెల + −, × 2–5, ÷ 2–5',r:[
  ['add',4,()=>[ri(100,999),ri(100,999)]],
  ['sub',4,()=>rej(()=>{const a=ri(200,999);return[a,ri(100,a-1)];},([a,b])=>brw(a,b)>=1)],
  ['mul',2,()=>[ri(11,99),ri(2,5)]],['mul',2,()=>[ri(100,999),ri(2,5)]],
  ['div',2,()=>rej(()=>[ri(10,99),ri(2,5)],([a,d])=>a>=d*2)],['div',2,()=>[ri(100,999),ri(2,5)]]]},
 {t:'కఠినం',d:'3 అంకెల + −, × 4–9, ÷ 3–9',r:[
  ['add',4,()=>rej(()=>[ri(100,999),ri(100,999)],([a,b])=>dg(a,0)+dg(b,0)>=10||dg(a,1)+dg(b,1)>=10)],
  ['sub',4,()=>rej(()=>{const a=ri(200,999);return[a,ri(100,a-1)];},([a,b])=>brw(a,b)===2)],
  ['mul',2,()=>[ri(11,99),ri(4,9)]],['mul',2,()=>[ri(100,999),ri(4,9)]],
  ['div',2,()=>rej(()=>[ri(10,99),ri(3,9)],([a,d])=>a>=d*2)],['div',2,()=>[ri(100,999),ri(3,9)]]]}];})();
/* తరగతి వారీ నేటి పత్రం స్థాయి */

const WSZ=(()=>{const {dg}=WSU;return [p=>p.a>=10&&dg(p.a,0)===0,p=>p.a>=100&&dg(p.a,1)===0,p=>p.b>=10&&dg(p.b,0)===0,p=>p.x>=10&&/0/.test(String(p.x)),p=>p.b>=100&&dg(p.b,1)===0,p=>p.a>=100&&p.a%100===0];})();
function wsMk(o,[a,b]){const p={o,a,b};if(o==='add')p.x=a+b;else if(o==='sub')p.x=a-b;else if(o==='mul')p.x=a*b;else{p.x=Math.floor(a/b);p.rm=a%b;}return p;}
function wsGen(lv,seed){WSU.rnd=WSU.seed(seed);const seen=new Set();let zi=0;const out=[];
 try{WSLV[lv-1].r.forEach(([o,n,g])=>{for(let i=0;i<n;i++){const want=i%2===0?WSZ[(zi++)%WSZ.length]:null;let p=null;
  const tries=[...(want?[[want,300],[q=>WSZ.some(f=>f(q)),300]]:[]),[()=>true,80]];
  for(const [f,m] of tries){for(let t=0;t<m&&!p;t++){const q=wsMk(o,g());if(!seen.has(o+q.a+'_'+q.b)&&f(q))p=q;}if(p)break;}
  if(!p)p=wsMk(o,g());seen.add(o+p.a+'_'+p.b);out.push(p);}});}finally{WSU.rnd=Math.random;}return out;}

function wsSteps(p){const st=[],la=wsLa(p);
 if(p.o==='add'||p.o==='mul'){for(let pl=0;pl<la;pl++){st.push({id:(pl<la-1?'c':'a')+(pl+1),opt:1,pl,ty:pl<la-1?'cr':'lead'});st.push({id:'a'+pl,pl,ty:'ans'});}}
 else if(p.o==='sub'){for(let pl=0;pl<la;pl++){if(pl<la-1){st.push({id:'t'+pl,opt:1,pl,ty:'tp'});st.push({id:'b'+(pl+1),opt:1,pl,ty:'bp'});}st.push({id:'a'+pl,pl,ty:'ans',opt:pl===la-1&&la>1?1:0});}}
 else{const n=WSU.L(p.a);for(let k=0;k<n;k++){st.push({id:'q'+k,k,ty:'q',opt:1});st.push({id:'p'+k,k,ty:'p',multi:1});st.push({id:'w'+k,k,ty:'w'});}st.push({id:'rm',ty:'rm'});}

function genMental(c){let q,a;const k=R(0,2);
 if(c===1){if(k<2){const x=R(1,9),y=R(1,9);q=`${x} + ${y}`;a=x+y;}else{const x=R(5,18),y=R(1,x);q=`${x} − ${y}`;a=x-y;}}
 else if(c===2){if(k===0){const x=R(10,50),y=R(5,30);q=`${x} + ${y}`;a=x+y;}else if(k===1){const x=R(20,60),y=R(5,x-1);q=`${x} − ${y}`;a=x-y;}else{const x=R(2,5),y=R(1,10);q=`${x} × ${y}`;a=x*y;}}
 else if(c===3){if(k===0){const x=R(20,80),y=R(10,60);q=`${x} + ${y}`;a=x+y;}else if(k===1){const x=R(2,10),y=R(2,10);q=`${x} × ${y}`;a=x*y;}else{const d=R(2,10),y=R(2,10);q=`${d*y} ÷ ${d}`;a=y;}}
 else if(c===4){if(k===0){const x=R(11,30),y=R(2,9);q=`${x} × ${y}`;a=x*y;}else if(k===1){const d=R(2,9),y=R(5,20);q=`${d*y} ÷ ${d}`;a=y;}else{const x=R(100,500),y=R(50,99);q=`${x} − ${y}`;a=x-y;}}
 else if(c>=6){const kk=R(0,4);if(kk===0){const x=R(-20,20),y=R(-20,20);q=`(${x}) + (${y})`;a=x+y;return {q:q+' = ?',a:String(a),o:numOptsZ(a,5)};}
  else if(kk===1){const x=c>=8?R(11,30):R(11,20);q=`${x}²`;a=x*x;}else if(kk===2){const pc=[10,20,25,50,75][R(0,4)],n=R(1,c>=8?20:10)*20;q=`${n} లో ${pc}%`;a=n*pc/100;}
  else if(kk===3){if(c>=8){const x=R(2,10);q=`${x}³`;a=x**3;}else{const x=R(12,40),y=R(3,9);q=`${x} × ${y}`;a=x*y;}}
  else{const x=R(2,c>=8?15:10),y=R(2,9);q=`${y}x = ${x*y} అయితే x`;a=x;}}
 else{if(k===0){const x=R(11,20),y=R(3,9);q=`${x} × ${y}`;a=x*y;}else if(k===1){const d=R(11,20),y=R(3,12);q=`${d*y} ÷ ${d}`;a=y;}else{const x=R(2,15);q=`${x} × ${x}`;a=x*x;}}
 return {q:q+' = ?',a:String(a),o:numOpts(a,a>40?10:4)};}
function startGame(g){G={g,score:0,left:GAMES[g].sec,done:false,used:[],msg:'',mc:''};nextRound();go('gamerun');

function nextRound(){const c=S.cur.c;
 if(G.g==='mm')G.cur=genMental(c);
 else if(G.g==='tl'){let pool=TEL.filter(x=>!G.used.includes(x[1]));if(!pool.length){G.used=[];pool=TEL;}const it=pool[R(0,pool.length-1)];G.used.push(it[1]);
  const o=new Set([it[2]]);while(o.size<4)o.add(TEL[R(0,TEL.length-1)][2]);G.cur={e:it[0],w:it[1],a:it[2],o:shuffle([...o])};}
 else if(G.g==='vw'){const p0=VW[c>=8?1:0];let pool=p0.filter(x=>!G.used.includes(x[0]));if(!pool.length){G.used=[];pool=p0;}const it=pool[R(0,pool.length-1)];G.used.push(it[0]);
  let tl=shuffle(it[0].split(''));let g2=0;while(tl.join('')===it[0]&&g2++<10)tl=shuffle(tl);G.cur={e:'',hint:it[1],w:it[0],tiles:tl.map(l=>({l,u:false})),typed:[]};}
 else if(G.g==='tf')G.cur=tfItem(c);
 else if(G.g==='hw'){let pool=HWD.filter(x=>!G.used.includes(x[0]));if(!pool.length){G.used=[];pool=HWD;}const it=pool[R(0,pool.length-1)];G.used.push(it[0]);
  const o=new Set([it[1]]);let g3=0;while(o.size<4&&g3++<60)o.add(HWD[R(0,HWD.length-1)][1]);G.cur={e:it[0],a:it[1],o:shuffle([...o])};}
 else{const max={1:3,2:4,3:5,4:7}[c]||99;let pool=WORDS.filter(w=>w[1].length<=max&&!G.used.includes(w[1]));if(!pool.length){G.used=[];pool=WORDS.filter(w=>w[1].length<=max);}
  const it=pool[R(0,pool.length-1)];G.used.push(it[1]);let tl=shuffle(it[1].split(''));let g2=0;while(tl.join('')===it[1]&&g2++<10)tl=shuffle(tl);
  G.cur={e:it[0],w:it[1],tiles:tl.map(l=>({l,u:false})),typed:[]};}}

function mmPick(j){const c=G.cur;beep(c.o[j]===c.a?'ok':'no');if(c.o[j]===c.a){G.score++;G.msg='✓ సరైనది!';G.mc='ok';}else{G.msg=`✗ సరైన జవాబు: ${c.q.replace('?',c.a)}`;G.mc='no';}nextRound();upd();}
function tlPick(j){const c=G.cur;beep(c.o[j]===c.a?'ok':'no');if(c.o[j]===c.a){G.score++;G.msg=`✓ సరైనది! ${c.e} ${c.w}`;G.mc='ok';}else{G.msg=`✗ ${c.e} ${c.w} – మొదటి అక్షరం "${c.a}"`;G.mc='no';}speak(c.w);nextRound();upd();}
function ewTap(i){const c=G.cur;if(c.tiles[i].u)return;c.tiles[i].u=true;c.typed.push(i);
 if(c.typed.length===c.w.length){const s=c.typed.map(k=>c.tiles[k].l).join('');
  beep(s===c.w?'ok':'no');if(s===c.w){G.score++;G.msg=`✓ సరైనది! ${c.w}`;G.mc='ok';speak(c.w);nextRound();upd();}
  else{G.msg='✗ మళ్ళీ ప్రయత్నించు';G.mc='no';c.typed=[];c.tiles.forEach(t=>t.u=false);upd(true);}}
 else{G.msg='';upd();}}

/* ================= 🧑‍🎓 విద్యార్థుల జాబితా + ప్రగతి (FA-1 → SA-2, హాజరు) ================= */
const PG_A=['FA1','FA2','SA1','FA3','FA4','SA2'],PG_AL={FA1:'FA-1',FA2:'FA-2',SA1:'SA-1',FA3:'FA-3',FA4:'FA-4',SA2:'SA-2',ANN:'వార్షికం'};

const PG_T1=[0,1,2,3,4,5],PG_T2=[6,7,8,9,10];
const PG_SC={P:[['A+',91],['A',71],['B+',51],['B',41],['C',0]],H:[['A1',91],['A2',81],['B1',71],['B2',61],['C1',51],['C2',41],['D1',35],['D2',0]],L2:[['A1',90],['A2',79],['B1',68],['B2',57],['C1',46],['C2',35],['D1',20],['D2',0]]};
const PG_MAP={'First Language':'tel','Second Language':'hin','English':'eng','Mathematics':'mat','EVS':'evs','General Science':'sci','Physical Science':'phy','Biological Science':'bio','Social Studies':'soc'};
const PG_ONLY=['roster','marks'];
function pgSc(c,s){return c<=5?'P':s==='hin'?'L2':'H';}
function pgGrade(p,sc){if(p==null||isNaN(p))return '';const q=Math.round(p);for(const [g,m] of PG_SC[sc])if(q>=m)return g;return PG_SC[sc][PG_SC[sc].length-1][0];}
function pgGcl(g,sc){const G=PG_SC[sc],i=G.findIndex(x=>x[0]===g);return i<0?'':'pg'+(1+Math.floor(i*5/G.length));}
function pgFaMax(c,s){return c>=8&&(s==='phy'||s==='bio')?[5,5,5,10]:[5,5,5,35];}
function pgSaMax(c,s){return c<=5?50:(s==='phy'||s==='bio')?50:100;}
function pgSaN(c){return c<=5?6:1;}
function r1(x){return Math.round(x*10)/10;}
function pgRes(c,s,A,v){if(v==null)return null;
 if(!Array.isArray(v)){if(v.ab)return {ab:1};if(v.tot==null||!v.max)return null;const p=Math.min(100,v.tot/v.max*100);return {tot:v.tot,max:v.max,p,g:pgGrade(p,pgSc(c,s)),pt:1};}
 if(!v.some(x=>x!==null&&x!==''&&x!==undefined))return null;if(v.some(x=>String(x).toUpperCase()==='AB'))return {ab:1};
 const max=A[0]==='F'?pgFaMax(c,s).reduce((a,b)=>a+b,0):pgSaMax(c,s),tot=v.reduce((a,x)=>a+(+x||0),0),p=Math.min(100,tot/max*100);return {tot,max,p,g:pgGrade(p,pgSc(c,s)),t:v};}
function pgRoster(c){return live('roster').filter(r=>!c||r.c===+c).sort((a,b)=>(a.ord||0)-(b.ord||0)||String(a.n).localeCompare(String(b.n)));}
function pgMkMap(sid){const o={};live('marks').filter(m=>m.sid===sid).forEach(m=>o[m.s]=m.a||{});return o;}
function pgCls(){const have=new Set(live('roster').map(r=>r.c));return myCls().filter(c=>have.has(c));}
function pgAtt(att,idx){let w=0,p=0;(idx||PG_T1.concat(PG_T2)).forEach(i=>{const a=(att||[])[i];if(a&&+a[0]>0){w+=+a[0];p+=Math.min(Math.max(+a[1]||0,0),+a[0]);}});return {w,p,pc:w?p*100/w:null};}
function pgAllA(c,mk,A){const rs=subjectsFor(c).map(s=>A==='ANN'?pgAnn(c,s,mk[s]):pgRes(c,s,A,(mk[s]||{})[A])),v=rs.filter(r=>r&&!r.ab);const p=v.length?v.reduce((a,r)=>a+r.p,0)/v.length:null;return {rs,p,g:pgGrade(p,c<=5?'P':'H')};}
function pgAnn(c,s,a){const v=PG_A.map(A=>pgRes(c,s,A,(a||{})[A])).filter(r=>r&&!r.ab);if(!v.length)return null;const p=v.reduce((x,r)=>x+r.p,0)/v.length;return {p,g:pgGrade(p,pgSc(c,s))};}
function pgLast(c,mk){for(let i=PG_A.length-1;i>=0;i--){const x=pgAllA(c,mk,PG_A[i]);if(x.p!=null)return {A:PG_A[i],...x};}return null;}
function pgCell(r,sc){return r?(r.ab?'<td class="ab">AB</td>':`<td>${r.tot!=null?`<small>${r1(r.tot)}/${r.max}</small>`:`<small>${r1(r.p)}%</small>`}<span class="gd ${pgGcl(r.g,sc)}">${r.g}</span></td>`):'<td class="na">–</td>';}

${subs.map(s=>`<tr><td class="s">${SUBJ[s].n}</td>${PG_A.map(A=>pgCell(pgRes(c,s,A,(mk[s]||{})[A]),pgSc(c,s))).join('')}${(()=>{const x=pgAnn(c,s,mk[s]);return x?`<td><small>${r1(x.p)}%</small><span class="gd ${pgGcl(x.g,pgSc(c,s))}">${x.g}</span></td>`:'<td class="na">–</td>';})()}</tr>`).join('')}
<tr class="tot"><td class="s">మొత్తం</td>${PG_A.concat(['ANN']).map(A=>{const x=pgAllA(c,mk,A);return x.p==null?'<td class="na">–</td>':`<td><small>${r1(x.p)}%</small><span class="gd ${pgGcl(x.g,sc)}">${x.g}</span></td>`;}).join('')}</tr></table></div>
<h4 class="pgh4">📅 హాజరు</h4><div class="tscroll"><table class="tbl pgt pgatt"><tr><th>నెల</th>${PG_MON.map(m=>`<th>${m.slice(0,3)}</th>`).join('')}</tr>
<tr><td class="s">పనిదినాలు</td>${PG_MON.map((_,i)=>{const a=(r.att||[])[i];return `<td>${a&&+a[0]>0?a[0]:''}</td>`;}).join('')}</tr>
<tr><td class="s">హాజరు</td>${PG_MON.map((_,i)=>{const a=(r.att||[])[i];return `<td>${a&&+a[0]>0?Math.max(+a[1]||0,0):''}</td>`;}).join('')}</tr></table></div>
<div class="pgatts">${['TERM-1','TERM-2','సంవత్సరం'].map((t,i)=>`<div class="${at[i].pc!=null&&at[i].pc<75?'low':''}"><small>${t}</small><b>${at[i].pc==null?'–':r1(at[i].pc)+'%'}</b><small>${at[i].w?at[i].p+'/'+at[i].w:''}</small></div>`).join('')}</div>
<p class="pgleg">గ్రేడ్లు: ${PG_SC[sc].map(([g,m],i,a)=>`${g} ${m}${i?'–'+(a[i-1][1]-1):'–100'}`).join(' • ')}${c>5?' (హిందీ వేరు స్కేల్)':''}</p></div>`;}

function ansScale(src,w){let cur=src,cw=src.width,ch=src.height;const h=Math.round(ch*w/cw);
 while(cw/2>=w){const c=document.createElement('canvas');c.width=Math.round(cw/2);c.height=Math.round(ch/2);const x=c.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(cur,0,0,c.width,c.height);cur=c;cw=c.width;ch=c.height;}
 const o=document.createElement('canvas');o.width=w;o.height=h;const x=o.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(cur,0,0,w,h);return o;}
function ansClean(src,w){const cv=ansScale(src,w),h=cv.height,x=cv.getContext('2d');const id=x.getImageData(0,0,w,h),d=id.data,n=w*h,g=new Uint8ClampedArray(n);
 for(let i=0;i<n;i++)g[i]=(d[i*4]*.3+d[i*4+1]*.59+d[i*4+2]*.11)|0;

   if(c.type&&c.isT&&!same&&!confirm('ఈ ఫోన్‌లో వేరే ఉపాధ్యాయ సెటప్ ఉంది. మార్చాలా?'))return false;
   if(!/^https:\/\/script\.google\.com\//.test(p.u)||!p.k)throw 0;

  if(c.type&&c.isT&&((p.t==='gs'&&c.url===p.u&&(c.sid||'')===(p.s||''))||(p.t==='fb'&&c.school===p.s))){setTimeout(()=>toast('ఈ ఫోన్ ఇప్పటికే ఉపాధ్యాయ సెటప్‌తో కనెక్ట్ అయి ఉంది ✓'),300);return true;}

function shrinkImage(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
 let w=Math.min(720,im.width),q=0.72,out='';const cv=document.createElement('canvas'),cx=cv.getContext('2d');
 for(let k=0;k<14;k++){const h=Math.round(im.height*w/im.width);cv.width=w;cv.height=h;cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(im,0,0,w,h);out=cv.toDataURL('image/jpeg',q);
  if(out.length<=17500)break;if(q>0.42)q-=0.1;else w=Math.round(w*0.82);}
 out.length<=17500?res(out):rej(new Error('big'));};im.src=fr.result;};fr.readAsDataURL(file);});}

function checkBadges(){if(!S.cur)return;const sk=streak();S.best=S.best||{};if(sk>(S.best[me()]||0))S.best[me()]=sk;
 S.bseen=S.bseen||{};const seen=S.bseen[me()]||(S.bseen[me()]=[]);const got=badgeList().filter(b=>b[3]&&!seen.includes(b[1]));
 if(got.length){got.forEach(b=>seen.push(b[1]));save();setTimeout(()=>{toast('🏅 కొత్త బ్యాడ్జ్: '+got[0][0]+' '+got[0][1]+(got.length>1?' (+'+(got.length-1)+')':''));beep('win');confetti();},600);}else save();}
V.badges=()=>{const bl=badgeList();return `<div class="bar"><button class="ib" onclick="go('home')">←</button><h2>🏅 నా బ్యాడ్జీలు</h2></div>
<div class="card center"><div style="font-size:46px">${avOf(me())}</div><h3>${esc(me())}</h3><p>🏅 ${bl.filter(b=>b[3]).length} / ${bl.length} బ్యాడ్జీలు • ⭐ ${stars()} స్టార్లు • 🔥 ${streak()} రోజులు</p></div>
<div class="bgrid">${bl.map(b=>`<div class="bdg ${b[3]?'got':''}"><span>${b[3]?b[0]:'🔒'}</span><b>${b[1]}</b><small>${b[2]}</small></div>`).join('')}</div>`;};
let AC=null;
function beep(kind){if(S.sound===false)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const seq={ok:[[660,.08],[880,.12]],no:[[220,.18]],win:[[523,.1],[659,.1],[784,.1],[1047,.22]]}[kind]||[];
 let t=AC.currentTime;seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=kind==='no'?'square':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d;});}catch(e){}}
function toggleSound(){S.sound=S.sound===false;save();toast(S.sound?'🔊 శబ్దాలు ఆన్':'🔇 శబ్దాలు ఆఫ్');render();}

/* ---------- PWA: ఇన్‌స్టాల్ & ఆఫ్లైన్ ---------- */
let instEvt=null;
function isStandalone(){try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true||document.referrer.startsWith('android-app://');}catch(e){return false;}}
function installBanner(){if(isStandalone()||!/^https?:$/.test(location.protocol))return '';let hide=false;try{hide=localStorage.getItem('raiInstHide')===todayS();}catch(e){}if(hide)return '';
 return `<div class="inst"><img src="icon-192.png" alt=""><div><b>యాప్‌గా ఇన్‌స్టాల్ చేయి</b>హోమ్ స్క్రీన్‌పై ఐకాన్, ఇంటర్నెట్ లేకున్నా పనిచేస్తుంది</div><button onclick="installApp()">ఇన్‌స్టాల్</button><button style="background:none;color:#fff;padding:4px" onclick="try{localStorage.setItem('raiInstHide',todayS())}catch(e){};render()">✕</button></div>`;}
async function installApp(){if(instEvt){instEvt.prompt();const r=await instEvt.userChoice;instEvt=null;if(r.outcome==='accepted')toast('ఇన్‌స్టాల్ అవుతోంది ✓');render();}
 else alert(/iphone|ipad/i.test(navigator.userAgent)?'Safari లో Share ⬆️ → “Add to Home Screen” నొక్కండి.':'Chrome మెనూ ⋮ → “Install app” లేదా “Add to Home screen” నొక్కండి.');}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();instEvt=e;});
window.addEventListener('appinstalled',()=>{instEvt=null;toast('🎉 యాప్ ఇన్‌స్టాల్ అయింది');});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{});}

/* ---------- ప్రారంభం ---------- */
try{speechSynthesis.getVoices();}catch(e){}
(function(){const h=location.hash||'';const m=h.match(/join=([A-Za-z0-9_\-]+)/);if(m)joinWith(m[1]);const g=h.match(/go=(\w+)/);if(g&&V[g[1]])view=g[1];if(m||g){try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}}})();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')Sync.run();});
window.addEventListener('online',()=>Sync.run());
markDay();render();
(function(){const sp=document.getElementById('splash');if(!sp)return;let seen=false;try{seen=sessionStorage.getItem('raiSplash')==='1';sessionStorage.setItem('raiSplash','1');}catch(e){}
 if(seen){sp.remove();return;}setTimeout(()=>{sp.classList.add('out');setTimeout(()=>sp.remove(),500);},900);})();
if(S.cfg.type)Sync.start();
if(/^https?:$/.test(location.protocol))loadPubCfg();

/* 📤 PDF నేరుగా అప్‌లోడ్ (Google Sheets సర్వర్ → యజమాని Google Drive) */
const UPMAX=20*1048576,UPCH=2000000;let UPBUSY=false;
function bkFile(inp){const f=inp.files&&inp.files[0];const n=document.getElementById('bkfn');if(!f){if(n)n.textContent='ఫైల్ ఎంచుకోలేదు';return;}
 if(n)n.innerHTML=`📄 <b>${esc(f.name)}</b> • ${mb(f.size)}${f.size>UPMAX?' <span style="color:#dc2626">(20 MB కంటే పెద్దది)</span>':''}`;const t=document.getElementById('bkt');if(t&&!t.value.trim())t.value=prettyName(f.name);}
function upProg(p,msg){const b=document.getElementById('bkp');if(!b)return;b.hidden=false;const i=b.querySelector('i'),s=b.querySelector('span');if(p>=0)i.style.width=p+'%';i.style.background=p<0?'#fca5a5':'';s.textContent=msg;}
function upErr(e){return {key:'అనుమతి లేదు – మీ తరగతికి మాత్రమే అప్‌లోడ్ చేయగలరు',big:'ఫైల్ 20 MB కంటే పెద్దది – Compress చేయండి',pdf:'ఇది PDF ఫైల్ కాదు',quota:'పాఠశాల PDF స్థలం (500 MB) నిండింది – పాత పుస్తకాలు తొలగించండి',busy:'ఈ గంటలో అప్‌లోడ్ పరిమితి దాటింది – కాసేపాగి ప్రయత్నించండి',drive:'సర్వర్‌కు Google Drive అనుమతి లేదు – యజమాని Apps Script లో driveSetup ▶ Run చేయాలి',part:'అప్‌లోడ్ మధ్యలో తెగింది – మళ్ళీ ప్రయత్నించండి',bad:'అప్‌లోడ్ అభ్యర్థన తప్పు – మళ్ళీ ప్రయత్నించండి'}[e]||gsErr(e);}
function b64File(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const s=String(r.result);ok(s.slice(s.indexOf(',')+1));};r.onerror=()=>no(new Error('ఫైల్ చదవలేకపోయాం'));r.readAsDataURL(f);});}
const UPOLD='సర్వర్ కోడ్ పాతది – పబ్లిక్ సర్వర్ కోడ్ మార్చి New version Deploy చేయాలి';
async function upPdf(f,c,prog){prog(1,'ఫైల్ సిద్ధం చేస్తోంది...');const data=await b64File(f);const n=Math.ceil(data.length/UPCH),u=uid();let j=null;
 for(let i=0;i<n;i++){const part=data.slice(i*UPCH,(i+1)*UPCH);prog(Math.max(2,Math.round(i*95/n)),i===n-1?'Drive లో సేవ్ చేస్తోంది... (కొంచెం సమయం పడుతుంది)':'అప్‌లోడ్ అవుతోంది '+Math.round(i*100/n)+'%');j=null;
  for(let a=0;a<3&&!j;a++){try{const r=await fetch(S.cfg.url,{method:'POST',body:JSON.stringify({a:'up',s:S.cfg.sid,k:GS.key(),dev:S.dev,u,i,n,c,name:f.name,data:part})});j=await r.json();}catch(e){j=null;if(a<2)await new Promise(z=>setTimeout(z,1500*(a+1)));}}
  if(!j)throw new Error('ఇంటర్నెట్ సమస్య – నెట్ చూసి మళ్ళీ ప్రయత్నించండి');
  if(!j.ok)throw new Error(upErr(j.err));
  if(j.got!==i)throw new Error(UPOLD);}
 if(!j||!j.url)throw new Error(UPOLD);prog(100,'✓ అప్‌లోడ్ పూర్తయింది');return j.url;}
async function upBook(){const fi=document.getElementById('bkf'),f=fi&&fi.files&&fi.files[0];if(!f)return;
 const t=$('#bkt').value.trim()||prettyName(f.name),c=+$('#bkc').value,s=$('#bkcs').value;
 if(S.cfg.type!=='gs')return toast('PDF అప్‌లోడ్‌కు ఆన్‌లైన్ సింక్ (Google Sheets) కావాలి – లేదా Drive లింక్ ఇవ్వండి');
 if(!S.cfg.isT)return toast('ఉపాధ్యాయ కీతో కనెక్ట్ అయితేనే అప్‌లోడ్ చేయగలరు');
 if(!/\.pdf$/i.test(f.name)&&f.type!=='application/pdf')return toast('PDF ఫైల్ మాత్రమే అప్‌లోడ్ చేయగలరు');
 if(f.size>UPMAX)return toast(`ఫైల్ ${mb(f.size)} – 20 MB లోపు ఉండాలి (ilovepdf.com → Compress PDF)`);
 if(UPBUSY)return;UPBUSY=true;const btn=document.getElementById('bkbtn');if(btn){btn.disabled=true;btn.textContent='⏳ అప్‌లోడ్ అవుతోంది...';}
 try{const url=await upPdf(f,c,upProg);put('notes',{id:uid(),kind:'book',c,s,t,url,fid:driveId(url),up:1,x:''});toast('PDF అప్‌లోడ్ అయింది ✓ పిల్లలకు కనిపిస్తుంది');go('teacher',{t:'lb'});}
 catch(e){upProg(-1,'❌ '+e.message);toast(e.message);}
 finally{UPBUSY=false;const b2=document.getElementById('bkbtn');if(b2){b2.disabled=false;b2.textContent='➕ పుస్తకం జోడించు';}}}
function delBook(id){if(!confirm('తొలగించాలా?'))return;const n=live('notes').find(x=>x.id===id);
 if(n&&n.up&&n.fid&&S.cfg.type==='gs')fetch(S.cfg.url,{method:'POST',body:JSON.stringify({a:'rm',s:S.cfg.sid,k:GS.key(),dev:S.dev,fid:n.fid})}).catch(()=>{});
 remove('notes',id);go('teacher',{t:'lb'});}

</script>
